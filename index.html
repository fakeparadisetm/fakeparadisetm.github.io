<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FakeParadise™</title>
<link rel="preload" as="image" href="icons/startup%20icon%20web.png">
<link rel="preload" as="image" href="icons/startup%20icon2%20base.png">
<link rel="preload" as="image" href="icons/startup%20icon2%20palm%20left.png">
<link rel="preload" as="image" href="icons/startup%20icon2%20palm%20right.png">
<style>
  :root{
    --bg-0:#04080c;
    --bg-1:#0d1f30;
    --blue:#5aa8c2;
    --blue-soft:#3d7f9c;
    --blue-dim:#1c3646;
    --accent-rgb:90,168,194;
    --accent2-rgb:60,110,140;
    --sale-rgb:217,185,106;
    --bg-0-hex:#04080c;
    --bg-1-hex:#0d1f30;
    --white:#ffffff;
    --white-60:rgba(255,255,255,0.55);
    --white-35:rgba(255,255,255,0.3);
    --sale:#d9b96a;
    --tint-neutral:rgba(255,255,255,0.7); /* marque et horloge : neutre, légèrement teinté par l'ambiance */
    --footer-h:30px; /* hauteur réelle de la banderole légale, resynchronisée en JS */
    --xmb-bar:35vh;  /* hauteur du centre de la barre d'icônes XMB (50vh = milieu ; remontée pour
                        laisser 5 produits visibles sous la sélection sur un écran 1080p) */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none!important;}
  /* les boutons n'héritent pas de la police par défaut (police système du
     navigateur, graisse 400) : on les aligne sur le site */
  button{font-family:inherit;font-weight:inherit;}

  /* ---------- police ----------
     Inter, police variable libre (licence SIL OFL 1.1, voir fonts/README.txt),
     servie par le site lui-même : rendu identique partout, sans service
     tiers. Graisse de base 450, un cran au-dessus du Regular (choix
     utilisateur : « un peu plus grasse ») ; les autres graisses du site
     suivent d'un cran (550, 650), le gras reste 700. */
  @font-face{
    font-family:"Inter";
    src:url("fonts/InterVariable.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"Inter";
    src:url("fonts/InterVariable-Italic.woff2") format("woff2");
    font-weight:100 900;font-style:italic;font-display:swap;
  }
  html,body{
    height:100%;
    background:var(--bg-0);
    /* Inter d'abord ; à défaut Helvetica si installée, sinon Arial */
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:450;
    color:var(--white);
    overflow:hidden;
    user-select:none;
  }

  /* ---------- wave background ---------- */
  #waveCanvas{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:0;
    background:#04080c; /* si la carte graphique lâche le contexte, le fond reste sombre */
    /* le demi-pixel de flou servait à masquer les jointures des tranches du
       ruban peint au pinceau ; le rendu GPU n'en a plus */
    filter:saturate(1.05);
  }
  #waveCanvasGlow{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:0;
    /* le canvas est au quart de la résolution : son agrandissement floute déjà
       beaucoup, un rayon de 6 px suffit là où il en fallait 22, pour bien moins
       cher (le flou plein écran était le poste le plus lourd sous Firefox) */
    filter:blur(6px) saturate(1.1) brightness(1.1);
    opacity:0.55;
    mix-blend-mode:screen;
  }

  /* ---------- scintillement des vagues ----------
     Particules lumineuses accrochées aux nappes de vagues (voir drawSparkles).
     Sous la vignette pour que les bords restent sombres. */
  #sparkleCanvas{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:2;
    pointer-events:none;
    mix-blend-mode:screen;
  }

  .glow-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(100px);
    z-index:1;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:0.35;
  }
  .glow-orb.a{
    width:46vw;height:46vw;
    background:radial-gradient(circle, rgba(var(--accent-rgb),0.4), transparent 70%);
    top:-14vw; left:-10vw;
    animation:drift1 26s ease-in-out infinite;
  }
  .glow-orb.b{
    width:38vw;height:38vw;
    background:radial-gradient(circle, rgba(var(--accent2-rgb),0.35), transparent 70%);
    bottom:-16vw; right:-8vw;
    animation:drift2 30s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(3vw,4vw) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-3vw,-3vw) scale(1.1); }
  }

  .vignette{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,2,4,0.92) 100%);
    z-index:2;
    pointer-events:none;
  }

  .scanlines{
    position:fixed;inset:0;
    z-index:2;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    opacity:0.45;
  }

  /* ---------- écran de démarrage (façon console) ----------
     Comme sur la PS3 : le ruban ondule déjà sur un fond assombri, le logo se
     révèle dessus, puis tout fond vers le XMB. Pendant ce temps l'interface
     est rendue mais invisible (body.booting) et réapparaît en fondu. */
  .startup-tint{
    position:fixed;inset:0;
    z-index:3; /* au-dessus des canvas et de la vignette, sous l'interface */
    background:
      radial-gradient(ellipse at 50% 55%, rgba(var(--accent2-rgb),0.14), rgba(0,0,0,0) 62%),
      rgba(2,4,7,0.66);
    pointer-events:none;
    transition:opacity 1.6s ease;
  }
  .startup{
    position:fixed;inset:0;
    z-index:20;
    transition:opacity 1.6s ease;
  }
  .startup-logo{
    position:absolute;
    width:min(28vw,380px);
    transform:translate(-50%,-50%) scale(0.98);
    opacity:0;
    filter:drop-shadow(0 0 14px rgba(255,255,255,0.28)) drop-shadow(0 0 40px rgba(var(--accent-rgb),0.25));
    transition:opacity 0.9s ease, transform 0.9s ease;
  }
  .startup.show .startup-logo{opacity:0.94;transform:translate(-50%,-50%) scale(1);}
  /* Emblème FakeParadise au centre, à la place du logo PS : trois calques
     issus de « startup icon2.png » (monticule + texte, palmier gauche,
     palmier droit) empilés à la même taille ; chaque palmier pivote autour
     de la base de son tronc. */
  .startup-mark{
    position:absolute;
    /* calé sur le logo FS3 comme le symbole PS sur la console : même hauteur
       à 15 % près (le logo mesure 0,411 × sa largeur), juste à sa gauche avec
       un écart de 3,5 % de la largeur d'écran, centres alignés */
    height:calc(min(28vw,380px) * 0.47);
    aspect-ratio:1200/1565;
    left:calc(75% - min(14vw,190px) - 3.5vw - min(28vw,380px) * 0.18);
    transform:translate(-50%,-50%) scale(0.98);
    opacity:0;
    filter:drop-shadow(0 0 14px rgba(255,255,255,0.28)) drop-shadow(0 0 40px rgba(var(--accent-rgb),0.25));
    transition:opacity 0.9s ease, transform 0.9s ease; /* mêmes effets que le logo */
  }
  .startup.show .startup-mark{opacity:0.94;transform:translate(-50%,-50%) scale(1);}
  .startup-mark img{
    position:absolute;inset:0;
    width:100%;height:100%;
  }
  .startup-mark .palm-left{transform-origin:41.4% 53.4%;}
  .startup-mark .palm-right{transform-origin:49.2% 53.4%;}
  /* balancement doux, achevé (retour au repos) juste avant le fondu vers le
     site, qui démarre 4 s après l'apparition du logo (STARTUP.hold) */
  .startup.show .palm-left{animation:palmSwayL 3.5s ease-in-out 0.35s 1 both;}
  .startup.show .palm-right{animation:palmSwayR 3.4s ease-in-out 0.45s 1 both;}
  @keyframes palmSwayL{
    0%{transform:rotate(0deg);} 35%{transform:rotate(-3.2deg);}
    70%{transform:rotate(2.2deg);} 100%{transform:rotate(0deg);}
  }
  @keyframes palmSwayR{
    0%{transform:rotate(0deg);} 30%{transform:rotate(2.6deg);}
    65%{transform:rotate(-2.4deg);} 100%{transform:rotate(0deg);}
  }
  .startup-hint{ /* même halo que les libellés sous les icônes */
    position:absolute;
    left:0;right:0;
    bottom:11vh;
    text-align:center;
    font-size:17px;
    letter-spacing:0.6px;
    color:var(--white);
    text-shadow:0 0 8px rgba(var(--accent-rgb),0.6), 0 0 18px rgba(var(--accent-rgb),0.3);
    opacity:0;
    transition:opacity 0.9s ease 0.3s;
  }
  .startup.show .startup-hint{opacity:1;}
  .startup.fade,.startup-tint.fade{opacity:0;pointer-events:none;}
  body.booting .brand,body.booting .topbar,body.booting .stage,
  body.booting .preview,body.booting .hintbar,body.booting .legalbar{opacity:0;}
  body.boot-fade .brand,body.boot-fade .topbar,body.boot-fade .stage,
  body.boot-fade .preview,body.boot-fade .hintbar,body.boot-fade .legalbar{transition:opacity 1.6s ease;}

  /* outil de développement temporaire : bouton « Mobile » (voir #devView et mobile.html) */
  .dev-view{
    position:fixed;top:6px;left:12px;
    z-index:30;               /* au-dessus de l'écran de démarrage : utilisable à tout moment */
    font-size:11px;padding:3px 10px;
    border-radius:999px;border:1px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.35);color:rgba(255,255,255,0.75);
    cursor:pointer;
  }
  .dev-view:hover{background:rgba(255,255,255,0.14);color:#fff;}

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:flex-end;
    align-items:center;
    gap:28px;
    padding:28px 48px;
    z-index:6;
    font-size:13px;
    font-weight:450;
    letter-spacing:0.5px;
    color:var(--white-60);
  }
  .topbar .cart{
    color:var(--blue);
    text-shadow:0 0 10px rgba(var(--accent-rgb),0.5);
    letter-spacing:0.4px;
  }
  .topbar .clock{
    color:var(--tint-neutral);
    text-shadow:0 0 10px rgba(var(--accent-rgb),0.25);
  }

  /* ---------- main XMB stage ---------- */
  .stage{
    position:fixed;inset:0;
    z-index:4;
    display:flex;
    align-items:center;
  }

  .categories{
    position:relative;
    display:flex;
    align-items:flex-start;
    height:100%;
    width:100%;
    padding-left:8vw;
    padding-bottom:calc(100vh - 2 * var(--xmb-bar)); /* les icônes (marges auto) se centrent dans le haut : centre à --xmb-bar */
    transition:transform 0.4s cubic-bezier(.2,.8,.2,1);
  }

  .category{
    position:relative;
    flex:0 0 auto;
    width:112px;
    margin-top:auto;
    margin-bottom:auto;
    margin-right:72px; /* fixe : la place réclamée par la colonne ouverte se fait par transform (render) */
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    opacity:0.42;   /* non sélectionnée : nettement en retrait (voir aussi le flou sur l'image) */
    transform:scale(0.82);
    transition:opacity 0.35s ease, transform 0.4s cubic-bezier(.2,.8,.2,1);
    will-change:transform;
  }
  .category.active{
    opacity:1;
    transform:scale(1);
    z-index:2;
  }
  .cat-icon{
    position:relative;
    width:104px;height:104px;
    display:flex;align-items:center;justify-content:center;
  }
  /* Lueur de l'icône active, qui épouse sa forme : une copie du glyphe
     (masque tiré du PNG, remplie de la couleur d'accent) légèrement agrandie
     et floutée une seule fois ; seule son opacité s'anime, donc aucun filtre
     n'est recalculé pendant les déplacements (Firefox re-rasterisait les
     drop-shadow empilés à chaque image). Le flou est sur l'élément parent
     et le masque sur l'enfant : dans l'ordre inverse, le masque rognerait
     net le flou. */
  .cat-glow{
    position:absolute;
    left:50%;top:50%;
    width:58px;height:58px;
    transform:translate(-50%,-50%) scale(1.22);
    filter:blur(6px);
    opacity:0;
    transition:opacity 0.35s ease;
    z-index:0;
    pointer-events:none;
  }
  .cat-glow-inner{
    position:absolute;inset:0;
    background:rgba(var(--accent-rgb),0.6); /* intensité de la lueur */
    -webkit-mask:var(--icon) center/contain no-repeat;
    mask:var(--icon) center/contain no-repeat;
  }
  .category.active .cat-glow{opacity:1;}
  /* Icône non sélectionnée : plus effacée, et un voile de flou très léger —
     assez pour que la sélection se détache, pas assez pour brouiller le glyphe.
     Le flou est ajouté DANS le filtre existant de l'image, et non sur un
     parent : deux filtres empilés sur un élément qui se déplace, Firefox les
     re-rasterise à chaque image, et c'est exactement ce qui hachait la barre
     avant. Un seul filtre, une seule passe. */
  .cat-icon img{
    position:relative;
    z-index:1;
    width:58px;height:58px;object-fit:contain;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4)) blur(0.9px);
    transition:filter 0.35s ease;
  }
  .category.active .cat-icon img{filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4));}
  .cat-label{
    margin-top:14px;
    font-size:13px;
    font-weight:450;
    letter-spacing:0.3px;
    color:var(--white-60);
    white-space:nowrap;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .category.active .cat-label{
    color:var(--white);
    opacity:1;
    transform:translateY(0);
    text-shadow:0 0 8px rgba(var(--accent-rgb),0.6), 0 0 18px rgba(var(--accent-rgb),0.3);
  }

  /* Liste verticale façon XMB : les lignes sont positionnées en absolu et
     placées par transform depuis render(), donc chaque changement de
     sélection (taille, luminosité, position) glisse via la transition. */
  .item-column{
    position:absolute;
    left:0;
    top:calc(100% + 16px);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }
  .item-column.open{
    opacity:1;
    pointer-events:auto;
  }
  .xmb-item{
    position:absolute;
    left:0;top:0;
    height:38px;            /* = ROW_H dans le script */
    line-height:22px;
    padding:8px 2px;
    font-size:18px;
    font-weight:450;        /* graisse constante : le poids ne s'anime pas proprement */
    color:var(--white-35);
    cursor:pointer;
    white-space:nowrap;
    letter-spacing:0.2px;
    text-align:left;
    transform-origin:left top;
    transition:transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.45s ease, color 0.35s ease, text-shadow 0.35s ease;
    will-change:transform;
  }
  .item-column.fast .xmb-item{transition-duration:0.18s;} /* défilement rapide (voir noteStep) */
  .xmb-item:hover{color:var(--white-60);}
  .xmb-item.selected{
    color:var(--white);
    text-shadow:0 0 6px rgba(var(--accent-rgb),0.7), 0 0 14px rgba(var(--accent-rgb),0.35);
  }
  .xmb-item .tag{
    font-size:12px;
    color:var(--sale);
    margin-left:6px;
    font-weight:650;
    letter-spacing:0.5px;
    text-shadow:0 0 8px rgba(var(--sale-rgb),0.5);
  }
  /* lignes produit : un petit aperçu 3D rotatif à la place du nom, comme les
     icônes verticales du XMB. La ligne n'est qu'une boîte carrée : le modèle
     est dessiné à sa position (lue à chaque image) dans un canvas WebGL
     transparent posé sur toute la scène (.rows-gl, créé par le script). Un
     canvas par ligne obligeait à recopier le rendu GPU douze fois par image,
     ce que Firefox fait en relisant tout le tampon : rotation saccadée. */
  .xmb-item.has-3d{
    width:88px;height:88px;   /* = ITEM_CSS dans le script ; ROW_H (96) laisse 8 px entre les lignes */
    padding:0;
    font-size:0;line-height:0;
    overflow:visible;
  }
  /* Canvas des aperçus de liste : enfant de .categories, donc le déplacement
     horizontal de la barre (translateX composité) s'applique à lui sans un
     seul calcul en JS. Les positions verticales des lignes, elles, sont
     animées par le module 3D avec la même courbe que les transitions CSS.
     Il couvre la fenêtre : les catégories boutique étant les premières, leurs
     colonnes restent dedans même quand la barre a glissé. */
  .rows-gl{
    position:absolute;inset:0;
    width:100%;height:100%;
    z-index:3;                /* au-dessus des catégories (l'active est à 2), sous les panneaux fixes */
    pointer-events:none;      /* les lignes en dessous gardent survol, clic et info-bulle */
  }
  /* ligne sélectionnée : halo d'accent derrière l'aperçu (dégradé statique, pas de filtre) */
  /* Fond de lecture derrière CHAQUE aperçu de la liste. Mesuré : un sweat noir
     rend une image trois fois plus sombre qu'un tee blanc (luminosité moyenne
     64 contre 185) — sur le ruban sombre il disparaissait, alors qu'il est en
     fait dessiné plus large. Un disque très doux, immobile, suffit à le
     décoller du fond ; c'est un dégradé statique, pas un filtre, donc il ne
     coûte rien pendant les déplacements. */
  .xmb-item.has-3d::after{
    content:'';
    position:absolute;inset:-10px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.11), rgba(255,255,255,0.05) 52%, transparent 70%);
    z-index:-1;
    pointer-events:none;
  }
  .xmb-item.has-3d.selected::before{
    content:'';
    position:absolute;inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(var(--accent-rgb),0.38), rgba(var(--accent-rgb),0.12) 55%, transparent 72%);
  }
  .xmb-item.has-3d .tag{position:absolute;right:-8px;top:-6px;margin:0;font-size:11px;line-height:1;}

  /* ---------- verre (panneaux annexes) ----------
     Verre translucide façon Apple : fond très léger, flou et saturation
     forts pour laisser transparaître le ruban, liseré clair sur le bord
     haut et reflet diagonal discret. Les panneaux gardent leur forme. */
  .glass{
    background:
      linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015) 45%, rgba(255,255,255,0.03)),
      rgba(8,20,30,0.20);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(255,255,255,0.04),
      0 24px 60px rgba(0,0,0,0.35),
      0 0 40px rgba(var(--accent2-rgb),0.10);
    backdrop-filter:blur(28px) saturate(1.7) brightness(1.06);
    -webkit-backdrop-filter:blur(28px) saturate(1.7) brightness(1.06);
  }
  .cart-panel.glass,.legal-panel.glass,.size-panel.glass{ /* texte long : un peu plus couvrant */
    background:
      linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01) 45%, rgba(255,255,255,0.025)),
      rgba(8,20,30,0.36);
  }

  /* ---------- product preview panel ---------- */
  .preview{
    --pad:32px;      /* padding ; repris par la sonde de mesure et la barre du descriptif */
    --reserve:436px; /* hauteur hors visuel : contenu fixe ≈ 240 px + barres haut/bas 160 px + marges 2×18 px */
    position:fixed;
    /* La fiche a grandi d'environ 17 % (demande utilisateur), et elle grandit
       VERS LA DROITE : son bord gauche reste exactement là où il était — 88vw
       moins l'ancienne largeur — pour ne pas mordre davantage sur la barre
       d'icônes, et elle prend sa largeur sur la marge droite, qui ne servait à
       rien. En 16:9, sous ~1530 px de large, l'ancienne largeur valait déjà
       34vw : à ces tailles rien ne bouge, il n'y a pas la place. */
    left:calc(88vw - min(34vw, 520px));
    top:calc(50% - 8px);     /* centré entre l'horloge et la barre d'aide (bas ≈ 16 px plus haut que le haut) */
    transform:translateY(-50%);
    width:min(34vw,610px);   /* 610 = 520 + 17 % ; 34vw ménage la barre d'icônes sous 1530 px */
    z-index:6;
    opacity:0;
    transition:opacity 0.4s ease; /* la taille change pendant la baisse d'opacité, sans animation */
    pointer-events:none;
    padding:var(--pad);
    /* Bordure « floue » (demande utilisateur) : plus de trait net, un voile
       clair très léger qui culmine sur l'arête et s'évanouit vers
       l'extérieur (0 %) et, plus discrètement, vers l'intérieur ; le reflet
       du bord haut garde l'esprit des lueurs de la fin des années 2000. */
    --soft-edge:
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 0 3px rgba(255,255,255,0.10),
      inset 0 0 10px rgba(255,255,255,0.04),
      0 0 3px rgba(255,255,255,0.12),
      0 0 12px 2px rgba(255,255,255,0.045);
    border-radius:16px;
    border-color:transparent;
    box-shadow:
      var(--soft-edge),
      0 24px 60px rgba(0,0,0,0.35),
      0 0 40px rgba(var(--accent2-rgb),0.10);
  }
  /* Lueur de bord : quand une icône de la barre glisse derrière la fiche, elle
     disparaît complètement et on perd le fil du menu. Son éclat traverse donc
     le verre — une lueur s'allume sur l'arête gauche, à la hauteur de l'icône,
     d'autant plus vive qu'elle est enfoncée. Hauteur, position et intensité
     viennent de updateEdgeGlow() ; la transition est calquée sur celle de la
     barre d'icônes pour que les deux bougent d'un seul mouvement. */
  .preview::after{
    content:'';
    position:absolute;
    /* --edge-top est le HAUT de la lueur, déjà calculé dans le repère de la
       fiche : aucune arithmétique ici. Une version précédente centrait la lueur
       avec margin-top:calc(hauteur / -2) ; si ce calc n'est pas compris, la
       déclaration tombe, la marge vaut zéro et la lueur descend d'une
       demi-hauteur — exactement le décalage constaté.
       Réglage du 15 sept. 2026 : plus discrète et plus diffuse. Le trait net
       de 3 px est devenu une nappe de 10 px sans cœur blanc, floutée, et son
       opacité est divisée par deux — on devine l'icône derrière le verre au
       lieu de voir un néon collé sur l'arête. */
    left:-6px;
    top:var(--edge-top,50%);
    height:var(--edge-h,104px);
    width:10px;
    border-radius:6px;
    opacity:calc(var(--edge-a,0) * 0.5);
    background:linear-gradient(to bottom,
      rgba(var(--accent-rgb),0) 0%,
      rgba(var(--accent-rgb),0.55) 34%,
      rgba(var(--accent-rgb),0.75) 50%,
      rgba(var(--accent-rgb),0.55) 66%,
      rgba(var(--accent-rgb),0) 100%);
    filter:blur(5px);
    box-shadow:0 0 22px 8px rgba(var(--accent-rgb),0.12);
    pointer-events:none;
    transition:opacity 0.4s cubic-bezier(.2,.8,.2,1),
               top 0.4s cubic-bezier(.2,.8,.2,1),
               height 0.4s cubic-bezier(.2,.8,.2,1);
  }

  /* Contact, Réglages, Shipping Info : même gabarit pour les trois, un peu
     plus grand, contenu centré (marges égales) pour la lecture et la navigation */
  .preview.info-panel{
    width:min(34vw,586px);
    min-height:400px;
    max-height:min(76vh,660px); /* plafonné : au-delà, le texte défile */
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
  }
  .preview.info-panel .preview-name{white-space:normal;font-size:32px;}
  .preview.info-panel .preview-price{font-size:19px;}
  .preview.info-panel .preview-desc:not(.preview-desc-probe){ /* la sonde garde les métriques produit */
    font-size:16px;
    line-height:1.7;
    margin:20px auto 0;
    padding-right:0;
  }
  .preview.info-panel .preview-actions{justify-content:center;margin-top:28px;}
  .preview.info-panel .preview-cta{font-size:15px;padding:14px 26px;}
  .preview.info-panel .settings-label{font-size:14px;}
  .preview.info-panel .pills{justify-content:center;}
  .preview.info-panel .pill{font-size:15px;padding:11px 20px;}
  .preview.show{opacity:1; pointer-events:auto;}
  /* Tailles ouvertes : la fiche s'allonge vers le BAS. Elle est centrée par
     translateY(-50%) ; ajouter la moitié de la croissance laisse donc le haut
     en place et ne descend que le bas. */
  .preview{transition:opacity 0.4s ease, transform 0.3s cubic-bezier(.2,.8,.2,1);}
  .preview.grown{transform:translateY(calc(-50% + var(--grow,0px) / 2));}
  /* changement de catégorie : le panneau s'assombrit vite, puis le nouveau
     contenu apparaît en regagnant son opacité (transition normale de 0,4 s) */
  .preview.swap{
    opacity:0.12;
    transition:opacity 0.16s ease;
  }
  /* mode panneau (Entrée sur Réglages / Shipping Info) : cadre accentué */
  /* mode panneau : le cadre d'accent est lui aussi fondu (pas de trait net),
     mais assez présent pour signaler le focus clavier */
  .preview.focused{
    box-shadow:
      var(--soft-edge),
      inset 0 0 5px rgba(var(--accent-rgb),0.30),
      0 0 4px rgba(var(--accent-rgb),0.60),
      0 0 14px 2px rgba(var(--accent-rgb),0.30),
      0 0 40px rgba(var(--accent-rgb),0.25),
      0 24px 60px rgba(0,0,0,0.35);
  }
  .pill.focus{outline:2px solid rgba(255,255,255,0.85);outline-offset:3px;color:var(--white);}
  /* fiche produit en mode panneau : partie en surbrillance (visuel ou bouton), même liseré que les pastilles */
  .preview-cta.focus{outline:2px solid rgba(255,255,255,0.85);outline-offset:3px;color:var(--white);}
  .preview-swatch.focus{outline:2px solid rgba(255,255,255,0.85);outline-offset:4px;}
  /* Vol vers le panier : la copie vit le temps du trajet, au-dessus de tout,
     et ne réagit à rien. */
  .fly-to-cart{
    position:fixed;
    z-index:60;
    display:none;
    pointer-events:none;
    opacity:1;
    transform:translate(0,0) scale(1);
    transition:transform 0.78s cubic-bezier(.45,0,.2,1), opacity 0.78s ease-in;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,0.55));
  }
  .fly-to-cart.on{display:block;}
  @media (prefers-reduced-motion:reduce){ .fly-to-cart{display:none;} }
  /* Tailles : dépliées DANS la fiche, sous les boutons, au survol d'« Ajouter
     au panier ». C'était auparavant un panneau flottant posé sous la fiche, qui
     la chevauchait sur les écrans justes. La fiche s'allonge vers le bas d'un
     --grow calculé à l'ouverture : jamais plus que la place libre au-dessus de
     la barre d'aide. Ce qui manque, s'il manque, est repris sur le visuel
     (--squeeze), de sorte que les tailles soient toujours entières. */
  .size-picker{
    max-height:0;
    overflow:hidden;
    opacity:0;
    margin-top:0;
    transition:max-height 0.3s cubic-bezier(.2,.8,.2,1),
               opacity 0.2s ease,
               margin-top 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .size-picker.open{
    max-height:var(--size-h,120px);
    opacity:1;
    margin-top:14px;
  }
  .size-picker .settings-label{margin-bottom:9px;}
  .size-picker .pills{justify-content:center;gap:8px;}
  .size-picker .pill{min-width:54px;padding:10px 12px;font-size:14px;font-weight:550;letter-spacing:0.5px;}
  .preview-swatch{
    /* Carré (photos produit 1:1), SANS cadre : ni fond, ni bord, ni ombre —
       l'image occupe directement la fiche. Sa taille est ce qui reste de la
       hauteur d'écran une fois retirés le descriptif déplié (--desc-h, nul
       quand il est replié), le contenu fixe (--reserve) et, le cas échéant, ce
       que les tailles n'ont pas pu prendre vers le bas (--squeeze). Replié, le
       descriptif ne coûte donc rien et le visuel est au plus grand. */
    width:min(100%, calc(100vh - var(--desc-h,0px) - var(--squeeze,0px) - var(--reserve)));
    aspect-ratio:1/1;
    margin:0 auto;
    display:flex;
    align-items:center;justify-content:center;
    position:relative;
    transition:width 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .preview-swatch span{
    font-size:68px;
    opacity:0.18;
    font-weight:350;
    letter-spacing:2px;
    text-shadow:0 0 26px rgba(var(--accent-rgb),0.6);
  }
  /* ---------- visuel produit : diaporama vue 3D + photos ----------
     Vue 0 : maillage généré depuis la photo de face, rendu WebGL dans le
     canvas (fond = couleur d'accent assombrie du cadre). Vues 1 et 2 : les
     photos de face et de dos, à plat. Points façon Instagram en bas, flèches
     au survol (voir JS « diaporama »). Sans WebGL (classe no-gl), la vue 3D
     est absente. */
  .slide{position:absolute;inset:0;display:none;z-index:1;}
  .slide.active{display:block;}
  .slide.flat{width:100%;height:100%;object-fit:cover;}
  .preview-swatch canvas{position:absolute;inset:0;width:100%;height:100%;}
  /* Pastilles en HAUT du visuel, et non plus en bas : c'est la première chose
     qu'on lit en arrivant sur la fiche. Un reflet les parcourt de gauche à
     droite, en boucle, pour signaler qu'il y a plusieurs vues à voir. */
  .slide-dots{
    position:absolute;left:0;right:0;top:6px;
    display:flex;justify-content:center;gap:7px;
    z-index:3;
    pointer-events:none;
  }
  .preview-swatch:not(.has-slides) .slide-dots,
  .preview-swatch:not(.has-slides) .slide-edge{display:none;}
  .dot{
    position:relative;
    width:6px;height:6px;
    padding:0;border:none;border-radius:50%;
    background:rgba(255,255,255,0.35);
    box-shadow:0 0 4px rgba(0,0,0,0.6);
    cursor:pointer;
    pointer-events:auto;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .dot.active{background:#fff;transform:scale(1.35);}
  /* Le reflet : chaque pastille s'allume à son tour, décalée par --i. Une seule
     animation, retardée — plutôt qu'un dégradé qui balaierait toute la rangée,
     ce qui obligerait à repeindre une surface à chaque image. */
  .dot::after{
    content:'';
    position:absolute;inset:-2px;
    border-radius:50%;
    background:rgba(var(--accent-rgb),0.9);
    opacity:0;
    animation:dotSweep 2.6s ease-in-out infinite;
    animation-delay:calc(var(--i,0) * 0.16s);
    pointer-events:none;
  }
  @keyframes dotSweep{0%,72%,100%{opacity:0;}82%{opacity:0.55;}}
  @media (prefers-reduced-motion:reduce){ .dot::after{animation:none;} }
  /* Zones de navigation : deux bandes sur les bords intérieurs du visuel, à la
     place des anciennes flèches. Invisibles au repos, elles s'allument sous la
     souris pour dire de quel côté on va. */
  .slide-edge{
    position:absolute;top:0;bottom:0;
    width:24%;
    padding:0;border:none;
    background:linear-gradient(to right, rgba(var(--accent-rgb),0.30), rgba(var(--accent-rgb),0));
    opacity:0;
    cursor:pointer;
    transition:opacity 0.22s ease;
    z-index:3;
  }
  .slide-edge.prev{left:0;}
  .slide-edge.next{right:0;transform:scaleX(-1);}
  .slide-edge:hover,.slide-edge:focus-visible{opacity:1;outline:none;}
  /* Fiche au repos : seule la galerie est visible. C'est la sélection de
     l'article — un clic sur la miniature ou Entrée — qui déplie le reste.
     --info-h est mesuré au remplissage : sans lui l'animation partirait d'un
     max-height arbitraire et la vitesse d'ouverture dépendrait de la longueur
     du texte. Le visuel, lui, ne change PAS de taille entre les deux états :
     un vêtement qui grandirait puis rapetisserait à chaque sélection serait
     insupportable. */
  .preview-info{
    max-height:var(--info-h, 340px);
    opacity:1;
    overflow:hidden;
    transition:max-height 0.34s cubic-bezier(.2,.8,.2,1),
               opacity 0.22s ease 0.06s;
  }
  .preview.gallery .preview-info{
    max-height:0;
    opacity:0;
    transition:max-height 0.30s cubic-bezier(.2,.8,.2,1), opacity 0.14s ease;
  }
  .preview.gallery .size-picker{max-height:0;opacity:0;margin-top:0;}
  /* En-tête compact : le nom et le prix sur UNE ligne, au même corps, et le
     bouton de dépliage du descriptif au bout. Deux lignes gagnées, rendues au
     visuel. */
  .preview-head{
    display:flex;align-items:baseline;gap:10px;
    margin-top:18px;
  }
  .preview-name{
    flex:0 1 auto;min-width:0;
    font-size:24px;
    font-weight:450;
    letter-spacing:0.3px;
    text-shadow:0 0 14px rgba(var(--accent-rgb),0.2);
    white-space:nowrap;      /* toujours une ligne : la fiche ne change pas de hauteur */
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.3;         /* hauteur fixe : un emoji (HELLO❤️) ne l'agrandit plus */
    height:1.3em;
  }
  .preview-price{
    flex:0 0 auto;
    margin-left:auto;        /* le prix est poussé au bord droit, le + reste collé au nom */
    font-size:24px;          /* exactement le corps du nom, comme demandé */
    color:var(--blue);
    font-weight:550;
    text-shadow:0 0 10px rgba(var(--accent-rgb),0.45);
  }
  .preview-price .was{
    color:var(--white-35);
    text-decoration:line-through;
    font-weight:450;
    margin-right:10px;
    font-size:18px;
    text-shadow:none;
  }
  /* Bouton de dépliage : un + minimal dans un cercle. Ouvert, il pivote d'un
     quart de tour et devient une croix — un seul dessin, deux états. */
  .desc-toggle{
    flex:0 0 auto;align-self:center;
    position:relative;
    width:22px;height:22px;
    padding:0;
    border:1px solid rgba(255,255,255,0.28);
    border-radius:50%;
    background:transparent;
    cursor:pointer;
    transition:border-color 0.2s ease, background 0.2s ease, transform 0.28s cubic-bezier(.2,.8,.2,1);
  }
  .desc-toggle::before,.desc-toggle::after{
    content:'';
    position:absolute;left:50%;top:50%;
    background:var(--white-60);
    transition:background 0.2s ease;
  }
  .desc-toggle::before{width:9px;height:1px;transform:translate(-50%,-50%);}
  .desc-toggle::after{width:1px;height:9px;transform:translate(-50%,-50%);}
  .desc-toggle:hover{border-color:rgba(var(--accent-rgb),0.85);background:rgba(var(--accent-rgb),0.10);}
  .desc-toggle:hover::before,.desc-toggle:hover::after{background:var(--white);}
  .preview.desc-open .desc-toggle{transform:rotate(45deg);border-color:rgba(var(--accent-rgb),0.85);}
  .preview-desc{
    margin-top:0;
    font-size:15px;
    line-height:1.6;
    color:var(--white-60);
    white-space:pre-line; /* les retours à la ligne du texte sont respectés */
    /* Accordéon : replié, sa hauteur est nulle et le visuel récupère la place
       (voir .preview-swatch). Dépliée, elle vaut le texte mesuré, plafonné à
       DESC_MAX_LINES — la fiche garde alors la même hauteur totale. */
    height:var(--desc-h, 0px);
    overflow-y:auto;
    margin-right:calc(8px - var(--pad)); /* barre de défilement à 8 px du bord du panneau */
    padding-right:calc(var(--pad) - 8px);
    scrollbar-width:thin;
    scrollbar-color:rgba(var(--accent-rgb),0.45) transparent;
    transition:height 0.3s cubic-bezier(.2,.8,.2,1), margin-top 0.3s cubic-bezier(.2,.8,.2,1);
  }
  .preview.desc-open .preview-desc{margin-top:14px;}
  .preview-desc::-webkit-scrollbar{width:6px;}
  .preview-desc::-webkit-scrollbar-track{background:transparent;}
  .preview-desc::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),0.45);border-radius:3px;}
  .preview-desc::-webkit-scrollbar-button{display:none;height:0;}
  .preview.info .preview-desc:not(.preview-desc-probe){height:auto;max-height:min(44vh,380px);} /* Contact, Shipping Info : texte entier, défile s'il est long */
  .preview-desc-probe{ /* clone invisible qui sert à la mesure */
    position:absolute;
    left:var(--pad);right:var(--pad); /* = padding de .preview : mesure à la vraie largeur */
    height:auto!important;
    margin:0;
    visibility:hidden;
    pointer-events:none;
  }
  .preview-cta{
    margin-top:26px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:13px 24px;
    background:rgba(var(--accent-rgb),0.05);
    border:1px solid var(--blue);
    color:var(--white);
    font-size:14px;
    letter-spacing:0.4px;
    cursor:pointer;
    border-radius:3px;
    transition:background 0.25s ease, box-shadow 0.25s ease;
    box-shadow:0 0 12px rgba(var(--accent-rgb),0.2);
  }
  .preview-cta:hover{
    background:rgba(var(--accent-rgb),0.15);
    box-shadow:0 0 10px rgba(var(--accent-rgb),0.5), 0 0 28px rgba(var(--accent-rgb),0.28);
  }
  /* rangée de boutons : « + Add to bag » et « More info » côte à côte */
  .preview-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .preview-actions .preview-cta{margin-top:0;}
  .preview-cta--secondary{
    background:transparent;
    border-color:rgba(255,255,255,0.25);
    color:var(--white-60);
    box-shadow:none;
  }
  .preview-cta--secondary:hover{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.5);
    color:var(--white);
    box-shadow:none;
  }

  /* ---------- fiche « More info » : guide des tailles ---------- */
  .info-overlay{
    position:fixed;inset:0;
    z-index:9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,2,4,0);
    visibility:hidden;
    pointer-events:none;
    transition:background-color 0.2s ease, visibility 0s linear 0.2s; /* même principe que .legal-overlay */
  }
  .info-overlay.open{
    background:rgba(0,2,4,0.55);
    visibility:visible;
    pointer-events:auto;
    transition:background-color 0.3s ease, visibility 0s;
  }
  /* Nommé .size-panel et non .info-panel : ce dernier désigne déjà le gabarit
     Contact / Réglages / Livraison du panneau d'aperçu (.preview.info-panel),
     que ces règles (enfants masqués hors ouverture) avaient fait disparaître. */
  .size-panel{
    width:min(92vw,560px);
    max-height:82vh;
    display:flex;
    flex-direction:column;
    border-radius:6px;
    overflow:hidden;
    transform:translateY(12px) scale(0.975);
    transition:transform 0.2s ease;
    user-select:text;
  }
  .info-overlay.open .size-panel{transform:none;transition:transform 0.35s cubic-bezier(.2,.8,.2,1);}
  .size-panel > *{opacity:0;transition:opacity 0s linear 0.2s;}
  .info-overlay.open .size-panel > *{opacity:1;transition:opacity 0.3s ease 0.05s;}
  .info-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    padding:26px 28px 14px;
  }
  .info-header h2{font-size:22px;font-weight:450;letter-spacing:0.3px;text-shadow:0 0 14px rgba(var(--accent-rgb),0.2);}
  .info-sub{margin-top:4px;font-size:12px;letter-spacing:0.5px;text-transform:uppercase;color:var(--white-35);}
  .info-body{
    padding:0 28px 24px;
    overflow-y:auto;
    font-size:13px;
    line-height:1.6;
    color:var(--white-60);
    scrollbar-width:thin;
    scrollbar-color:rgba(var(--accent-rgb),0.45) transparent;
  }
  .size-table{width:100%;border-collapse:collapse;text-align:center;}
  .size-table th,.size-table td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,0.07);vertical-align:top;}
  .size-table th{color:var(--white);font-weight:550;letter-spacing:0.4px;}
  .size-table th:first-child,.size-table td:first-child{text-align:left;color:var(--white-60);font-weight:450;white-space:nowrap;}
  .size-table td{color:var(--white);}
  .size-table .alt{display:block;font-size:11px;color:var(--white-35);}
  .info-note{margin-top:14px;font-size:12px;color:var(--white-35);}

  /* ---------- settings panel ---------- */
  .settings-panel{ display:none; }
  .settings-panel.active{ display:block; }
  .settings-group{ margin-bottom:26px; }
  .settings-group:last-child{ margin-bottom:0; }
  .settings-label{
    font-size:12px;
    letter-spacing:0.4px;
    color:var(--white-60);
    margin-bottom:12px;
  }
  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .pill{
    padding:9px 16px;
    font-size:13px;
    letter-spacing:0.3px;
    color:var(--white-60);
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;
    cursor:pointer;
    transition:all 0.25s ease;
  }
  .pill:hover{ color:var(--white); border-color:rgba(255,255,255,0.3); }
  .pill.active{
    color:var(--white);
    background:rgba(var(--accent-rgb),0.15);
    border-color:var(--blue);
    box-shadow:0 0 14px rgba(var(--accent-rgb),0.35);
  }

  /* ---------- bottom hint bar ---------- */
  .hintbar{
    position:fixed;
    bottom:var(--footer-h);left:0;right:0;
    display:flex;
    justify-content:center;
    gap:36px;
    padding:20px;
    font-size:12px;
    color:var(--white-35);
    z-index:5;
    letter-spacing:0.3px;
  }
  .hintbar span{display:flex;align-items:center;gap:7px;}
  .key{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;
    border:1px solid var(--white-35);
    border-radius:50%;
    font-size:10px;
    box-shadow:0 0 6px rgba(var(--accent-rgb),0.12);
  }

  /* ---------- brand mark ---------- */
  .brand{
    position:fixed;
    top:28px;left:48px;
    z-index:6;
    font-size:14px;
    font-weight:450;
    letter-spacing:2.5px;
    color:var(--tint-neutral);
  }
  .brand b{color:var(--tint-neutral);font-weight:650;text-shadow:0 0 12px rgba(var(--accent-rgb),0.5);}

  .topbar .cart{
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    padding:0;
  }
  .topbar .cart:hover{color:var(--white);}

  /* ---------- cart panel ---------- */
  /* Le voile s'anime par sa couleur de fond et non par opacity : un ancêtre
     à opacité < 1 devient une « backdrop root » et le flou du panneau (verre)
     n'apparaîtrait qu'à la fin de l'animation. visibility masque l'ensemble
     une fois fermé, après le temps de la sortie. */
  .cart-overlay{
    position:fixed;inset:0;
    right:min(90vw,380px); /* le voile s'arrête au panneau : le verre voit la page, pas un fond assombri */
    z-index:9;
    background:rgba(0,2,4,0);
    visibility:hidden;
    pointer-events:none;
    transition:background-color 0.3s ease, visibility 0s linear 0.35s;
  }
  .cart-overlay.open{
    background:rgba(0,2,4,0.55);
    visibility:visible;
    pointer-events:auto;
    transition:background-color 0.3s ease, visibility 0s;
  }

  /* Le panneau est un frère du voile, pas son enfant : aucun ancêtre animé
     (opacité, couleur, visibilité) ne s'interpose entre le verre et la page,
     ce qui garantit le flou d'arrière-plan dans tous les navigateurs. Il est
     piloté par la classe .open du voile via le sélecteur frère « + ». */
  .cart-panel{
    position:fixed;
    top:0;right:0;bottom:0;
    z-index:10;
    width:min(90vw,380px);
    padding:32px 28px;
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    visibility:hidden;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), visibility 0s linear 0.35s;
  }
  .cart-overlay.open + .cart-panel{
    transform:translateX(0);
    visibility:visible;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), visibility 0s;
  }
  /* ouverture : verre dès le clic, contenu en fondu ; fermeture : le contenu
     reste pendant le glissement de sortie et disparaît avec le panneau */
  .cart-panel > *{opacity:0;transition:opacity 0s linear 0.35s;}
  .cart-overlay.open + .cart-panel > *{opacity:1;transition:opacity 0.3s ease 0.1s;}

  .cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
  }
  .cart-header h2{
    font-size:18px;
    font-weight:450;
    letter-spacing:0.3px;
  }
  .cart-close{
    background:none;border:none;color:var(--white-60);
    font-size:20px;cursor:pointer;line-height:1;
    padding:4px;
  }
  .cart-close:hover{color:var(--white);}

  .cart-items{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .cart-empty{
    color:var(--white-35);
    font-size:13px;
    line-height:1.6;
    margin-top:12px;
  }
  .cart-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding-bottom:14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .cart-row-name{
    font-size:14px;
    font-weight:450;
  }
  .cart-row-price{
    font-size:13px;
    color:var(--blue);
    margin-top:4px;
  }
  .cart-row-size{ /* taille choisie, en pastille à côté du nom */
    display:inline-block;
    margin-left:8px;
    padding:1px 8px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:10px;
    font-size:11px;
    letter-spacing:0.4px;
    color:var(--white-60);
    vertical-align:middle;
  }
  .cart-remove{
    background:none;border:none;
    color:var(--white-35);
    font-size:13px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .cart-remove:hover{color:var(--sale);}
  /* quantité par ligne : groupe − n + à gauche de « Remove » */
  .cart-row-actions{display:flex;align-items:center;gap:12px;flex:0 0 auto;}
  .cart-qty{
    display:inline-flex;
    align-items:center;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    overflow:hidden;
  }
  .cart-qty-btn{
    background:none;border:none;
    width:26px;height:26px;
    color:var(--white-60);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .cart-qty-btn:hover{background:rgba(255,255,255,0.08);color:var(--white);}
  .cart-qty-n{min-width:22px;text-align:center;font-size:13px;color:var(--white);}
  .cart-row-unit{margin-left:8px;font-size:11px;color:var(--white-35);} /* « 2 × €25 » sous le prix de la ligne */

  .cart-footer{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .cart-total{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    margin-bottom:18px;
  }
  .cart-total .amount{color:var(--blue);text-shadow:0 0 10px rgba(var(--accent-rgb),0.4);}
  .cart-checkout{
    width:100%;
    padding:13px;
    background:rgba(var(--accent-rgb),0.08);
    border:1px solid var(--blue);
    color:var(--white);
    font-size:13px;
    letter-spacing:0.4px;
    cursor:pointer;
    border-radius:3px;
    transition:background 0.25s ease, box-shadow 0.25s ease;
  }
  .cart-checkout:hover{
    background:rgba(var(--accent-rgb),0.18);
    box-shadow:0 0 24px rgba(var(--accent-rgb),0.3);
  }

  /* ---------- banderole légale (footer) ---------- */
  .legalbar{
    position:fixed;
    bottom:0;left:0;right:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:26px;
    min-height:var(--footer-h);
    padding:0 48px;
    font-size:10.5px;
    font-weight:450;
    letter-spacing:0.6px;
    color:var(--white-35);
    background:linear-gradient(to top, rgba(0,2,4,0.6), rgba(0,2,4,0.25));
    border-top:1px solid rgba(var(--accent-rgb),0.14);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .legalbar-copy{ white-space:nowrap; }
  .legalbar-links{
    display:flex;
    align-items:center;
  }
  .legalbar-links button{
    background:none;border:none;
    font:inherit;
    letter-spacing:inherit;
    color:inherit;
    padding:6px 11px;
    cursor:pointer;
    white-space:nowrap;
    transition:color 0.2s ease, text-shadow 0.2s ease;
  }
  .legalbar-links button + button{ border-left:1px solid rgba(255,255,255,0.1); }
  .legalbar-links button:hover,
  .legalbar-links button:focus-visible{
    color:var(--white);
    text-shadow:0 0 8px rgba(var(--accent-rgb),0.6);
    outline:none;
  }

  /* ---------- fenêtre légale (même verre dépoli que le panier) ---------- */
  .legal-overlay{
    position:fixed;inset:0;
    z-index:9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,2,4,0);
    visibility:hidden;
    pointer-events:none;
    transition:background-color 0.2s ease, visibility 0s linear 0.2s; /* même principe que .cart-overlay ; sortie rapide */
  }
  .legal-overlay.open{
    background:rgba(0,2,4,0.6);
    visibility:visible;
    pointer-events:auto;
    transition:background-color 0.3s ease, visibility 0s;
  }
  .legal-panel{
    width:min(100%,980px);
    height:min(100%,720px);
    display:flex;
    border-radius:6px;
    overflow:hidden;
    transform:translateY(12px) scale(0.975);
    transition:transform 0.2s ease; /* fermeture : rapide, contenu conservé jusqu'au bout */
    user-select:text; /* le body est en user-select:none ; ici on doit pouvoir copier une adresse */
  }
  .legal-overlay.open .legal-panel{transform:none;transition:transform 0.35s cubic-bezier(.2,.8,.2,1);}
  /* Ouverture : le verre est là dès le clic, seul le contenu apparaît en fondu.
     Fermeture : le contenu reste affiché pendant la sortie et disparaît avec
     le panneau, sans laisser une boîte vide. */
  .legal-panel > *{opacity:0;transition:opacity 0s linear 0.2s;}
  .legal-overlay.open .legal-panel > *{opacity:1;transition:opacity 0.3s ease 0.05s;}

  /* colonne de rubriques, même langage que la liste verticale du XMB */
  .legal-nav{
    flex:0 0 220px;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:34px 18px 34px 28px;
    border-right:1px solid rgba(255,255,255,0.06);
  }
  .legal-nav-item{
    background:none;border:none;
    font:inherit;
    text-align:left;
    padding:9px 4px;
    font-size:14px;
    font-weight:450;
    letter-spacing:0.2px;
    color:var(--white-35);
    cursor:pointer;
    transform-origin:left center;
    transition:color 0.2s ease, transform 0.25s cubic-bezier(.2,.8,.2,1), text-shadow 0.2s ease;
  }
  .legal-nav-item:hover{color:var(--white-60);}
  .legal-nav-item:focus-visible{outline:none;color:var(--white-60);}
  .legal-nav-item.selected{
    color:var(--white);
    font-weight:550;
    transform:translateX(4px) scale(1.06);
    text-shadow:0 0 6px rgba(var(--accent-rgb),0.7), 0 0 14px rgba(var(--accent-rgb),0.35);
  }

  .legal-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .legal-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    padding:30px 32px 18px;
  }
  .legal-header h2{
    font-size:22px;
    font-weight:450;
    letter-spacing:0.3px;
    text-shadow:0 0 14px rgba(var(--accent-rgb),0.2);
  }
  .legal-close{
    background:none;border:none;
    color:var(--white-60);
    font-size:20px;cursor:pointer;line-height:1;
    padding:4px;
  }
  .legal-close:hover,.legal-close:focus-visible{color:var(--white);outline:none;}

  /* avertissement visible tant qu'il reste des champs [à compléter] */
  .legal-todo{
    margin:0 32px 12px;
    padding:8px 12px;
    font-size:11px;
    letter-spacing:0.3px;
    color:var(--sale);
    border:1px dashed rgba(var(--sale-rgb),0.45);
    border-radius:3px;
  }

  .legal-note{ /* en anglais : rappel que la version française fait foi */
    color:var(--white-35);
    border-color:rgba(255,255,255,0.15);
  }

  .legal-body{
    flex:1;
    overflow-y:auto;
    padding:0 32px 32px;
    font-size:13px;
    line-height:1.7;
    font-weight:450;
    color:var(--white-60);
    scrollbar-width:thin;
    scrollbar-color:rgba(var(--accent-rgb),0.35) transparent;
  }
  .legal-body:focus{outline:none;}
  .legal-body:focus-visible{outline:1px solid rgba(var(--accent-rgb),0.4);outline-offset:-1px;}
  .legal-body h3{
    margin:26px 0 8px;
    font-size:12px;
    font-weight:550;
    letter-spacing:0.8px;
    text-transform:uppercase;
    color:var(--white);
  }
  .legal-body h3:first-child{margin-top:0;}
  .legal-body p{margin:0 0 12px;}
  .legal-body ul,.legal-body ol{margin:0 0 12px 20px;}
  .legal-body li{margin-bottom:6px;}
  .legal-body a{
    color:var(--blue);
    text-decoration:none;
    border-bottom:1px solid rgba(var(--accent-rgb),0.35);
    cursor:pointer;
  }
  .legal-body a:hover{color:var(--white);}
  .legal-body strong{color:var(--white);font-weight:550;}
  .legal-body em{color:var(--white-35);font-style:normal;}
  .legal-body dl{
    display:grid;
    grid-template-columns:max-content 1fr;
    gap:6px 18px;
    margin:0 0 12px;
  }
  .legal-body dt{color:var(--white-35);white-space:nowrap;}
  .legal-body dd{margin:0;}
  .legal-body table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 14px;
    font-size:12px;
    line-height:1.55;
  }
  .legal-body th,.legal-body td{
    text-align:left;
    vertical-align:top;
    padding:8px 12px 8px 0;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .legal-body th{color:var(--white);font-weight:550;letter-spacing:0.3px;}
  .legal-box{ /* encadré obligatoire sur les garanties légales */
    margin:14px 0;
    padding:14px 18px;
    border:1px solid rgba(var(--accent-rgb),0.3);
    border-radius:3px;
    background:rgba(var(--accent-rgb),0.04);
  }
  .legal-box p:last-child{margin-bottom:0;}
  .legal-form{ /* formulaire type de rétractation */
    margin:14px 0;
    padding:14px 18px;
    border:1px dashed rgba(255,255,255,0.18);
    border-radius:3px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;
  }
  .legal-form p:last-child{margin-bottom:0;}
  mark.todo{
    background:rgba(var(--sale-rgb),0.14);
    color:var(--sale);
    padding:0 3px;
    border-radius:2px;
    border-bottom:1px dotted rgba(var(--sale-rgb),0.7);
  }
  .legal-hint{
    display:flex;
    gap:24px;
    padding:12px 32px;
    border-top:1px solid rgba(255,255,255,0.06);
    font-size:11px;
    color:var(--white-35);
    letter-spacing:0.3px;
  }
  .legal-hint span{display:flex;align-items:center;gap:6px;}
  .key.wide{width:auto;padding:0 7px;border-radius:9px;}

  /* Fenêtres hautes (en 16:9, à partir de ~2100 px de large) : là seulement, la
     fiche a de quoi grandir en hauteur, donc les textes suivent la largeur
     (+10 %). En dessous, la fiche est limitée par la hauteur — elle doit tenir
     entre l'horloge et la barre d'aide — et grossir les textes volerait la
     place du visuel : ils gardent leur taille et seule la largeur augmente.
     Le seuil est à 1180 px et pas plus bas pour que le passage ne se voie pas :
     au-dessus, le visuel est borné par la largeur (536 px) des deux côtés de la
     bascule, seuls les textes changent. --reserve monte d'autant que le bloc de
     texte, puisque c'est lui qui borne le visuel (voir .preview-swatch). */
  @media (min-height:1180px){
    .preview{--pad:36px;--reserve:462px;} /* contenu fixe ≈ 267 px + 160 px + 2×18 px */
    .preview-head{margin-top:22px;}
    .preview-name,.preview-price{font-size:27px;}   /* le nom et le prix gardent le MÊME corps */
    .preview-price .was{font-size:17px;}
    .preview.desc-open .preview-desc{margin-top:18px;}
    .preview-desc{font-size:16.5px;}
    .preview-cta{margin-top:29px;gap:11px;padding:14px 26px;font-size:15.5px;}
    .preview-actions{gap:11px;margin-top:29px;}
    .preview.info-panel{min-height:440px;max-height:min(76vh,720px);}
    .preview.info-panel .preview-name{font-size:35px;}
    .preview.info-panel .preview-price{font-size:21px;}
    .preview.info-panel .preview-desc:not(.preview-desc-probe){font-size:17.5px;margin-top:22px;}
    .preview.info-panel .preview-actions{margin-top:31px;}
    .preview.info-panel .preview-cta{font-size:16.5px;padding:15px 29px;}
    .preview.info-panel .settings-label{font-size:15.5px;}
    .preview.info-panel .pill{font-size:16.5px;padding:12px 22px;}
  }

  @media (max-height:820px){
    /* fenêtres basses (portable 1080p à 125 %, 1440×900…) : tailles d'origine
       pour que la fiche tienne entre l'horloge et la barre d'aide ; la largeur
       et la position gardent les valeurs des grands écrans */
    .preview{--pad:26px;--reserve:400px;} /* contenu fixe ≈ 205 px + 160 px + 2×17 px */
    .preview-head{margin-top:15px;}
    .preview-name,.preview-price{font-size:20px;}
    .preview.desc-open .preview-desc{margin-top:12px;}
    .preview-desc{font-size:13.5px;}
    .preview-cta{padding:11px 20px;font-size:13px;}
    .preview-actions{margin-top:22px;}
    .preview.info-panel{min-height:360px;}
    .preview.info-panel .preview-name{font-size:28px;}
    .preview.info-panel .preview-price{font-size:17px;}
    .preview.info-panel .preview-desc:not(.preview-desc-probe){font-size:15px;}
    .preview.info-panel .pill{font-size:14px;padding:10px 18px;}
  }

  @media (max-width:1280px){
    /* écrans moyens : panneau plus près du bord pour laisser de la place à la barre.
       left:auto rend la main à right — sans quoi le left des grands écrans
       l'emporterait et cette règle ne ferait plus rien. */
    .preview{left:auto;right:7vw;width:min(36vw,480px);}
    .preview.info-panel{width:min(36vw,460px);}
  }

  /* Aperçu fixe du mini-jeu, dans le panneau « Versus ». Trois calques comme
     dans l'arène : décor, vêtements, attaque. Peint une seule fois. */
  .arena-teaser{
    position:relative;
    width:100%;
    aspect-ratio:16/7;
    border-radius:4px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.10);
    box-shadow:inset 0 0 30px rgba(0,0,0,0.45);
  }
  .arena-teaser[hidden]{display:none;}
  .arena-teaser canvas{position:absolute;inset:0;width:100%;height:100%;}
  #teaserGL{z-index:1;}
  #teaserFx{z-index:2;}
  /* ---------- mini-jeu « Versus » (provisoire) ----------
     Même grammaire que les autres fenêtres du site : voile sombre, panneau de
     verre, fondu par visibility pour ne rien peindre quand c'est fermé. */
  .arena-overlay{
    position:fixed;inset:0;z-index:40;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,2,4,0);
    visibility:hidden;
    pointer-events:none;
    transition:background-color 0.2s ease, visibility 0s linear 0.2s;
  }
  .arena-overlay.open{
    /* Noir PLEIN, pas un voile : à l'entrée dans le jeu le site s'éteint
       complètement et il ne reste que l'arène. Le fondu du noir (0,4 s) part
       avant celui du panneau, qui attend 0,18 s : on voit donc la page
       s'éteindre, puis le jeu s'allumer — deux temps, pas un seul. */
    background:#000;
    visibility:visible;
    pointer-events:auto;
    transition:background-color 0.4s ease, visibility 0s;
  }
  .arena-panel{
    width:min(94vw,1180px);
    height:min(88vh,780px);
    display:flex;
    flex-direction:column;
    border-radius:8px;
    overflow:hidden;
    transform:translateY(14px) scale(0.975);
    transition:transform 0.2s ease;
  }
  .arena-overlay.open .arena-panel{transform:none;transition:transform 0.35s cubic-bezier(.2,.8,.2,1) 0.18s;}
  .arena-panel > *{opacity:0;transition:opacity 0s linear 0.2s;}
  .arena-overlay.open .arena-panel > *{opacity:1;transition:opacity 0.3s ease 0.22s;}
  .arena-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px 12px;
    flex:0 0 auto;
  }
  .arena-head h2{
    font-size:15px;font-weight:600;letter-spacing:5px;
    text-transform:uppercase;
    color:var(--blue);
    /* ombre portée FRANCHE, décalée d'un pixel : c'est le relief des titres
       d'arcade. Le halo flou d'avant appartenait à l'habillage du site. */
    text-shadow:2px 2px 0 rgba(0,0,0,0.9);
  }

  /* --- écran de choix, au goût 16 bits ---
     Pas de fonte à installer : le cachet vient d'ailleurs — angles vifs
     partout, biseaux faits de deux ombres internes (clair en haut à gauche,
     sombre en bas à droite, comme une plaque emboutie), capitales espacées,
     et surtout des vignettes VRAIMENT pixellisées, redessinées en 36 px de
     côté par le script. Une photo simplement réduite en CSS reste lisse. */
  .arena-pick{
    position:relative;
    flex:1 1 auto;
    display:flex;flex-direction:column;
    min-height:0;                 /* sans quoi la grille pousse le panneau au lieu de défiler */
    padding:0 22px;
  }
  .arena-pick[hidden]{display:none;}
  /* balayage de trame, très léger, sur tout l'écran de choix */
  .arena-pick::after{
    content:'';
    position:absolute;inset:0;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
    pointer-events:none;
    z-index:3;
  }
  .arena-pick-head{text-align:center;}
  .arena-pick-title{
    font-size:14px;font-weight:550;
    text-transform:uppercase;letter-spacing:3px;
    color:var(--white);
    text-shadow:2px 2px 0 rgba(0,0,0,0.8);
  }
  .arena-pick-sub{
    margin-top:6px;font-size:10.5px;
    text-transform:uppercase;letter-spacing:1.6px;
    color:var(--white-35);
  }
  .arena-slots{
    display:flex;align-items:stretch;justify-content:center;gap:14px;
    margin:14px 0 12px;
  }
  .arena-slot{
    position:relative;
    width:min(30vw,250px);height:64px;
    display:flex;align-items:center;gap:11px;
    padding:0 12px 0 34px;
    background:#10131b;
    border:2px solid #05070c;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.09), inset -2px -2px 0 rgba(0,0,0,0.55);
    border-radius:0;
    font-size:11px;
    text-transform:uppercase;letter-spacing:1.4px;
    color:var(--white-35);
    overflow:hidden;
  }
  /* étiquette du joueur, dans la tranche gauche du cartouche */
  .arena-slot::before{
    content:attr(data-p);
    position:absolute;left:0;top:0;bottom:0;width:24px;
    display:flex;align-items:center;justify-content:center;
    background:#05070c;
    font-size:10px;font-weight:600;letter-spacing:0.5px;
    color:var(--white-35);
  }
  .arena-slot.filled{
    background:rgba(var(--accent-rgb),0.13);
    border-color:rgba(var(--accent-rgb),0.9);
    color:var(--white);
  }
  .arena-slot.filled::before{background:rgba(var(--accent-rgb),0.9);color:#05070c;}
  .arena-slot canvas{
    width:46px;height:46px;flex:0 0 auto;
    image-rendering:pixelated;
    background:#05070c;
    box-shadow:inset 0 0 0 2px #05070c;
  }
  .arena-slot b{font-weight:550;font-size:10.5px;line-height:1.35;overflow:hidden;letter-spacing:1px;}
  .arena-vs{
    align-self:center;
    font-size:15px;font-weight:600;letter-spacing:3px;
    color:var(--blue);
    text-shadow:2px 2px 0 rgba(0,0,0,0.8);
  }
  .arena-grid{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(106px,1fr));
    gap:8px;
    padding:4px 2px 10px;
    scrollbar-width:thin;
    scrollbar-color:rgba(var(--accent-rgb),0.45) transparent;
  }
  .arena-card{
    position:relative;
    background:#10131b;
    border:2px solid #05070c;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.07), inset -2px -2px 0 rgba(0,0,0,0.55);
    border-radius:0;
    padding:7px 7px 8px;
    cursor:pointer;
    text-align:left;
    color:inherit;
    font:inherit;
    transition:background 0.12s linear;
  }
  .arena-card canvas{
    width:100%;aspect-ratio:1/1;display:block;
    image-rendering:pixelated;          /* la vignette est déjà en 36 px : on montre ses pixels */
    background:#05070c;
  }
  .arena-card span{
    display:block;margin-top:6px;
    font-size:9px;line-height:1.35;
    text-transform:uppercase;letter-spacing:0.8px;
    color:var(--white-60);
  }
  .arena-card:hover{background:#1a2030;}
  /* curseur : un cadre blanc qui bat, comme une sélection d'arcade */
  .arena-card.focus{
    border-color:#ffffff;
    animation:arenaCurseur 0.7s steps(1,end) infinite;
  }
  @keyframes arenaCurseur{0%,50%{border-color:#ffffff;}50.01%,100%{border-color:rgba(255,255,255,0.25);}}
  .arena-card.picked{
    border-color:rgba(var(--accent-rgb),0.95);
    background:rgba(var(--accent-rgb),0.16);
    animation:none;
  }
  .arena-card.picked span{color:var(--white);}
  /* pastille P1 / P2 sur la vignette choisie */
  .arena-card.picked::after{
    content:attr(data-p);
    position:absolute;top:5px;right:5px;
    padding:2px 4px;
    background:rgba(var(--accent-rgb),0.95);
    color:#05070c;
    font-size:9px;font-weight:600;letter-spacing:0.5px;
  }
  .arena-pick-actions{display:flex;gap:10px;justify-content:center;padding:4px 0 16px;flex:0 0 auto;}
  .arena-pick-actions .preview-cta{
    margin-top:0;
    border-radius:0;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:12px;
    padding:12px 26px;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.14), inset -2px -2px 0 rgba(0,0,0,0.5);
  }
  .arena-pick-actions .preview-cta:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  .preview-cta[disabled]{opacity:0.35;cursor:default;pointer-events:none;}

  /* --- le duel, au même goût 16 bits que l'écran de choix --- */
  .arena-stage{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    display:flex;flex-direction:column;
  }
  .arena-stage[hidden]{display:none;}
  .arena-hud{
    display:flex;align-items:flex-start;gap:16px;
    padding:2px 22px 12px;
    flex:0 0 auto;
  }
  .arena-side{flex:1 1 0;min-width:0;}
  .arena-side.right{text-align:right;}
  .arena-name{
    font-size:10.5px;font-weight:550;
    text-transform:uppercase;letter-spacing:1.6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:6px;
    text-shadow:2px 2px 0 rgba(0,0,0,0.85);
  }
  /* Jauge de vie : cartouche emboutie, angles vifs, et des crans qui la
     découpent en segments — c'est le cran, plus que la couleur, qui donne
     l'air 16 bits. Seule la couleur d'accent du site y reste, comme demandé. */
  .arena-bar{
    position:relative;height:12px;
    background:#10131b;
    border:2px solid #05070c;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,0.08), inset -2px -2px 0 rgba(0,0,0,0.55);
    border-radius:0;
    overflow:hidden;
  }
  .arena-bar i{position:absolute;inset:0;transform-origin:left center;display:block;}
  .arena-side.right .arena-bar i{transform-origin:right center;}
  /* la barre fantôme retarde sur la vraie : le coup encaissé se lit d'un coup d'œil */
  .arena-bar .ghost{background:#ff3838;transition:transform 0.55s steps(12,end) 0.12s;}
  .arena-bar .fill{
    background:rgb(var(--accent-rgb));
    transition:transform 0.28s steps(8,end);   /* par crans, pas en glissant */
  }
  /* crans par-dessus les deux barres */
  .arena-bar::after{
    content:'';
    position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, transparent 0 7px, rgba(0,0,0,0.55) 7px 9px);
    pointer-events:none;
  }

  #arenaGL{z-index:1;}

  /* --- carte de fin : le même cartouche embouti que l'écran de choix --- */
  .arena-end{

  @keyframes arenaPop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .arena-end-title{

  }
  .arena-end-ask{

  }
  .arena-end-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
  .arena-end-actions .preview-cta{

  @media (max-width:820px){

</style>

<script>
/* ---------------- data ---------------- */
const INSTAGRAM_URL = "https://www.instagram.com/fakeparadisetm/";

/* ---------------- informations légales ----------------
   Tout ce qui est entre crochets [ ] est un champ À COMPLÉTER avant mise en
   ligne : il est surligné automatiquement dans la fenêtre « légale » tant
   qu'il n'a pas été remplacé, et un avertissement s'affiche en haut de la
   fenêtre. Un seul endroit à éditer : les textes de LEGAL réutilisent ces
   valeurs.
   - Société : dénomination, forme, capital, RCS, n° de TVA.
   - Micro-entreprise : « Prénom NOM », legalForm « Entrepreneur individuel »,
     capital vide (""), rcs « Dispensé d'immatriculation au RCS et au RM »,
     vat « TVA non applicable, art. 293 B du CGI ». */
const COMPANY = {
  brand: "FakeParadise™",
  site: "[www.fakeparadise.fr]",
  legalName: "[Dénomination sociale ou Prénom NOM de l'exploitant]",
  legalForm: "[SAS / SARL / EURL / Entrepreneur individuel (micro-entreprise)]",
  capital: "[Capital social en euros]",           // "" pour un entrepreneur individuel
  siren: "[SIREN 000 000 000]",
  rcs: "[RCS Ville 000 000 000]",
  vat: "[N° de TVA FRXX 000 000 000, ou « TVA non applicable, art. 293 B du CGI »]",
  address: "[N°, rue, code postal, ville du siège social]",
  email: "[contact@fakeparadise.fr]",
  phone: "[+33 X XX XX XX XX]",
  director: "[Prénom NOM du directeur de la publication]",
  host: { name:"[Nom de l'hébergeur]", address:"[Adresse de l'hébergeur]", phone:"[Téléphone de l'hébergeur]" },
  idu: "[Identifiant unique REP textile délivré par Refashion : FRXXXXXX_11XXXX]",
  mediator: { name:"[Nom du médiateur de la consommation]", address:"[Adresse postale du médiateur]", url:"[https://www.site-du-mediateur.fr]" },
  payment: "[Stripe / PayPal / …]",

{ id:"cgv", label:"CGV", title:"Conditions générales de vente", html:`
<p>Les présentes conditions générales de vente (« CGV ») régissent les ventes de vêtements et d'articles textiles conclues à distance entre ${C.legalName} (« ${C.brand} », « nous »), ${C.legalForm}, ${C.address}, ${C.rcs}, et tout consommateur passant commande sur le site ${C.site} (« le Client »). Toute commande implique l'acceptation sans réserve des présentes CGV, accessibles à tout moment depuis le pied de page du site.</p>

<h3>Article 1 — Produits</h3>
<p>Les produits sont présentés avec leurs caractéristiques essentielles : description, composition en fibres conformément au règlement (UE) n° 1007/2011, conseils d'entretien, tailles et, le cas échéant, origine. Les photographies et couleurs sont aussi fidèles que possible mais peuvent varier légèrement selon l'écran utilisé ; elles n'ont pas de valeur contractuelle.</p>
<p>Les articles de la catégorie « Unique Pieces » sont des pièces uniques ou en série limitée, confectionnées, peintes ou retouchées à la main, parfois à partir de textiles de seconde main (upcycling). Les légères irrégularités propres à ce travail artisanal, décrites sur la fiche produit, sont une caractéristique de l'article et non un défaut. Ces pièces existent en un seul exemplaire : la première commande validée et payée emporte la vente.</p>
<p>Les offres sont valables tant qu'elles sont visibles sur le site et dans la limite des stocks disponibles. En cas d'indisponibilité après commande, le Client en est informé par e-mail et remboursé dans les quatorze (14) jours.</p>

<h3>Article 2 — Prix</h3>
<p>Les prix sont indiqués en euros, toutes taxes comprises, hors frais de livraison. ${C.vat}. Les frais de livraison sont précisés avant la validation définitive de la commande. L'affichage des prix dans une autre devise (USD, GBP) est fourni à titre indicatif : la commande est réglée en euros et le taux appliqué par la banque du Client peut différer.</p>
<p>Pour les livraisons hors Union européenne, des droits de douane et taxes à l'importation peuvent être exigés par le pays de destination ; ils restent à la charge du Client.</p>
<p>Toute annonce de réduction de prix indique le prix antérieur, c'est-à-dire le prix le plus bas pratiqué par ${C.brand} au cours des trente (30) jours précédant l'application de la réduction (article L. 112-1-1 du Code de la consommation).</p>
<p>${C.brand} peut modifier ses prix à tout moment ; les produits sont facturés au tarif en vigueur au moment de la validation de la commande.</p>

<h3>Article 3 — Commande</h3>
<p>Le Client sélectionne les articles, les ajoute à son panier (« Bag »), vérifie le contenu et le montant total de sa commande, corrige d'éventuelles erreurs, puis la confirme en procédant au paiement. Cette seconde confirmation vaut acceptation des présentes CGV et engagement ferme d'achat (articles 1127-1 et 1127-2 du Code civil). Un e-mail accusant réception de la commande est adressé au Client sans délai injustifié ; la vente est conclue à cet envoi.</p>
<p>${C.brand} se réserve le droit de refuser ou d'annuler toute commande en cas de litige antérieur, de suspicion de fraude, d'indisponibilité du produit ou d'erreur manifeste de prix. Les commandes d'un montant supérieur ou égal à 120 € sont archivées pendant dix (10) ans (article L. 213-1 du Code de la consommation) et accessibles sur simple demande.</p>

<h3>Article 4 — Paiement</h3>
<p>Le paiement est exigible intégralement à la commande, par carte bancaire ou tout autre moyen proposé lors du règlement, via le prestataire de paiement sécurisé ${C.payment} (authentification 3-D Secure). ${C.brand} n'a accès à aucune donnée bancaire et n'en conserve aucune. Les produits restent la propriété de ${C.brand} jusqu'au complet encaissement du prix.</p>

<h3>Article 5 — Livraison</h3>
<p>Les produits sont livrés à l'adresse indiquée lors de la commande, dans les zones suivantes : ${C.shipping.zones.fr}, par ${C.shipping.carriers}. Les commandes sont préparées sous ${C.shipping.prep.fr} après confirmation du paiement, puis livrées sous ${C.shipping.delivery.fr} ; les pièces uniques ou réalisées à la commande peuvent nécessiter un délai supplémentaire précisé sur la fiche produit. À défaut d'indication, la livraison intervient au plus tard trente (30) jours après la conclusion du contrat (article L. 216-1 du Code de la consommation).</p>
<p>En cas de retard, le Client peut, après avoir enjoint ${C.brand} d'effectuer la livraison dans un délai supplémentaire raisonnable resté sans effet, résoudre le contrat par écrit et obtenir le remboursement de toutes les sommes versées dans les quatorze (14) jours (articles L. 216-6 et L. 216-7). Les risques de perte ou d'endommagement des produits sont transférés au Client au moment où il en prend physiquement possession (article L. 216-4).</p>
<p>Il appartient au Client de vérifier l'état du colis à la réception et, en cas de dommage ou de manquant, de formuler des réserves auprès du transporteur puis d'en informer ${C.brand} à ${C.email} dans les meilleurs délais, photographies à l'appui.</p>

<h3>Article 6 — Droit de rétractation</h3>
<p>Conformément aux articles L. 221-18 et suivants du Code de la consommation, le Client dispose d'un délai de quatorze (14) jours à compter de la réception du dernier article de sa commande pour se rétracter, sans avoir à motiver sa décision. Il notifie sa décision à ${C.brand} par tout écrit dénué d'ambiguïté (e-mail à ${C.email} ou courrier à ${C.address}), par exemple au moyen du formulaire ci-dessous.</p>
<p>Le Client renvoie les articles sans retard excessif, et au plus tard quatorze (14) jours après sa notification, à l'adresse suivante : ${C.shipping.returnAddress}. Les frais de retour sont à la charge du Client. Le Client peut essayer l'article comme il le ferait en boutique ; sa responsabilité n'est engagée qu'en cas de dépréciation résultant de manipulations autres que celles nécessaires pour établir la nature, les caractéristiques et le bon fonctionnement du bien (article L. 221-23). Il est recommandé de renvoyer les articles dans leur emballage d'origine, étiquettes attachées, par envoi suivi.</p>
<p>${C.brand} rembourse la totalité des sommes versées, y compris les frais de livraison standard, au plus tard quatorze (14) jours à compter de la réception de la décision de rétractation ; ce remboursement peut être différé jusqu'à récupération des articles ou jusqu'à réception d'une preuve d'expédition (article L. 221-24). Il est effectué avec le moyen de paiement utilisé pour la commande.</p>
<p>Conformément à l'article L. 221-28, le droit de rétractation ne s'applique pas aux articles confectionnés selon les spécifications du Client ou nettement personnalisés (pièces sur mesure ou personnalisées à la demande), ce qui est indiqué sur la fiche produit avant la commande.</p>
<div class="legal-form">
<p><strong>Formulaire de rétractation</strong> (annexe à l'article R. 221-1 du Code de la consommation)<br>
<em>Veuillez compléter et renvoyer le présent formulaire uniquement si vous souhaitez vous rétracter du contrat.</em></p>
<p>À l'attention de ${C.legalName}, ${C.address}, ${C.email} :<br>
Je/nous (*) vous notifie/notifions (*) par la présente ma/notre (*) rétractation du contrat portant sur la vente du bien ci-dessous :<br>
