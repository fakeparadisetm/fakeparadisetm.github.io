<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FakeParadise™</title>
<link rel="preload" as="image" href="icons/startup%20icon%20web.png">
<link rel="preload" as="image" href="icons/startup%20icon2%20base.png">
<link rel="preload" as="image" href="icons/startup%20icon2%20palm%20left.png">
<link rel="preload" as="image" href="icons/startup%20icon2%20palm%20right.png">
<style>
  :root{
    --bg-0:#04080c;
    --bg-1:#0d1f30;
    --blue:#5aa8c2;
    --blue-soft:#3d7f9c;
    --blue-dim:#1c3646;
    --accent-rgb:90,168,194;
    --accent2-rgb:60,110,140;
    --sale-rgb:217,185,106;
    --bg-0-hex:#04080c;
    --bg-1-hex:#0d1f30;
    --white:#ffffff;
    --white-60:rgba(255,255,255,0.55);
    --white-35:rgba(255,255,255,0.3);
    --sale:#d9b96a;
    --tint-neutral:rgba(255,255,255,0.7); /* marque et horloge : neutre, légèrement teinté par l'ambiance */
    --footer-h:30px; /* hauteur réelle de la banderole légale, resynchronisée en JS */
    --xmb-bar:35vh;  /* hauteur du centre de la barre d'icônes XMB (50vh = milieu ; remontée pour
                        laisser 5 produits visibles sous la sélection sur un écran 1080p) */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  [hidden]{display:none!important;}
  /* les boutons n'héritent pas de la police par défaut (police système du
     navigateur, graisse 400) : on les aligne sur le site */
  button{font-family:inherit;font-weight:inherit;}

  /* ---------- police ----------
     Inter, police variable libre (licence SIL OFL 1.1, voir fonts/README.txt),
     servie par le site lui-même : rendu identique partout, sans service
     tiers. Graisse de base 450, un cran au-dessus du Regular (choix
     utilisateur : « un peu plus grasse ») ; les autres graisses du site
     suivent d'un cran (550, 650), le gras reste 700. */
  @font-face{
    font-family:"Inter";
    src:url("fonts/InterVariable.woff2") format("woff2");
    font-weight:100 900;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:"Inter";
    src:url("fonts/InterVariable-Italic.woff2") format("woff2");
    font-weight:100 900;font-style:italic;font-display:swap;
  }
  html,body{
    height:100%;
    background:var(--bg-0);
    /* Inter d'abord ; à défaut Helvetica si installée, sinon Arial */
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:450;
    color:var(--white);
    overflow:hidden;
    user-select:none;
  }

  /* ---------- wave background ---------- */
  #waveCanvas{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:0;
    filter:blur(0.3px) saturate(1.05);
  }
  #waveCanvasGlow{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:0;
    filter:blur(22px) saturate(1.1) brightness(1.1);
    opacity:0.55;
    mix-blend-mode:screen;
  }

  /* ---------- scintillement des vagues ----------
     Particules lumineuses accrochées aux nappes de vagues (voir drawSparkles).
     Sous la vignette pour que les bords restent sombres. */
  #sparkleCanvas{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:2;
    pointer-events:none;
    mix-blend-mode:screen;
  }

  .glow-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(100px);
    z-index:1;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:0.35;
  }
  .glow-orb.a{
    width:46vw;height:46vw;
    background:radial-gradient(circle, rgba(var(--accent-rgb),0.4), transparent 70%);
    top:-14vw; left:-10vw;
    animation:drift1 26s ease-in-out infinite;
  }
  .glow-orb.b{
    width:38vw;height:38vw;
    background:radial-gradient(circle, rgba(var(--accent2-rgb),0.35), transparent 70%);
    bottom:-16vw; right:-8vw;
    animation:drift2 30s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(3vw,4vw) scale(1.08); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-3vw,-3vw) scale(1.1); }
  }

  .vignette{
    position:fixed;inset:0;
    background:radial-gradient(ellipse at center, transparent 30%, rgba(0,2,4,0.92) 100%);
    z-index:2;
    pointer-events:none;
  }

  .scanlines{
    position:fixed;inset:0;
    z-index:2;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    opacity:0.45;
  }

  /* ---------- écran de démarrage (façon console) ----------
     Comme sur la PS3 : le ruban ondule déjà sur un fond assombri, le logo se
     révèle dessus, puis tout fond vers le XMB. Pendant ce temps l'interface
     est rendue mais invisible (body.booting) et réapparaît en fondu. */
  .startup-tint{
    position:fixed;inset:0;
    z-index:3; /* au-dessus des canvas et de la vignette, sous l'interface */
    background:
      radial-gradient(ellipse at 50% 55%, rgba(var(--accent2-rgb),0.14), rgba(0,0,0,0) 62%),
      rgba(2,4,7,0.66);
    pointer-events:none;
    transition:opacity 1.6s ease;
  }
  .startup{
    position:fixed;inset:0;
    z-index:20;
    transition:opacity 1.6s ease;
  }
  .startup-logo{
    position:absolute;
    width:min(28vw,380px);
    transform:translate(-50%,-50%) scale(0.98);
    opacity:0;
    filter:drop-shadow(0 0 14px rgba(255,255,255,0.28)) drop-shadow(0 0 40px rgba(var(--accent-rgb),0.25));
    transition:opacity 0.9s ease, transform 0.9s ease;
  }
  .startup.show .startup-logo{opacity:0.94;transform:translate(-50%,-50%) scale(1);}
  /* Emblème FakeParadise au centre, à la place du logo PS : trois calques
     issus de « startup icon2.png » (monticule + texte, palmier gauche,
     palmier droit) empilés à la même taille ; chaque palmier pivote autour
     de la base de son tronc. */
  .startup-mark{
    position:absolute;
    /* calé sur le logo FS3 comme le symbole PS sur la console : même hauteur
       à 15 % près (le logo mesure 0,411 × sa largeur), juste à sa gauche avec
       un écart de 3,5 % de la largeur d'écran, centres alignés */
    height:calc(min(28vw,380px) * 0.47);
    aspect-ratio:1200/1565;
    left:calc(75% - min(14vw,190px) - 3.5vw - min(28vw,380px) * 0.18);
    transform:translate(-50%,-50%) scale(0.98);
    opacity:0;
    filter:drop-shadow(0 0 14px rgba(255,255,255,0.28)) drop-shadow(0 0 40px rgba(var(--accent-rgb),0.25));
    transition:opacity 0.9s ease, transform 0.9s ease; /* mêmes effets que le logo */
  }
  .startup.show .startup-mark{opacity:0.94;transform:translate(-50%,-50%) scale(1);}
  .startup-mark img{
    position:absolute;inset:0;
    width:100%;height:100%;
  }
  .startup-mark .palm-left{transform-origin:41.4% 53.4%;}
  .startup-mark .palm-right{transform-origin:49.2% 53.4%;}
  /* balancement doux, achevé (retour au repos) juste avant le fondu vers le
     site, qui démarre 4 s après l'apparition du logo (STARTUP.hold) */
  .startup.show .palm-left{animation:palmSwayL 3.5s ease-in-out 0.35s 1 both;}
  .startup.show .palm-right{animation:palmSwayR 3.4s ease-in-out 0.45s 1 both;}
  @keyframes palmSwayL{
    0%{transform:rotate(0deg);} 35%{transform:rotate(-3.2deg);}
    70%{transform:rotate(2.2deg);} 100%{transform:rotate(0deg);}
  }
  @keyframes palmSwayR{
    0%{transform:rotate(0deg);} 30%{transform:rotate(2.6deg);}
    65%{transform:rotate(-2.4deg);} 100%{transform:rotate(0deg);}
  }
  .startup-hint{ /* même halo que les libellés sous les icônes */
    position:absolute;
    left:0;right:0;
    bottom:11vh;
    text-align:center;
    font-size:17px;
    letter-spacing:0.6px;
    color:var(--white);
    text-shadow:0 0 8px rgba(var(--accent-rgb),0.6), 0 0 18px rgba(var(--accent-rgb),0.3);
    opacity:0;
    transition:opacity 0.9s ease 0.3s;
  }
  .startup.show .startup-hint{opacity:1;}
  .startup.fade,.startup-tint.fade{opacity:0;pointer-events:none;}
  body.booting .brand,body.booting .topbar,body.booting .stage,
  body.booting .preview,body.booting .hintbar,body.booting .legalbar{opacity:0;}
  body.boot-fade .brand,body.boot-fade .topbar,body.boot-fade .stage,
  body.boot-fade .preview,body.boot-fade .hintbar,body.boot-fade .legalbar{transition:opacity 1.6s ease;}

  /* outil de développement temporaire : bouton « Mobile » (voir #devView et mobile.html) */
  .dev-view{
    position:fixed;top:6px;left:12px;
    z-index:30;               /* au-dessus de l'écran de démarrage : utilisable à tout moment */
    font-size:11px;padding:3px 10px;
    border-radius:999px;border:1px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.35);color:rgba(255,255,255,0.75);
    cursor:pointer;
  }
  .dev-view:hover{background:rgba(255,255,255,0.14);color:#fff;}

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:flex-end;
    align-items:center;
    gap:28px;
    padding:28px 48px;
    z-index:6;
    font-size:13px;
    font-weight:450;
    letter-spacing:0.5px;
    color:var(--white-60);
  }
  .topbar .cart{
    color:var(--blue);
    text-shadow:0 0 10px rgba(var(--accent-rgb),0.5);
    letter-spacing:0.4px;
  }
  .topbar .clock{
    color:var(--tint-neutral);
    text-shadow:0 0 10px rgba(var(--accent-rgb),0.25);
  }

  /* ---------- main XMB stage ---------- */
  .stage{
    position:fixed;inset:0;
    z-index:4;
    display:flex;
    align-items:center;
  }

  .categories{
    position:relative;
    display:flex;
    align-items:flex-start;
    height:100%;
    width:100%;
    padding-left:8vw;
    padding-bottom:calc(100vh - 2 * var(--xmb-bar)); /* les icônes (marges auto) se centrent dans le haut : centre à --xmb-bar */
    transition:transform 0.4s cubic-bezier(.2,.8,.2,1);
  }

  .category{
    position:relative;
    flex:0 0 auto;
    width:112px;
    margin-top:auto;
    margin-bottom:auto;
    margin-right:72px; /* fixe : la place réclamée par la colonne ouverte se fait par transform (render) */
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    opacity:0.55;
    transform:scale(0.82);
    transition:opacity 0.35s ease, transform 0.4s cubic-bezier(.2,.8,.2,1);
    will-change:transform;
  }
  .category.active{
    opacity:1;
    transform:scale(1);
    z-index:2;
  }
  .cat-icon{
    position:relative;
    width:104px;height:104px;
    display:flex;align-items:center;justify-content:center;
  }
  /* Lueur de l'icône active, qui épouse sa forme : une copie du glyphe
     (masque tiré du PNG, remplie de la couleur d'accent) légèrement agrandie
     et floutée une seule fois ; seule son opacité s'anime, donc aucun filtre
     n'est recalculé pendant les déplacements (Firefox re-rasterisait les
     drop-shadow empilés à chaque image). Le flou est sur l'élément parent
     et le masque sur l'enfant : dans l'ordre inverse, le masque rognerait
     net le flou. */
  .cat-glow{
    position:absolute;
    left:50%;top:50%;
    width:58px;height:58px;
    transform:translate(-50%,-50%) scale(1.22);
    filter:blur(6px);
    opacity:0;
    transition:opacity 0.35s ease;
    z-index:0;
    pointer-events:none;
  }
  .cat-glow-inner{
    position:absolute;inset:0;
    background:rgba(var(--accent-rgb),0.6); /* intensité de la lueur */
    -webkit-mask:var(--icon) center/contain no-repeat;
    mask:var(--icon) center/contain no-repeat;
  }
  .category.active .cat-glow{opacity:1;}
  .cat-icon img{
    position:relative;
    z-index:1;
    width:58px;height:58px;object-fit:contain;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4)); /* un seul filtre, statique */
  }
  .cat-label{
    margin-top:14px;
    font-size:13px;
    font-weight:450;
    letter-spacing:0.3px;
    color:var(--white-60);
    white-space:nowrap;
    opacity:0;
    transform:translateY(-4px);
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .category.active .cat-label{
    color:var(--white);
    opacity:1;
    transform:translateY(0);
    text-shadow:0 0 8px rgba(var(--accent-rgb),0.6), 0 0 18px rgba(var(--accent-rgb),0.3);
  }

  /* Liste verticale façon XMB : les lignes sont positionnées en absolu et
     placées par transform depuis render(), donc chaque changement de
     sélection (taille, luminosité, position) glisse via la transition. */
  .item-column{
    position:absolute;
    left:0;
    top:calc(100% + 16px);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }
  .item-column.open{
    opacity:1;
    pointer-events:auto;
  }
  .xmb-item{
    position:absolute;
    left:0;top:0;
    height:38px;            /* = ROW_H dans le script */
    line-height:22px;
    padding:8px 2px;
    font-size:18px;
    font-weight:450;        /* graisse constante : le poids ne s'anime pas proprement */
    color:var(--white-35);
    cursor:pointer;
    white-space:nowrap;
    letter-spacing:0.2px;
    text-align:left;
    transform-origin:left top;
    transition:transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.45s ease, color 0.35s ease, text-shadow 0.35s ease;
    will-change:transform;
  }
  .item-column.fast .xmb-item{transition-duration:0.18s;} /* défilement rapide (voir noteStep) */
  .xmb-item:hover{color:var(--white-60);}
  .xmb-item.selected{
    color:var(--white);
    text-shadow:0 0 6px rgba(var(--accent-rgb),0.7), 0 0 14px rgba(var(--accent-rgb),0.35);
  }
  .xmb-item .tag{
    font-size:12px;
    color:var(--sale);
    margin-left:6px;
    font-weight:650;
    letter-spacing:0.5px;
    text-shadow:0 0 8px rgba(var(--sale-rgb),0.5);
  }
  /* lignes produit : un petit aperçu 3D rotatif à la place du nom, comme les
     icônes verticales du XMB. La ligne n'est qu'une boîte carrée : le modèle
     est dessiné à sa position (lue à chaque image) dans un canvas WebGL
     transparent posé sur toute la scène (.rows-gl, créé par le script). Un
     canvas par ligne obligeait à recopier le rendu GPU douze fois par image,
     ce que Firefox fait en relisant tout le tampon : rotation saccadée. */
  .xmb-item.has-3d{
    width:88px;height:88px;   /* = ITEM_CSS dans le script ; ROW_H (96) laisse 8 px entre les lignes */
    padding:0;
    font-size:0;line-height:0;
    overflow:visible;
  }
  /* Canvas des aperçus de liste : enfant de .categories, donc le déplacement
     horizontal de la barre (translateX composité) s'applique à lui sans un
     seul calcul en JS. Les positions verticales des lignes, elles, sont
     animées par le module 3D avec la même courbe que les transitions CSS.
     Il couvre la fenêtre : les catégories boutique étant les premières, leurs
     colonnes restent dedans même quand la barre a glissé. */
  .rows-gl{
    position:absolute;inset:0;
    width:100%;height:100%;
    z-index:3;                /* au-dessus des catégories (l'active est à 2), sous les panneaux fixes */
    pointer-events:none;      /* les lignes en dessous gardent survol, clic et info-bulle */
  }
  /* ligne sélectionnée : halo d'accent derrière l'aperçu (dégradé statique, pas de filtre) */
  .xmb-item.has-3d.selected::before{
    content:'';
    position:absolute;inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(var(--accent-rgb),0.38), rgba(var(--accent-rgb),0.12) 55%, transparent 72%);
  }
  .xmb-item.has-3d .tag{position:absolute;right:-8px;top:-6px;margin:0;font-size:11px;line-height:1;}

  /* ---------- verre (panneaux annexes) ----------
     Verre translucide façon Apple : fond très léger, flou et saturation
     forts pour laisser transparaître le ruban, liseré clair sur le bord
     haut et reflet diagonal discret. Les panneaux gardent leur forme. */
  .glass{
    background:
      linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015) 45%, rgba(255,255,255,0.03)),
      rgba(8,20,30,0.20);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(255,255,255,0.04),
      0 24px 60px rgba(0,0,0,0.35),
      0 0 40px rgba(var(--accent2-rgb),0.10);
    backdrop-filter:blur(28px) saturate(1.7) brightness(1.06);
    -webkit-backdrop-filter:blur(28px) saturate(1.7) brightness(1.06);
  }
  .cart-panel.glass,.legal-panel.glass,.size-panel.glass{ /* texte long : un peu plus couvrant */
    background:
      linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01) 45%, rgba(255,255,255,0.025)),
      rgba(8,20,30,0.36);
  }

  /* ---------- product preview panel ---------- */
  .preview{
    --pad:32px;      /* padding ; repris par la sonde de mesure et la barre du descriptif */
    --reserve:436px; /* hauteur hors visuel : contenu fixe ≈ 240 px + barres haut/bas 160 px + marges 2×18 px */
    position:fixed;
    right:12vw;              /* rapproché du centre pour la lecture (6vw à l'origine, puis 9) */
    top:calc(50% - 8px);     /* centré entre l'horloge et la barre d'aide (bas ≈ 16 px plus haut que le haut) */
    transform:translateY(-50%);
    width:min(34vw,520px);   /* fiche produit : +18 % de large, textes ≈ +15 % ; 34vw ménage la barre d'icônes sous 1530 px */
    z-index:6;
    opacity:0;
    transition:opacity 0.4s ease; /* la taille change pendant la baisse d'opacité, sans animation */
    pointer-events:none;
    padding:var(--pad);
    /* Bordure « floue » (demande utilisateur) : plus de trait net, un voile
       clair très léger qui culmine sur l'arête et s'évanouit vers
       l'extérieur (0 %) et, plus discrètement, vers l'intérieur ; le reflet
       du bord haut garde l'esprit des lueurs de la fin des années 2000. */
    --soft-edge:
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 0 3px rgba(255,255,255,0.10),
      inset 0 0 10px rgba(255,255,255,0.04),
      0 0 3px rgba(255,255,255,0.12),
      0 0 12px 2px rgba(255,255,255,0.045);
    border-radius:16px;
    border-color:transparent;
    box-shadow:
      var(--soft-edge),
      0 24px 60px rgba(0,0,0,0.35),
      0 0 40px rgba(var(--accent2-rgb),0.10);
  }
  /* Contact, Réglages, Shipping Info : même gabarit pour les trois, un peu
     plus grand, contenu centré (marges égales) pour la lecture et la navigation */
  .preview.info-panel{
    width:min(34vw,500px);
    min-height:400px;
    max-height:min(76vh,660px); /* plafonné : au-delà, le texte défile */
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
  }
  .preview.info-panel .preview-name{white-space:normal;font-size:32px;}
  .preview.info-panel .preview-price{font-size:19px;}
  .preview.info-panel .preview-desc:not(.preview-desc-probe){ /* la sonde garde les métriques produit */
    font-size:16px;
    line-height:1.7;
    margin:20px auto 0;
    padding-right:0;
  }
  .preview.info-panel .preview-actions{justify-content:center;margin-top:28px;}
  .preview.info-panel .preview-cta{font-size:15px;padding:14px 26px;}
  .preview.info-panel .settings-label{font-size:14px;}
  .preview.info-panel .pills{justify-content:center;}
  .preview.info-panel .pill{font-size:15px;padding:11px 20px;}
  .preview.show{opacity:1; pointer-events:auto;}
  /* changement de catégorie : le panneau s'assombrit vite, puis le nouveau
     contenu apparaît en regagnant son opacité (transition normale de 0,4 s) */
  .preview.swap{
    opacity:0.12;
    transition:opacity 0.16s ease;
  }
  /* mode panneau (Entrée sur Réglages / Shipping Info) : cadre accentué */
  /* mode panneau : le cadre d'accent est lui aussi fondu (pas de trait net),
     mais assez présent pour signaler le focus clavier */
  .preview.focused{
    box-shadow:
      var(--soft-edge),
      inset 0 0 5px rgba(var(--accent-rgb),0.30),
      0 0 4px rgba(var(--accent-rgb),0.60),
      0 0 14px 2px rgba(var(--accent-rgb),0.30),
      0 0 40px rgba(var(--accent-rgb),0.25),
      0 24px 60px rgba(0,0,0,0.35);
  }
  .pill.focus{outline:2px solid rgba(255,255,255,0.85);outline-offset:3px;color:var(--white);}
  /* fiche produit en mode panneau : partie en surbrillance (visuel ou bouton), même liseré que les pastilles */
  .preview-cta.focus{outline:2px solid rgba(255,255,255,0.85);outline-offset:3px;color:var(--white);}
  .preview-swatch.focus{outline:2px solid rgba(255,255,255,0.85);outline-offset:4px;}
  /* ---------- sélecteur de tailles ----------
     Panneau flottant sous la fiche produit, aligné sur ses bords (position
     calculée par placeSizePicker), ouvert au survol de « + Add to bag » ou
     par Entrée. Frère de la fiche et non enfant : la fiche anime son
     opacité, ce qui priverait un panneau de verre enfant de son flou (même
     règle que .cart-panel). Ombre portée marquée et fond un peu plus
     couvrant pour qu'il se détache nettement de la fiche. */
  .size-picker{
    position:fixed;
    left:0;top:0;             /* remplacés par placeSizePicker */
    z-index:7;                /* au-dessus de la fiche (6) et de la barre d'aide (5), sous les fenêtres (9) */
    padding:16px 28px 20px;
    /* même bordure floue que la fiche (--soft-edge défini sur .preview) */
    --soft-edge:
      inset 0 1px 0 rgba(255,255,255,0.10),
      inset 0 0 3px rgba(255,255,255,0.10),
      inset 0 0 10px rgba(255,255,255,0.04),
      0 0 3px rgba(255,255,255,0.12),
      0 0 12px 2px rgba(255,255,255,0.045);
    border-radius:16px;
    border-color:transparent;
    text-align:center;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015) 45%, rgba(255,255,255,0.03)),
      rgba(8,20,30,0.42);
    box-shadow:
      var(--soft-edge),
      0 6px 14px rgba(0,0,0,0.45),
      0 22px 48px rgba(0,0,0,0.6);
    opacity:0;
    visibility:hidden;
    transform:translateY(-8px);
    pointer-events:none;
    transition:opacity 0.18s ease, transform 0.18s ease, visibility 0s linear 0.18s;
  }
  .size-picker.open{
    opacity:1;
    visibility:visible;
    transform:none;
    pointer-events:auto;
    transition:opacity 0.22s ease, transform 0.28s cubic-bezier(.2,.8,.2,1), visibility 0s;
  }
  /* pont invisible au-dessus du panneau : la souris passe du bouton au
     sélecteur sans que le survol ne s'interrompe dans l'interstice */
  .size-picker::before{content:'';position:absolute;left:0;right:0;top:-14px;height:14px;}
  .size-picker .settings-label{margin-bottom:10px;}
  .size-picker .pills{justify-content:center;gap:8px;}
  .size-picker .pill{min-width:54px;padding:10px 12px;font-size:14px;font-weight:550;letter-spacing:0.5px;}
  .preview-swatch{
    /* carré (photos produit 1:1), réduit si la fenêtre est basse pour que la
       fiche tienne entre l'horloge et la barre d'aide : hauteur d'écran moins
       le descriptif moins --reserve (contenu fixe + barres + marges) */
    width:min(100%, calc(100vh - var(--desc-h, 60px) - var(--reserve)));
    aspect-ratio:1/1;
    margin:0 auto;
    border-radius:3px;
    /* fond du viewer 3D : la couleur d'accent du moment, assombrie, unie (demande utilisateur) */
    background:linear-gradient(rgba(var(--accent-rgb),0.30), rgba(var(--accent-rgb),0.30)), #0a0d12;
    display:flex;
    align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 40px rgba(var(--accent-rgb),0.18), inset 0 0 50px rgba(var(--accent-rgb),0.06);
    position:relative;
    overflow:hidden;
  }
  .preview-swatch span{
    font-size:68px;
    opacity:0.18;
    font-weight:350;
    letter-spacing:2px;
    text-shadow:0 0 26px rgba(var(--accent-rgb),0.6);
  }
  /* ---------- visuel produit : diaporama vue 3D + photos ----------
     Vue 0 : maillage généré depuis la photo de face, rendu WebGL dans le
     canvas (fond = couleur d'accent assombrie du cadre). Vues 1 et 2 : les
     photos de face et de dos, à plat. Points façon Instagram en bas, flèches
     au survol (voir JS « diaporama »). Sans WebGL (classe no-gl), la vue 3D
     est absente. */
  .slide{position:absolute;inset:0;display:none;z-index:1;}
  .slide.active{display:block;}
  .slide.flat{width:100%;height:100%;object-fit:cover;}
  .preview-swatch canvas{position:absolute;inset:0;width:100%;height:100%;}
  .slide-dots{
    position:absolute;left:0;right:0;bottom:9px;
    display:flex;justify-content:center;gap:6px;
    z-index:3;
    pointer-events:none;
  }
  .preview-swatch:not(.has-slides) .slide-dots,.preview-swatch:not(.has-slides) .slide-arrow{display:none;}
  .dot{
    width:6px;height:6px;
    padding:0;border:none;border-radius:50%;
    background:rgba(255,255,255,0.45);
    box-shadow:0 0 4px rgba(0,0,0,0.6);
    cursor:pointer;
    pointer-events:auto;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .dot.active{background:#fff;transform:scale(1.3);}
  .slide-arrow{
    position:absolute;top:50%;
    width:30px;height:30px;
    transform:translateY(-50%);
    padding:0;border:none;border-radius:50%;
    background:rgba(0,0,0,0.45);
    color:#fff;
    font-size:22px;line-height:28px;
    text-align:center;
    cursor:pointer;
    opacity:0;
    transition:opacity 0.2s ease, background 0.2s ease;
    z-index:3;
  }
  .slide-arrow.prev{left:8px;}
  .slide-arrow.next{right:8px;}
  .slide-arrow:hover{background:rgba(0,0,0,0.7);}
  .preview-swatch.has-slides:hover .slide-arrow{opacity:1;}
  .preview-name{
    margin-top:22px;
    font-size:30px;
    font-weight:450;
    letter-spacing:0.3px;
    text-shadow:0 0 14px rgba(var(--accent-rgb),0.2);
    white-space:nowrap;      /* toujours une ligne : la fiche ne change pas de hauteur */
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.3;         /* hauteur fixe : un emoji (HELLO❤️) ne l'agrandit plus */
    height:1.3em;
  }
  .preview-swatch[hidden] + .preview-name{margin-top:0;} /* Contact / infos : pas de visuel */
  .preview-price{
    margin-top:8px;
    font-size:18px;
    color:var(--blue);
    font-weight:550;
    text-shadow:0 0 10px rgba(var(--accent-rgb),0.45);
  }
  .preview-price .was{
    color:var(--white-35);
    text-decoration:line-through;
    font-weight:450;
    margin-right:10px;
    font-size:16px;
    text-shadow:none;
  }
  .preview-desc{
    margin-top:16px;
    font-size:15px;
    line-height:1.6;
    color:var(--white-60);
    white-space:pre-line; /* les retours à la ligne du texte sont respectés */
    /* hauteur réservée = descriptif le plus long du catalogue, plafonnée à
       DESC_MAX_LINES (measureDescHeight) : la fiche garde la même taille et un
       texte plus long défile, barre fine collée au bord droit du panneau */
    height:var(--desc-h, auto);
    overflow-y:auto;
    margin-right:calc(8px - var(--pad)); /* barre de défilement à 8 px du bord du panneau */
    padding-right:calc(var(--pad) - 8px);
    scrollbar-width:thin;
    scrollbar-color:rgba(var(--accent-rgb),0.45) transparent;
  }
  .preview-desc::-webkit-scrollbar{width:6px;}
  .preview-desc::-webkit-scrollbar-track{background:transparent;}
  .preview-desc::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),0.45);border-radius:3px;}
  .preview-desc::-webkit-scrollbar-button{display:none;height:0;}
  .preview.info .preview-desc:not(.preview-desc-probe){height:auto;max-height:min(44vh,380px);} /* Contact, Shipping Info : texte entier, défile s'il est long */
  .preview-desc-probe{ /* clone invisible qui sert à la mesure */
    position:absolute;
    left:var(--pad);right:var(--pad); /* = padding de .preview : mesure à la vraie largeur */
    height:auto!important;
    margin:0;
    visibility:hidden;
    pointer-events:none;
  }
  .preview-cta{
    margin-top:26px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:13px 24px;
    background:rgba(var(--accent-rgb),0.05);
    border:1px solid var(--blue);
    color:var(--white);
    font-size:14px;
    letter-spacing:0.4px;
    cursor:pointer;
    border-radius:3px;
    transition:background 0.25s ease, box-shadow 0.25s ease;
    box-shadow:0 0 12px rgba(var(--accent-rgb),0.2);
  }
  .preview-cta:hover{
    background:rgba(var(--accent-rgb),0.15);
    box-shadow:0 0 10px rgba(var(--accent-rgb),0.5), 0 0 28px rgba(var(--accent-rgb),0.28);
  }
  /* rangée de boutons : « + Add to bag » et « More info » côte à côte */
  .preview-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;}
  .preview-actions .preview-cta{margin-top:0;}
  .preview-cta--secondary{
    background:transparent;
    border-color:rgba(255,255,255,0.25);
    color:var(--white-60);
    box-shadow:none;
  }
  .preview-cta--secondary:hover{
    background:rgba(255,255,255,0.06);
    border-color:rgba(255,255,255,0.5);
    color:var(--white);
    box-shadow:none;
  }

  /* ---------- fiche « More info » : guide des tailles ---------- */
  .info-overlay{
    position:fixed;inset:0;
    z-index:9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,2,4,0);
    visibility:hidden;
    pointer-events:none;
    transition:background-color 0.2s ease, visibility 0s linear 0.2s; /* même principe que .legal-overlay */
  }
  .info-overlay.open{
    background:rgba(0,2,4,0.55);
    visibility:visible;
    pointer-events:auto;
    transition:background-color 0.3s ease, visibility 0s;
  }
  /* Nommé .size-panel et non .info-panel : ce dernier désigne déjà le gabarit
     Contact / Réglages / Livraison du panneau d'aperçu (.preview.info-panel),
     que ces règles (enfants masqués hors ouverture) avaient fait disparaître. */
  .size-panel{
    width:min(92vw,560px);
    max-height:82vh;
    display:flex;
    flex-direction:column;
    border-radius:6px;
    overflow:hidden;
    transform:translateY(12px) scale(0.975);
    transition:transform 0.2s ease;
    user-select:text;
  }
  .info-overlay.open .size-panel{transform:none;transition:transform 0.35s cubic-bezier(.2,.8,.2,1);}
  .size-panel > *{opacity:0;transition:opacity 0s linear 0.2s;}
  .info-overlay.open .size-panel > *{opacity:1;transition:opacity 0.3s ease 0.05s;}
  .info-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    padding:26px 28px 14px;
  }
  .info-header h2{font-size:22px;font-weight:450;letter-spacing:0.3px;text-shadow:0 0 14px rgba(var(--accent-rgb),0.2);}
  .info-sub{margin-top:4px;font-size:12px;letter-spacing:0.5px;text-transform:uppercase;color:var(--white-35);}
  .info-body{
    padding:0 28px 24px;
    overflow-y:auto;
    font-size:13px;
    line-height:1.6;
    color:var(--white-60);
    scrollbar-width:thin;
    scrollbar-color:rgba(var(--accent-rgb),0.45) transparent;
  }
  .size-table{width:100%;border-collapse:collapse;text-align:center;}
  .size-table th,.size-table td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,0.07);vertical-align:top;}
  .size-table th{color:var(--white);font-weight:550;letter-spacing:0.4px;}
  .size-table th:first-child,.size-table td:first-child{text-align:left;color:var(--white-60);font-weight:450;white-space:nowrap;}
  .size-table td{color:var(--white);}
  .size-table .alt{display:block;font-size:11px;color:var(--white-35);}
  .info-note{margin-top:14px;font-size:12px;color:var(--white-35);}

  /* ---------- settings panel ---------- */
  .settings-panel{ display:none; }
  .settings-panel.active{ display:block; }
  .settings-group{ margin-bottom:26px; }
  .settings-group:last-child{ margin-bottom:0; }
  .settings-label{
    font-size:12px;
    letter-spacing:0.4px;
    color:var(--white-60);
    margin-bottom:12px;
  }
  .pills{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .pill{
    padding:9px 16px;
    font-size:13px;
    letter-spacing:0.3px;
    color:var(--white-60);
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;
    cursor:pointer;
    transition:all 0.25s ease;
  }
  .pill:hover{ color:var(--white); border-color:rgba(255,255,255,0.3); }
  .pill.active{
    color:var(--white);
    background:rgba(var(--accent-rgb),0.15);
    border-color:var(--blue);
    box-shadow:0 0 14px rgba(var(--accent-rgb),0.35);
  }

  /* ---------- bottom hint bar ---------- */
  .hintbar{
    position:fixed;
    bottom:var(--footer-h);left:0;right:0;
    display:flex;
    justify-content:center;
    gap:36px;
    padding:20px;
    font-size:12px;
    color:var(--white-35);
    z-index:5;
    letter-spacing:0.3px;
  }
  .hintbar span{display:flex;align-items:center;gap:7px;}
  .key{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;
    border:1px solid var(--white-35);
    border-radius:50%;
    font-size:10px;
    box-shadow:0 0 6px rgba(var(--accent-rgb),0.12);
  }

  /* ---------- brand mark ---------- */
  .brand{
    position:fixed;
    top:28px;left:48px;
    z-index:6;
    font-size:14px;
    font-weight:450;
    letter-spacing:2.5px;
    color:var(--tint-neutral);
  }
  .brand b{color:var(--tint-neutral);font-weight:650;text-shadow:0 0 12px rgba(var(--accent-rgb),0.5);}

  .topbar .cart{
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    padding:0;
  }
  .topbar .cart:hover{color:var(--white);}

  /* ---------- cart panel ---------- */
  /* Le voile s'anime par sa couleur de fond et non par opacity : un ancêtre
     à opacité < 1 devient une « backdrop root » et le flou du panneau (verre)
     n'apparaîtrait qu'à la fin de l'animation. visibility masque l'ensemble
     une fois fermé, après le temps de la sortie. */
  .cart-overlay{
    position:fixed;inset:0;
    right:min(90vw,380px); /* le voile s'arrête au panneau : le verre voit la page, pas un fond assombri */
    z-index:9;
    background:rgba(0,2,4,0);
    visibility:hidden;
    pointer-events:none;
    transition:background-color 0.3s ease, visibility 0s linear 0.35s;
  }
  .cart-overlay.open{
    background:rgba(0,2,4,0.55);
    visibility:visible;
    pointer-events:auto;
    transition:background-color 0.3s ease, visibility 0s;
  }

  /* Le panneau est un frère du voile, pas son enfant : aucun ancêtre animé
     (opacité, couleur, visibilité) ne s'interpose entre le verre et la page,
     ce qui garantit le flou d'arrière-plan dans tous les navigateurs. Il est
     piloté par la classe .open du voile via le sélecteur frère « + ». */
  .cart-panel{
    position:fixed;
    top:0;right:0;bottom:0;
    z-index:10;
    width:min(90vw,380px);
    padding:32px 28px;
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    visibility:hidden;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), visibility 0s linear 0.35s;
  }
  .cart-overlay.open + .cart-panel{
    transform:translateX(0);
    visibility:visible;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), visibility 0s;
  }
  /* ouverture : verre dès le clic, contenu en fondu ; fermeture : le contenu
     reste pendant le glissement de sortie et disparaît avec le panneau */
  .cart-panel > *{opacity:0;transition:opacity 0s linear 0.35s;}
  .cart-overlay.open + .cart-panel > *{opacity:1;transition:opacity 0.3s ease 0.1s;}

  .cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
  }
  .cart-header h2{
    font-size:18px;
    font-weight:450;
    letter-spacing:0.3px;
  }
  .cart-close{
    background:none;border:none;color:var(--white-60);
    font-size:20px;cursor:pointer;line-height:1;
    padding:4px;
  }
  .cart-close:hover{color:var(--white);}

  .cart-items{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .cart-empty{
    color:var(--white-35);
    font-size:13px;
    line-height:1.6;
    margin-top:12px;
  }
  .cart-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding-bottom:14px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .cart-row-name{
    font-size:14px;
    font-weight:450;
  }
  .cart-row-price{
    font-size:13px;
    color:var(--blue);
    margin-top:4px;
  }
  .cart-row-size{ /* taille choisie, en pastille à côté du nom */
    display:inline-block;
    margin-left:8px;
    padding:1px 8px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:10px;
    font-size:11px;
    letter-spacing:0.4px;
    color:var(--white-60);
    vertical-align:middle;
  }
  .cart-remove{
    background:none;border:none;
    color:var(--white-35);
    font-size:13px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .cart-remove:hover{color:var(--sale);}
  /* quantité par ligne : groupe − n + à gauche de « Remove » */
  .cart-row-actions{display:flex;align-items:center;gap:12px;flex:0 0 auto;}
  .cart-qty{
    display:inline-flex;
    align-items:center;
    border:1px solid rgba(255,255,255,0.14);
    border-radius:14px;
    overflow:hidden;
  }
  .cart-qty-btn{
    background:none;border:none;
    width:26px;height:26px;
    color:var(--white-60);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .cart-qty-btn:hover{background:rgba(255,255,255,0.08);color:var(--white);}
  .cart-qty-n{min-width:22px;text-align:center;font-size:13px;color:var(--white);}
  .cart-row-unit{margin-left:8px;font-size:11px;color:var(--white-35);} /* « 2 × €25 » sous le prix de la ligne */

  .cart-footer{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .cart-total{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    margin-bottom:18px;
  }
  .cart-total .amount{color:var(--blue);text-shadow:0 0 10px rgba(var(--accent-rgb),0.4);}
  .cart-checkout{
    width:100%;
    padding:13px;
    background:rgba(var(--accent-rgb),0.08);
    border:1px solid var(--blue);
    color:var(--white);
    font-size:13px;
    letter-spacing:0.4px;
    cursor:pointer;
    border-radius:3px;
    transition:background 0.25s ease, box-shadow 0.25s ease;
  }
  .cart-checkout:hover{
    background:rgba(var(--accent-rgb),0.18);
    box-shadow:0 0 24px rgba(var(--accent-rgb),0.3);
  }

  /* ---------- banderole légale (footer) ---------- */
  .legalbar{
    position:fixed;
    bottom:0;left:0;right:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:26px;
    min-height:var(--footer-h);
    padding:0 48px;
    font-size:10.5px;
    font-weight:450;
    letter-spacing:0.6px;
    color:var(--white-35);
    background:linear-gradient(to top, rgba(0,2,4,0.6), rgba(0,2,4,0.25));
    border-top:1px solid rgba(var(--accent-rgb),0.14);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }
  .legalbar-copy{ white-space:nowrap; }
  .legalbar-links{
    display:flex;
    align-items:center;
  }
  .legalbar-links button{
    background:none;border:none;
    font:inherit;
    letter-spacing:inherit;
    color:inherit;
    padding:6px 11px;
    cursor:pointer;
    white-space:nowrap;
    transition:color 0.2s ease, text-shadow 0.2s ease;
  }
  .legalbar-links button + button{ border-left:1px solid rgba(255,255,255,0.1); }
  .legalbar-links button:hover,
  .legalbar-links button:focus-visible{
    color:var(--white);
    text-shadow:0 0 8px rgba(var(--accent-rgb),0.6);
    outline:none;
  }

  /* ---------- fenêtre légale (même verre dépoli que le panier) ---------- */
  .legal-overlay{
    position:fixed;inset:0;
    z-index:9;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(0,2,4,0);
    visibility:hidden;
    pointer-events:none;
    transition:background-color 0.2s ease, visibility 0s linear 0.2s; /* même principe que .cart-overlay ; sortie rapide */
  }
  .legal-overlay.open{
    background:rgba(0,2,4,0.6);
    visibility:visible;
    pointer-events:auto;
    transition:background-color 0.3s ease, visibility 0s;
  }
  .legal-panel{
    width:min(100%,980px);
    height:min(100%,720px);
    display:flex;
    border-radius:6px;
    overflow:hidden;
    transform:translateY(12px) scale(0.975);
    transition:transform 0.2s ease; /* fermeture : rapide, contenu conservé jusqu'au bout */
    user-select:text; /* le body est en user-select:none ; ici on doit pouvoir copier une adresse */
  }
  .legal-overlay.open .legal-panel{transform:none;transition:transform 0.35s cubic-bezier(.2,.8,.2,1);}
  /* Ouverture : le verre est là dès le clic, seul le contenu apparaît en fondu.

{ id:"mentions", label:"Mentions légales", title:"Mentions légales", html:`
<p>Conformément à l'article 6-III de la loi n° 2004-575 du 21 juin 2004 pour la confiance dans l'économie numérique (LCEN), les informations suivantes sont portées à la connaissance des utilisateurs du site ${C.site}.</p>

<p>Les offres sont valables tant qu'elles sont visibles sur le site et dans la limite des stocks disponibles. En cas d'indisponibilité après commande, le Client en est informé par e-mail et remboursé dans les quatorze (14) jours.</p>

<h3>Article 2 — Prix</h3>
<p>Les prix sont indiqués en euros, toutes taxes comprises, hors frais de livraison. ${C.vat}. Les frais de livraison sont précisés avant la validation définitive de la commande. L'affichage des prix dans une autre devise (USD, GBP) est fourni à titre indicatif : la commande est réglée en euros et le taux appliqué par la banque du Client peut différer.</p>
<p>Pour les livraisons hors Union européenne, des droits de douane et taxes à l'importation peuvent être exigés par le pays de destination ; ils restent à la charge du Client.</p>
<p>Toute annonce de réduction de prix indique le prix antérieur, c'est-à-dire le prix le plus bas pratiqué par ${C.brand} au cours des trente (30) jours précédant l'application de la réduction (article L. 112-1-1 du Code de la consommation).</p>
<p>${C.brand} peut modifier ses prix à tout moment ; les produits sont facturés au tarif en vigueur au moment de la validation de la commande.</p>

<h3>Article 3 — Commande</h3>
<p>Le Client sélectionne les articles, les ajoute à son panier (« Bag »), vérifie le contenu et le montant total de sa commande, corrige d'éventuelles erreurs, puis la confirme en procédant au paiement. Cette seconde confirmation vaut acceptation des présentes CGV et engagement ferme d'achat (articles 1127-1 et 1127-2 du Code civil). Un e-mail accusant réception de la commande est adressé au Client sans délai injustifié ; la vente est conclue à cet envoi.</p>
<p>${C.brand} se réserve le droit de refuser ou d'annuler toute commande en cas de litige antérieur, de suspicion de fraude, d'indisponibilité du produit ou d'erreur manifeste de prix. Les commandes d'un montant supérieur ou égal à 120 € sont archivées pendant dix (10) ans (article L. 213-1 du Code de la consommation) et accessibles sur simple demande.</p>

<h3>Article 4 — Paiement</h3>
<p>Le paiement est exigible intégralement à la commande, par carte bancaire ou tout autre moyen proposé lors du règlement, via le prestataire de paiement sécurisé ${C.payment} (authentification 3-D Secure). ${C.brand} n'a accès à aucune donnée bancaire et n'en conserve aucune. Les produits restent la propriété de ${C.brand} jusqu'au complet encaissement du prix.</p>

<h3>Article 5 — Livraison</h3>
<p>Les produits sont livrés à l'adresse indiquée lors de la commande, dans les zones suivantes : ${C.shipping.zones.fr}, par ${C.shipping.carriers}. Les commandes sont préparées sous ${C.shipping.prep.fr} après confirmation du paiement, puis livrées sous ${C.shipping.delivery.fr} ; les pièces uniques ou réalisées à la commande peuvent nécessiter un délai supplémentaire précisé sur la fiche produit. À défaut d'indication, la livraison intervient au plus tard trente (30) jours après la conclusion du contrat (article L. 216-1 du Code de la consommation).</p>
<p>En cas de retard, le Client peut, après avoir enjoint ${C.brand} d'effectuer la livraison dans un délai supplémentaire raisonnable resté sans effet, résoudre le contrat par écrit et obtenir le remboursement de toutes les sommes versées dans les quatorze (14) jours (articles L. 216-6 et L. 216-7). Les risques de perte ou d'endommagement des produits sont transférés au Client au moment où il en prend physiquement possession (article L. 216-4).</p>
<p>Il appartient au Client de vérifier l'état du colis à la réception et, en cas de dommage ou de manquant, de formuler des réserves auprès du transporteur puis d'en informer ${C.brand} à ${C.email} dans les meilleurs délais, photographies à l'appui.</p>

<h3>Article 6 — Droit de rétractation</h3>
<p>Conformément aux articles L. 221-18 et suivants du Code de la consommation, le Client dispose d'un délai de quatorze (14) jours à compter de la réception du dernier article de sa commande pour se rétracter, sans avoir à motiver sa décision. Il notifie sa décision à ${C.brand} par tout écrit dénué d'ambiguïté (e-mail à ${C.email} ou courrier à ${C.address}), par exemple au moyen du formulaire ci-dessous.</p>
<p>Le Client renvoie les articles sans retard excessif, et au plus tard quatorze (14) jours après sa notification, à l'adresse suivante : ${C.shipping.returnAddress}. Les frais de retour sont à la charge du Client. Le Client peut essayer l'article comme il le ferait en boutique ; sa responsabilité n'est engagée qu'en cas de dépréciation résultant de manipulations autres que celles nécessaires pour établir la nature, les caractéristiques et le bon fonctionnement du bien (article L. 221-23). Il est recommandé de renvoyer les articles dans leur emballage d'origine, étiquettes attachées, par envoi suivi.</p>
<p>${C.brand} rembourse la totalité des sommes versées, y compris les frais de livraison standard, au plus tard quatorze (14) jours à compter de la réception de la décision de rétractation ; ce remboursement peut être différé jusqu'à récupération des articles ou jusqu'à réception d'une preuve d'expédition (article L. 221-24). Il est effectué avec le moyen de paiement utilisé pour la commande.</p>
<p>Conformément à l'article L. 221-28, le droit de rétractation ne s'applique pas aux articles confectionnés selon les spécifications du Client ou nettement personnalisés (pièces sur mesure ou personnalisées à la demande), ce qui est indiqué sur la fiche produit avant la commande.</p>

<p>À l'attention de ${C.legalName}, ${C.address}, ${C.email} :<br>

(*) Rayez la mention inutile.</p>
</div>

<h3>Article 7 — Garanties légales</h3>
<p>Indépendamment du droit de rétractation, tous les produits bénéficient de la garantie légale de conformité (articles L. 217-3 à L. 217-20 du Code de la consommation) et de la garantie des vices cachés (articles 1641 à 1649 du Code civil). Pour les mettre en œuvre, le Client écrit à ${C.email} en décrivant le défaut constaté, photographies à l'appui ; les frais de retour d'un article non conforme sont pris en charge par ${C.brand}.</p>
<div class="legal-box">
<p>Le consommateur dispose d'un délai de deux ans à compter de la délivrance du bien pour obtenir la mise en œuvre de la garantie légale de conformité en cas d'apparition d'un défaut de conformité. Durant ce délai, le consommateur n'est tenu d'établir que l'existence du défaut de conformité et non la date d'apparition de celui-ci.</p>
<p>Lorsque le contrat de vente du bien prévoit la fourniture d'un contenu numérique ou d'un service numérique de manière continue pendant une durée supérieure à deux ans, la garantie légale est applicable à ce contenu numérique ou ce service numérique tout au long de la période de fourniture prévue. Durant ce délai, le consommateur n'est tenu d'établir que l'existence du défaut de conformité du contenu numérique ou du service numérique et non la date d'apparition de celui-ci.</p>
<p>La garantie légale de conformité emporte obligation pour le professionnel, le cas échéant, de fournir toutes les mises à jour nécessaires au maintien de la conformité du bien.</p>
<p>La garantie légale de conformité donne au consommateur droit à la réparation ou au remplacement du bien dans un délai de trente jours suivant sa demande, sans frais et sans inconvénient majeur pour lui.</p>
<p>Si le bien est réparé dans le cadre de la garantie légale de conformité, le consommateur bénéficie d'une extension de six mois de la garantie initiale.</p>
<p>Si le consommateur demande la réparation du bien, mais que le vendeur impose le remplacement, la garantie légale de conformité est renouvelée pour une période de deux ans à compter de la date de remplacement du bien.</p>
<p>Le consommateur peut obtenir une réduction du prix d'achat en conservant le bien ou mettre fin au contrat en se faisant rembourser intégralement contre restitution du bien, si :</p>
<ol>
<li>le professionnel refuse de réparer ou de remplacer le bien ;</li>
<li>la réparation ou le remplacement du bien intervient après un délai de trente jours ;</li>
<li>la réparation ou le remplacement du bien occasionne un inconvénient majeur pour le consommateur, notamment lorsque le consommateur supporte définitivement les frais de reprise ou d'enlèvement du bien non conforme, ou s'il supporte les frais d'installation du bien réparé ou de remplacement ;</li>
<li>la non-conformité du bien persiste en dépit de la tentative de mise en conformité du vendeur restée infructueuse.</li>
</ol>
<p>Le consommateur a également droit à une réduction du prix du bien ou à la résolution du contrat lorsque le défaut de conformité est si grave qu'il justifie que la réduction du prix ou la résolution du contrat soit immédiate. Le consommateur n'est alors pas tenu de demander la réparation ou le remplacement du bien au préalable.</p>
<p>Le consommateur n'a pas droit à la résolution de la vente si le défaut de conformité est mineur.</p>
<p>Toute période d'immobilisation du bien en vue de sa réparation ou de son remplacement suspend la garantie qui restait à courir jusqu'à la délivrance du bien remis en état.</p>
<p>Les droits mentionnés ci-dessus résultent de l'application des articles L. 217-1 à L. 217-32 du Code de la consommation.</p>
<p>Le vendeur qui fait obstacle de mauvaise foi à la mise en œuvre de la garantie légale de conformité encourt une amende civile d'un montant maximal de 300 000 euros, qui peut être porté jusqu'à 10 % du chiffre d'affaires moyen annuel (article L. 241-5 du Code de la consommation).</p>
<p>Le consommateur bénéficie également de la garantie légale des vices cachés en application des articles 1641 à 1649 du Code civil, pendant une durée de deux ans à compter de la découverte du défaut. Cette garantie donne droit à une réduction de prix si le bien est conservé ou à un remboursement intégral contre restitution du bien.</p>
</div>

<h3>Article 8 — Responsabilité</h3>
<p>${C.brand} est responsable de plein droit de la bonne exécution du contrat conclu à distance (article L. 221-15 du Code de la consommation), sauf si l'inexécution est imputable au Client, au fait imprévisible et insurmontable d'un tiers ou à un cas de force majeure. ${C.brand} ne saurait être tenu responsable des dommages résultant d'un usage des produits non conforme à leur destination ou aux conseils d'entretien.</p>

<h3>Article 9 — Données personnelles</h3>
<p>Les données collectées lors de la commande sont nécessaires à son traitement et à la livraison. Leur traitement est décrit dans la <a data-legal-link="confidentialite">politique de confidentialité</a>.</p>

<h3>Article 10 — Propriété intellectuelle</h3>
<p>Les créations, graphismes, motifs, noms de modèles et visuels de ${C.brand} sont protégés par le droit d'auteur et le droit des marques. L'achat d'un produit n'emporte aucune cession de droits de propriété intellectuelle ; toute reproduction des graphismes ou motifs à des fins commerciales est interdite.</p>

<p>Conformément aux articles L. 611-1 et suivants et L. 616-1 du Code de la consommation, après avoir tenté de résoudre le litige directement par une réclamation écrite auprès de ${C.brand}, le Client peut, dans l'année qui suit cette réclamation, recourir gratuitement au médiateur de la consommation dont relève ${C.brand} : ${C.mediator.name}, ${C.mediator.address}, ${C.mediator.url}.</p>

<h3>Article 12 — Droit applicable et langue</h3>

`},

/* ---------------- catalogue enregistré (catalogue.json) ----------------
   Écrit par le gestionnaire de produits. On l'applique après le premier
   affichage : la page s'ouvre tout de suite avec les produits intégrés, et
   se reconstruit une fois le fichier lu (pendant l'écran de démarrage).
   Chaque produit porte un numéro de révision `v`, augmenté par le
   gestionnaire dès qu'une photo change : il est ajouté aux adresses des
   photos, ce qui donne une nouvelle clé au module 3D, donc un nouveau
   détourage et un nouveau modèle. Sans ce numéro, une photo remplacée sous
   le même nom garderait le modèle déjà calculé. */
function applyCatalogue(j){
  if (!j || !Array.isArray(j.categories)) return false;
  if (j.charts) Object.assign(SIZE_CHARTS, j.charts);
  let changed = false;
  j.categories.forEach(c => {
    const cat = DATA.find(d => d.id === c.id);
    if (!cat || !Array.isArray(c.items)) return;
    cat.items = c.items.map(it => {
      const item = Object.assign({}, it);
      const v = it.v ? '?v=' + encodeURIComponent(it.v) : '';
      if (item.img) item.img += v;
      if (item.img2) item.img2 += v;
      return item;
    });
    changed = true;
  });
  return changed;
}
// Le fichier est lu AVANT la première construction du menu : l'écran de
// démarrage couvre l'attente, et les modèles 3D ne sont pas calculés deux fois
// (ceux des produits intégrés, puis ceux du catalogue). S'il tarde ou manque,
// on n'attend pas plus d'une seconde et demie et on repart des produits
// intégrés, quitte à reconstruire quand il arrive.
function withCatalogue(done){
  let fired = false;
  const once = () => { if (!fired){ fired = true; done(); } };
  if (location.protocol === 'file:') return once(); // fetch interdit hors http
  const late = setTimeout(once, 1500);
  fetch('catalogue.json', { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(j => { applyCatalogue(j); })
    .catch(() => {})                                 // pas de fichier : les produits intégrés suffisent
    .then(() => {
      clearTimeout(late);
      if (!fired) return once();
      const items = DATA[activeCat] ? DATA[activeCat].items : [];
      activeItem = Math.max(0, Math.min(activeItem, items.length - 1)); // la liste a pu raccourcir
      build();
    });
}

/* ---------------- couleur d'ambiance ----------------
   Comme la PS3, dont la teinte du XMB change au fil du calendrier, le fond
   parcourt lentement l'arc-en-ciel en boucle. La teinte est déduite de
   l'horloge et non du chargement : recharger la page ne ramène pas au rose
   de départ, et rien n'est enregistré dans le navigateur. Le cycle est parti
   d'un rose un peu muted à MOOD.epoch. Toute la palette (fond, accents,
   voiles, halo, orbes) découle de cette teinte. */
const MOOD = {
  epoch: Date.UTC(2026, 8, 14, 17, 0),  // départ du cycle : 14 sept. 2026, 19 h (Paris)
  period: 45 * 60 * 1000,               // durée d'un tour complet de l'arc-en-ciel (45 min, 8°/min)
  startHue: 335,                        // rose
  sat: 0.5,                             // saturation générale, volontairement retenue
  refreshMs: 2000,                      // cadence de mise à jour (≈ 0,07° par pas : invisible)
};
let moodHue = MOOD.startHue;

function hslToRgb(h, s, l){
  const c = (1 - Math.abs(2*l - 1)) * s;
  const hp = (((h % 360) + 360) % 360) / 60;
  const x = c * (1 - Math.abs(hp % 2 - 1));
  const m = l - c/2;
  let r = 0, g = 0, b = 0;
  if (hp < 1)      [r, g, b] = [c, x, 0];
  else if (hp < 2) [r, g, b] = [x, c, 0];
  else if (hp < 3) [r, g, b] = [0, c, x];
  else if (hp < 4) [r, g, b] = [0, x, c];
  else if (hp < 5) [r, g, b] = [x, 0, c];
  else             [r, g, b] = [c, 0, x];
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
const rgbStr = c => `${c[0]},${c[1]},${c[2]}`;
const rgbCss = c => `rgb(${c[0]},${c[1]},${c[2]})`;

function currentHue(){
  const turns = (Date.now() - MOOD.epoch) / MOOD.period;
  return (((MOOD.startHue + turns * 360) % 360) + 360) % 360;
}

// Saturation adoucie sur la plage jaune-vert (autour de 90°), où des teintes
// saturées virent à l'olive ou à l'anis sur fond sombre : ×0,55 au centre,
// retour progressif à la normale vers l'orange et le cyan.
function moodSat(h){
  const d = Math.min(Math.abs(h - 90), 360 - Math.abs(h - 90));
  const bump = d < 90 ? 0.5 + 0.5 * Math.cos(Math.PI * d / 90) : 0;
  return MOOD.sat * (1 - 0.45 * bump);
}

function applyMood(){
  moodHue = currentHue();
  const h = moodHue, s = moodSat(h);
  const accent  = hslToRgb(h, Math.min(1, s + 0.05), 0.62); // textes, prix, liserés, voiles
  const accent2 = hslToRgb(h, s, 0.40);                     // halos, orbes
  const dim     = hslToRgb(h, Math.max(0, s - 0.15), 0.18); // visuel produit
  const bg0     = hslToRgb(h, Math.max(0, s - 0.10), 0.045);// haut du fond
  const bg1     = hslToRgb(h, s, 0.13);                     // bas du fond
  const sale    = hslToRgb(h, Math.min(0.6, s + 0.15), 0.74); // tag promo, champs à compléter
  const neutral = hslToRgb(h, 0.16, 0.80);                  // marque et horloge
  const root = document.documentElement.style;
  root.setProperty('--blue', rgbCss(accent));
  root.setProperty('--blue-soft', rgbCss(accent2));
  root.setProperty('--blue-dim', rgbCss(dim));
  root.setProperty('--accent-rgb', rgbStr(accent));
  root.setProperty('--accent2-rgb', rgbStr(accent2));
  root.setProperty('--sale', rgbCss(sale));
  root.setProperty('--sale-rgb', rgbStr(sale));
  root.setProperty('--tint-neutral', rgbCss(neutral));
  document.body.style.background = rgbCss(bg0);
  BG0 = rgbCss(bg0); BG1 = rgbCss(bg1);
  GLOW_RGB = rgbStr(accent2);
  GLOW_VIVID = rgbCss(hslToRgb(h, Math.min(0.85, s + 0.35), 0.55)); // halo du ruban : même teinte, plus vive
  colorRibbon(accent);
}
