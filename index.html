/* ---------------- fond : ruban XMB ----------------
   Le ruban du XMB est une nappe de soie : un faisceau de brins fins et
   translucides qui suivent une même « colonne vertébrale » ondulante, se
   resserrent en plis lumineux puis s'évasent. Ici : une spine (somme de
   sinus lents), une enveloppe de pli, et une dizaine de brins tracés en
   additif sur un calque hors écran, recopié sur le canvas net et sur le
   canvas flouté qui fait le halo. */
const canvas = document.getElementById('waveCanvas');
const ctx = canvas.getContext('2d');
const canvasGlow = document.getElementById('waveCanvasGlow');
const ctxGlow = canvasGlow.getContext('2d');
const sparkleCanvas = document.getElementById('sparkleCanvas');
const sctx = sparkleCanvas.getContext('2d');
const waveLayer = document.createElement('canvas'); // calque hors écran du ruban
const wctx = waveLayer.getContext('2d');
const glowLayer = document.createElement('canvas'); // même ruban recoloré pour le halo
const glctx = glowLayer.getContext('2d');
let W,H;
let BG0 = '#04080c', BG1 = '#0d1f30', GLOW_RGB = '60,110,140', GLOW_VIVID = 'rgb(90,168,194)';
let sparklesReady = false;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = canvasGlow.width = sparkleCanvas.width = waveLayer.width = glowLayer.width = W;
  canvas.height = canvasGlow.height = sparkleCanvas.height = waveLayer.height = glowLayer.height = H;
  if (sparklesReady) seedSparkles(); // le nombre de particules dépend de la largeur
}
resize();
window.addEventListener('resize', resize);

let t = 0;

const TAU = Math.PI * 2;
const WAVE = {
  y: 0.55,      // hauteur moyenne du ruban (fraction de la hauteur d'écran)
  step: 4,      // largeur d'une tranche de rendu (px)
  // colonne vertébrale : une grande houle (0,8 longueur d'onde par écran)
  // plus deux ondulations plus courtes. amp en fraction de H, cycles par
  // largeur d'écran, speed en rad/image.
  // Amplitudes modérées (le ruban varie peu de haut en bas), mouvement lent.
  spine: [
    { amp: 0.075, cycles: 0.8, speed:  0.00105, phase: 0.6 },
    { amp: 0.030, cycles: 1.9, speed: -0.0017,  phase: 2.1 },
    { amp: 0.012, cycles: 3.7, speed:  0.0026,  phase: 4.0 },
  ],
};
// Voiles, comme sur le fond d'écran PS3 : chaque voile est une bande entre un
// bord haut (spine + off + a·sin) et un bord bas (bord haut + épaisseur, que le
// vrillage « twist » resserre puis relâche). off/a/thick en fraction de H,
// c/tc en cycles par écran, s/ts en rad/image, alpha = corps, edge = liseré.
const SHEETS = [
  { off:-0.06, a:0.028, c:1.3, s: 0.00145, p:0.3, thick:0.11, twist:0.70, tc:0.9, ts:0.00115, tp:1.0, alpha:0.14, edge:0.55 },
  { off:-0.02, a:0.022, c:1.7, s:-0.00185, p:1.9, thick:0.14, twist:0.60, tc:1.2, ts:0.00155, tp:2.6, alpha:0.11, edge:0.50 },
  { off: 0.01, a:0.032, c:1.1, s: 0.00125, p:3.4, thick:0.09, twist:0.75, tc:0.7, ts:0.00095, tp:0.2, alpha:0.16, edge:0.65 },
  { off: 0.04, a:0.024, c:2.1, s:-0.00205, p:5.0, thick:0.12, twist:0.65, tc:1.5, ts:0.00135, tp:3.9, alpha:0.10, edge:0.45 },
  { off: 0.07, a:0.019, c:1.5, s: 0.00165, p:0.9, thick:0.10, twist:0.70, tc:1.0, ts:0.00175, tp:5.1, alpha:0.12, edge:0.55 },
  { off:-0.09, a:0.016, c:2.4, s: 0.00225, p:2.7, thick:0.07, twist:0.80, tc:1.8, ts:0.00145, tp:1.7, alpha:0.09, edge:0.40 },
];
let sheetStrip = null;          // dégradé vertical d'un voile (canvas 2×256)
let edgeRgb = '255,255,255';    // couleur des liserés

// Couleur des voiles = couleur d'accent du moment, éclaircie : corps vif,
// liserés plus clairs. Profil de haut en bas : liseré lumineux puis corps
// translucide qui s'estompe. Recalculé à chaque mise à jour de l'ambiance.
function colorRibbon(rgb){
  const [r, g, b] = rgb;
  const mix = (v, k) => Math.round(v + (255 - v) * k);
  const body = `${mix(r,0.4)},${mix(g,0.4)},${mix(b,0.4)}`;
  edgeRgb = `${mix(r,0.68)},${mix(g,0.68)},${mix(b,0.68)}`;
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const x = c.getContext('2d');
  const grad = x.createLinearGradient(0, 0, 0, 256);
  [[0,0],[0.03,1],[0.12,0.55],[0.55,0.35],[0.9,0.15],[1,0]]
    .forEach(([o, a]) => grad.addColorStop(o, `rgba(${body},${a})`));
  x.fillStyle = grad;
  x.fillRect(0, 0, 2, 256);
  sheetStrip = c;
}

// Hauteur de la spine à l'abscisse x (utilisée aussi par les particules).
function spineY(x){
  let y = H * WAVE.y;
  for (const c of WAVE.spine) y += H * c.amp * Math.sin(x * TAU * c.cycles / W + t * c.speed + c.phase);
  return y;
}

function paintRibbon(){
  wctx.clearRect(0, 0, W, H);
  wctx.globalCompositeOperation = 'lighter';
  wctx.lineCap = 'round';
  wctx.lineJoin = 'round';
  const step = WAVE.step;
  const n = Math.ceil(W / step) + 3;
  const sp = new Float32Array(n);
  for (let i = 0; i < n; i++) sp[i] = spineY((i - 1) * step);
  const top = new Float32Array(n), bot = new Float32Array(n);
  for (const sh of SHEETS){
    for (let i = 0; i < n; i++){
      const x = (i - 1) * step;
      const yT = sp[i] + H * (sh.off + sh.a * Math.sin(x * TAU * sh.c / W + t * sh.s + sh.p));
      const u = 0.5 + 0.5 * Math.sin(x * TAU * sh.tc / W + t * sh.ts + sh.tp);
      top[i] = yT;
      bot[i] = yT + H * sh.thick * (1 - sh.twist + sh.twist * u);
    }
    // corps : une tranche de dégradé par colonne, étirée entre les deux bords.
    // Tranches jointives sans lissage : un chevauchement ou un bord adouci
    // ferait des rayures verticales en mode additif.
    wctx.globalAlpha = sh.alpha;
    wctx.imageSmoothingEnabled = false;
    for (let i = 0; i < n; i++){
      wctx.drawImage(sheetStrip, (i - 1) * step, top[i], step, bot[i] - top[i]);
    }
    wctx.imageSmoothingEnabled = true;
    // liserés : bord haut net et lumineux, bord bas plus discret
    wctx.globalAlpha = 1;
    wctx.beginPath();
    for (let i = 0; i < n; i++){ const x = (i - 1) * step; if (i === 0) wctx.moveTo(x, top[i]); else wctx.lineTo(x, top[i]); }
    wctx.lineWidth = 1.3;
    wctx.strokeStyle = `rgba(${edgeRgb},${sh.edge})`;
    wctx.stroke();
    wctx.beginPath();
    for (let i = 0; i < n; i++){ const x = (i - 1) * step; if (i === 0) wctx.moveTo(x, bot[i]); else wctx.lineTo(x, bot[i]); }
    wctx.lineWidth = 1;
    wctx.strokeStyle = `rgba(${edgeRgb},${sh.edge * 0.4})`;
    wctx.stroke();
  }
  wctx.globalAlpha = 1;
}

function paintBackground(context){
  const grad = context.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, BG0);
  grad.addColorStop(0.55, BG0);
  grad.addColorStop(1, BG1);
  context.fillStyle = grad;
  context.fillRect(0, 0, W, H);
  // lueur d'horizon en bas d'écran, comme le halo du XMB
  const glow = context.createRadialGradient(W*0.55, H*1.15, 0, W*0.55, H*1.15, W*0.75);
  glow.addColorStop(0, `rgba(${GLOW_RGB},0.28)`);
  glow.addColorStop(1, `rgba(${GLOW_RGB},0)`);
  context.fillStyle = glow;
  context.fillRect(0, 0, W, H);
}

function paintWaves(){
  paintRibbon();
  // canvas net
  paintBackground(ctx);
  ctx.drawImage(waveLayer, 0, 0);
  // halo : le même ruban recoloré (source-in garde sa transparence) dans une
  // version vive de la couleur d'ambiance, puis flouté par le CSS du canvas
  glctx.globalCompositeOperation = 'source-over';
  glctx.clearRect(0, 0, W, H);
  glctx.drawImage(waveLayer, 0, 0);
  glctx.globalCompositeOperation = 'source-in';
  glctx.fillStyle = GLOW_VIVID;
  glctx.fillRect(0, 0, W, H);
  paintBackground(ctxGlow);
  ctxGlow.globalCompositeOperation = 'lighter';
  ctxGlow.drawImage(glowLayer, 0, 0);
  ctxGlow.globalAlpha = 0.7;
  ctxGlow.drawImage(glowLayer, 0, 0);
  ctxGlow.globalAlpha = 1;
  ctxGlow.globalCompositeOperation = 'source-over';
}

/* ---------------- scintillement ----------------
   Poussières lumineuses autour du ruban, comme sur le XMB : elles naissent
   près de la spine, montent doucement en suivant son ondulation, pulsent
   lentement sans jamais s'éteindre tout à fait, et s'estompent en fin de
   vie avant de renaître ailleurs. Volontairement discret. */
const SPARKLE = {
  perPx: 1/12,              // ~160 particules à 1920 px
  spread: 140,              // dispersion verticale de départ autour du ruban (px)
  minSize: 0.5,
  maxSize: 1.7,
  glowShare: 0.2,           // part des particules dotées d'un halo
  rise: [60, 150],          // hauteur totale gravie pendant une vie (px)
  drift: 0.12,              // dérive horizontale max (px / image)
  twinkle: [0.010, 0.028],  // pulsation (rad / image) : un cycle toutes les 4 à 10 s
  base: 0.18,               // luminosité plancher entre deux éclats
  ttl: [900, 1800],         // durée de vie (images) : 15 à 30 s
};

function makeSprite(size, stops){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);
  return c;
}
const spriteCore = makeSprite(16, [[0,'rgba(255,255,255,1)'], [0.45,'rgba(255,255,255,0.55)'], [1,'rgba(255,255,255,0)']]);
const spriteGlow = makeSprite(64, [[0,'rgba(255,255,255,0.7)'], [0.3,'rgba(255,255,255,0.18)'], [1,'rgba(255,255,255,0)']]);

let sparkles = [];
function newSparkle(){
  const ttl = SPARKLE.ttl[0] + Math.random() * (SPARKLE.ttl[1] - SPARKLE.ttl[0]);
  const rise = SPARKLE.rise[0] + Math.random() * (SPARKLE.rise[1] - SPARKLE.rise[0]);
  return {
    x: Math.random() * W,
    dy: SPARKLE.spread * Math.pow(Math.random(), 1.3) - 15, // près du ruban, un peu en dessous
    vx: (Math.random() - 0.5) * 2 * SPARKLE.drift,
    vy: -rise / ttl,                                        // ascension lente
    size: SPARKLE.minSize + Math.pow(Math.random(), 2) * (SPARKLE.maxSize - SPARKLE.minSize),
    glow: Math.random() < SPARKLE.glowShare,
    phase: Math.random() * Math.PI * 2,
    twinkle: SPARKLE.twinkle[0] + Math.random() * (SPARKLE.twinkle[1] - SPARKLE.twinkle[0]),
    life: 0,
    ttl,
  };
}
function seedSparkles(){
  sparkles = Array.from({ length: Math.round(W * SPARKLE.perPx) }, newSparkle);
  // vies déjà entamées au chargement : pas de fondu d'entrée général
  sparkles.forEach(s => { s.life = Math.random() * s.ttl; s.dy += s.vy * s.life; });
}
sparklesReady = true;
seedSparkles();

function drawSparkles(){
  sctx.clearRect(0, 0, W, H);
  sctx.globalCompositeOperation = 'lighter';
  for (const s of sparkles){
    s.x += s.vx;
    s.dy += s.vy;
    s.life += 1;
    if (s.life > s.ttl || s.x < -20 || s.x > W + 20) Object.assign(s, newSparkle());
    const y = spineY(s.x) + s.dy;
    const tw = 0.5 + 0.5 * Math.sin(s.phase + t * s.twinkle);
    const fade = Math.min(1, s.life / 120, (s.ttl - s.life) / 120);
    const alpha = fade * (SPARKLE.base + (1 - SPARKLE.base) * tw * tw);
    if (alpha < 0.02) continue;
    const d = s.size * 2 + 2;
    sctx.globalAlpha = alpha;
    sctx.drawImage(spriteCore, s.x - d/2, y - d/2, d, d);
    if (s.glow){
      const g = s.size * 10 + 10;
      sctx.globalAlpha = alpha * 0.35;
      sctx.drawImage(spriteGlow, s.x - g/2, y - g/2, g, g);
    }
  }
  sctx.globalAlpha = 1;
  sctx.globalCompositeOperation = 'source-over';
}

function drawFrame(){
  paintWaves();
  drawSparkles();
  t += 1;
  requestAnimationFrame(drawFrame);
}

applyMood();          // avant la première image : palette, voiles et halo
setInterval(applyMood, MOOD.refreshMs);
buildLegal();
withCatalogue(() => applyLanguage('en')); // produits enregistrés, puis menu (build) et libellés
drawFrame();

/* ---------------- écran de démarrage ----------------
   Séquence calquée sur l'allumage de la PS3 : le ruban ondule sur un fond
   assombri, le logo se révèle posé dessus à droite du centre, tient
   STARTUP.hold ms, puis le voile sombre et le logo s'effacent pendant que
   l'interface (déjà construite, invisible jusque-là) apparaît en fondu. */
const STARTUP = { hold: 4000, fade: 1600 }; // hold = fondu d'entrée du logo (0,9 s) + logo plein
function runStartup(){
  const layer = document.getElementById('startup');
  const tint = document.getElementById('startupTint');
  const logo = document.getElementById('startupLogo');
  const mark = document.getElementById('startupMark');
  // en pourcentages : la position suit un éventuel redimensionnement pendant
  // le démarrage. Emblème au centre, logo FS3 à sa droite, tous deux posés
  // sur le ruban comme le logo PS et le mot PS3 sur la console.
  // Même ligne pour les deux (hauteur du ruban à mi-chemin), sinon la pente
  // du ruban les décale l'un par rapport à l'autre.
  const lineY = ((spineY(W * 0.66) / H) * 100 + 3) + '%';
  mark.style.top = lineY;       // sa position horizontale est calée sur le logo en CSS
  logo.style.left = '75%';
  logo.style.top = lineY;
  const images = [logo, ...mark.querySelectorAll('img')];

  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    requestAnimationFrame(() => layer.classList.add('show'));
    setTimeout(() => {
      document.body.classList.add('boot-fade');
      document.body.classList.remove('booting');
      layer.classList.add('fade');
      tint.classList.add('fade');
      setTimeout(() => {
        layer.remove();
        tint.remove();
        document.body.classList.remove('boot-fade');
        startupActive = false;
      }, STARTUP.fade);
    }, STARTUP.hold);
  };
  // on attend les images (préchargées), sans jamais bloquer plus de 1,2 s
  const ready = () => images.every(i => i.complete);
  if (ready()) start();
  else {
    images.forEach(i => {
      i.addEventListener('load', () => { if (ready()) start(); }, { once:true });
      i.addEventListener('error', () => { if (ready()) start(); }, { once:true });
    });
    setTimeout(start, 1200);
  }
}
// L'allumage se joue à chaque chargement de cette page (les futures pages
// annexes, fichiers séparés, n'embarquent pas cette séquence).
runStartup();
</script>
