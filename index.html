    for (let P = 0; P < nV*2; P++){
      const l = Math.hypot(acc[P*3], acc[P*3+1], acc[P*3+2]) || 1, backFace = P >= nV;
      const nx = (backFace ? -acc[P*3] : acc[P*3]) / l, ny = acc[P*3+1] / l, nz = (backFace ? -acc[P*3+2] : acc[P*3+2]) / l;
      const d = Math.max(nx*LIGHT[0] + ny*LIGHT[1] + nz*LIGHT[2], 0), rim = Math.pow(1 - Math.max(nz, 0), 3);
      data[P*STRIDE+5] = 0.74 + 0.32*d; data[P*STRIDE+6] = rim*0.08;
    }
    // données CPU ; chaque contexte crée ses tampons GPU à la demande (makeRenderer → bufs)
    return { data, index: new Uint16Array(front.concat(backI)), nFront: front.length, nBack: backI.length, tris: (front.length + backI.length) / 3, verts: nV };
  }

  // ---- photos, textures étendues (canvas) et maillages en cache (clé : chemin de la photo) ----
  const images = new Map(), meshes = new Map(), altSrc = new Map();
  const maskArea = m => { let n = 0; for (let i = 0; i < m.length; i++) n += m[i]; return n; };
  const mirrorMask = m => { const N = MASK_N, o = new Uint8Array(N*N); for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) o[y*N+x] = m[y*N+(N-1-x)]; return o; };
  function loadImage(url){
    if (images.has(url)) return images.get(url).promise;
    const img = new Image(), entry = { img, mask:null, canvas:null, blobURL:null };
    // revalidation forcée : une photo remplacée sous le même nom est retéléchargée
    // (réponse 304 sinon), donc redétourée et son modèle régénéré au chargement suivant
    entry.promise = fetch(url, { cache:'no-cache' })
      .then(r => { if (!r.ok) throw new Error(url + ' : ' + r.status); return r.blob(); })
      .then(blob => new Promise((res, rej) => { entry.blobURL = URL.createObjectURL(blob); img.onload = () => res(); img.onerror = rej; img.src = entry.blobURL; }))
      .then(() => {
        entry.mask = silhouette(img); // silhouette : sert au maillage (photo de face) et à l'extension de texture
        entry.canvas = extendTexture(img, entry.mask, entry.mask); // source de texture, envoyée à chaque contexte
        return entry;
      });
    images.set(url, entry);
    return entry.promise;
  }

  // ---- 4. rendu et interaction ----
  //      La fiche : balancement continu, survol et toucher pilotent l'angle.
  //      La liste : chaque ligne ouverte est dessinée dans le canvas de la
  //      barre, à une position que le module anime lui-même, avec la courbe et
  //      la durée des transitions CSS des lignes (voir setRows). Aucune mesure
  //      du DOM pendant l'animation : lire la position ou l'opacité d'un
  //      élément en cours de transition oblige le navigateur à rapatrier
  //      l'animation sur le fil principal (Firefox), ce qui hachait le
  //      défilement. Les lignes d'une colonne qui se referme s'effacent sur place.
  let current = null, active = false, raf = 0, last = 0, token = 0;
  let angle = 0, hover = false, target = 0, tap = 0, rowAngle = 0, rows = [], fading = [], listDrawn = false;
  let backFrom = 0, backT = 0;
  const BACK_MS = 1400; // durée du retour au balancement quand la souris quitte le visuel
  let frames = 0, fpsT = 0, fps = 0; // images par seconde (contrôle : model3d.debug().fps)
  const shortest = d => Math.atan2(Math.sin(d), Math.cos(d)); // écart angulaire le plus court
  const dprCap = () => Math.min(2, window.devicePixelRatio || 1);
  let swatchW = 0;
  function resize(){
    if (!swatchW) swatchW = swatch.clientWidth; // mesuré au premier affichage et à chaque redimensionnement
    const s = Math.max(64, Math.round(swatchW * dprCap()));
    if (canvas.width !== s){ canvas.width = s; canvas.height = s; }
  }
  let listW = 0, listH = 0, listK = 1; // taille du canvas de la barre en pixels CSS, et pixels de canvas par pixel CSS
  function resizeList(){ // mesuré au démarrage et au redimensionnement seulement
    const dpr = dprCap();
    listW = listCanvas.clientWidth; listH = listCanvas.clientHeight;
    const w = Math.round(listW * dpr), h = Math.round(listH * dpr);
    if (w && h && (listCanvas.width !== w || listCanvas.height !== h)){ listCanvas.width = w; listCanvas.height = h; }
    listK = listW ? listCanvas.width / listW : 1;
  }
  // maillage + textures d'un produit, en cache ; une photo de dos mal détourée
  // (tissu trop proche du fond, ex. raglan blanc sur blanc) emprunte la
  // silhouette de face en miroir pour l'extension de texture et le calage
  const assets = new Map(), ready = new Map();
  const keyOf = item => encodeURI(item.img) + '|' + encodeURI(item.img2 || item.img);
  function prepare(item){
    const key = keyOf(item);
    if (assets.has(key)) return assets.get(key);
    const front = encodeURI(item.img), back = encodeURI(item.img2 || item.img);
    const p = Promise.all([loadImage(front), loadImage(back)]).then(([f, b]) => {
      let bMask = back === front ? null : b.mask, texB = b.canvas;
      if (bMask && maskArea(bMask) < 0.7 * maskArea(f.mask)){
        bMask = mirrorMask(f.mask);
        const k2 = back + '|miroir:' + front;
        if (!altSrc.has(k2)) altSrc.set(k2, extendTexture(b.img, bMask, b.mask));
        texB = altSrc.get(k2);
      }
      let mesh = meshes.get(key);
      if (!mesh){ mesh = buildMesh(f.mask, bMask); meshes.set(key, mesh); }
      const a = mesh ? { mesh, texF: f.canvas, texB } : null;
      ready.set(key, a);
      if (list) list.warm(a); // la ligne s'affiche dès que possible, sans à-coup
      return a;
    }).catch(() => { ready.set(key, null); return null; });
    assets.set(key, p); return p;
  }
  let debugSide = ''; // contrôle : ne dessiner qu'une face ('front' | 'back' | '')
  function draw(){ panel.clear(); if (current) panel.render(current, angle, PV, 1, null, debugSide); }

  // courbes des transitions CSS des lignes, résolues par bissection
  const bezier = (x1, y1, x2, y2) => {
    const at = (a, b, t) => { const u = 1 - t; return 3*u*u*t*a + 3*u*t*t*b + t*t*t; };
    return x => { if (x <= 0) return 0; if (x >= 1) return 1;
      let lo = 0, hi = 1, t = x;
      for (let i = 0; i < 12; i++){ if (at(x1, x2, t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return at(y1, y2, t); };
  };
  const EASE_MOVE = bezier(0.2, 0.8, 0.2, 1), EASE_FADE = bezier(0.25, 0.1, 0.25, 1); // = .xmb-item : transform / opacity
  const states = new Map(); // état animé d'une ligne, par élément
  function sample(st, now){ // position, taille et opacité à cet instant
    const p = st.dur > 0 ? Math.min(1, (now - st.t0) / st.dur) : 1, m = EASE_MOVE(p), f = EASE_FADE(p), o = st.from, d = st.to;
    return { x: o.x + (d.x - o.x) * m, y: o.y + (d.y - o.y) * m, s: o.s + (d.s - o.s) * m, a: o.a + (d.a - o.a) * f };
  }
  function drawRows(now){
    list.clear();
    if (!listH) return;
    const all = fading.length ? rows.concat(fading) : rows;
    for (const st of all){
      const c = st.cur = sample(st, now);
      const a = ready.get(keyOf(st.item));
      if (!a || c.a < 0.01 || c.y + c.s < 0 || c.y > listH) continue; // hors écran ou pas encore prêt
      // rotation de sélection : trois tours et un quart de taille en plus,
      // autour du centre de la case (voir spin)
      let ang = rowAngle, ech = 1;
      if (st.spin){
        const u = (now - st.spin) / SPIN_MS;
        if (u >= 1) st.spin = 0;
        else {
          const e = 1 - Math.pow(1 - u, 3);        // départ vif, arrivée douce
          ang += e * Math.PI * 6;                  // 1 080 degrés
          ech = 1 + Math.sin(u * Math.PI) * 0.25;  // +25 % au passage
        }
      }
      const s2 = c.s * listK * ech, d2 = (s2 - c.s * listK) / 2;
      list.render(a, ang, PVrow, c.a, { x: c.x * listK - d2, y: c.y * listK - d2, s: s2 });
      listDrawn = true;
    }
    if (fading.length) fading = fading.filter(st => now - st.t0 < st.dur);
  }
  function frame(t){
    raf = 0;
    if (list && listDrawn && !rows.length && !fading.length){ list.clear(); listDrawn = false; } // plus rien en liste : on efface
    if ((!active && !rows.length && !fading.length) || document.hidden){ last = 0; return; }
    const dt = last ? Math.min(60, t - last) : 16; last = t;
    const ease = Math.min(1, dt / 110);
    const sway = reduced ? 0 : Math.sin(t / 3800 * Math.PI * 2) * SWAY; // balancement ±18° en 3,8 s, commun à la fiche et à la liste
    if (hover){ backT = 0; angle += shortest(target - angle) * ease; }
    else if (tap === 1){ backT = 0; angle += shortest(0 - angle) * ease; }
    else if (tap === 2){ backT = 0; angle += shortest(Math.PI - angle) * ease; }
    else {
      // Fin de survol ou de toucher : le modèle revient lentement à son
      // balancement, par un fondu entre l'angle quitté et le balancement du
      // moment. Un simple rattrapage progressif ne convenait pas : le
      // balancement étant lui-même mobile, le modèle l'aurait suivi en retard
      // et avec moins d'amplitude, pour toujours. Ici l'arrivée est exacte.
      if (!backT){ backFrom = angle; backT = t; }
      const p = Math.min(1, (t - backT) / BACK_MS);
      angle = p >= 1 ? sway : backFrom + shortest(sway - backFrom) * (p * p * (3 - 2 * p));
    }
    rowAngle = sway;
    if (list && (rows.length || fading.length)) drawRows(t);
    if (active) draw();
    frames++; if (t - fpsT >= 1000){ fps = Math.round(frames * 1000 / (t - fpsT)); frames = 0; fpsT = t; }
    raf = requestAnimationFrame(frame);
  }
  function show(item){
    active = true; canvas.hidden = false; resize();
    const my = ++token;
    current = null; tap = 0;
    prepare(item).then(a => { if (my === token){ panel.warm(a); current = a; } }); // une autre fiche a pu être affichée entre-temps
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function hide(){
    active = false; current = null; canvas.hidden = true;
    if (!rows.length && !fading.length && raf){ cancelAnimationFrame(raf); raf = 0; }
  }
  // Lignes de la liste ouverte, décrites par render() en pixels CSS dans le
  // repère de la barre : { el, item, x, y, size, alpha }. Chaque ligne rejoint
  // sa nouvelle cible en `dur` millisecondes, avec la courbe de sa transition
  // CSS, en partant de sa position courante (comme le fait le navigateur quand
  // une transition est interrompue). Les lignes qui disparaissent s'effacent
  // sur place, comme leur colonne.
  const FADE_MS = 300; // = .item-column, transition d'opacité
  /* Sélection d'une miniature : trois tours complets (1 080°) en grandissant
     d'un quart, puis retour à sa taille. L'animation est portée PAR LA LIGNE et
     non par le module : les autres miniatures continuent leur balancement
     pendant ce temps. Le grossissement s'applique autour du centre de la case,
     d'où le recentrage de x et y. */
  const SPIN_MS = 900;
  function spin(el){
    const st = states.get(el);
    if (!st) return;
    st.spin = performance.now();
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function setRows(next, dur){
    if (!list){ rows = []; return; }
    const now = performance.now(), keep = new Set(next.map(r => r.el));
    fading = fading.filter(st => !keep.has(st.el)); // une ligne qui revient repart à neuf
    for (const st of rows) if (!keep.has(st.el)){
      const c = sample(st, now);
      st.from = c; st.to = { x: c.x, y: c.y, s: c.s, a: 0 }; st.t0 = now; st.dur = FADE_MS;
      fading.push(st); states.delete(st.el);
    }
    rows = next.map(r => {
      const to = { x: r.x, y: r.y, s: r.size, a: r.alpha };
      let st = states.get(r.el);
      if (!st){ st = { el: r.el, item: r.item, from: { x: to.x, y: to.y, s: to.s, a: 0 }, to, t0: now, dur: FADE_MS, cur: null }; states.set(r.el, st); }
      else { st.item = r.item; st.from = sample(st, now); st.to = to; st.t0 = now; st.dur = dur; }
      return st;
    });
    rows.forEach(r => prepare(r.item));
    if (!raf && (rows.length || fading.length)) raf = requestAnimationFrame(frame);
  }
  /* Rotation à la souris, au mouvement et non à la position : poser le curseur
     sur le visuel ne change rien, c'est le déplacement qui fait tourner le
     modèle, à partir de l'angle où il se trouve. Auparavant l'angle était
     déduit de la position du curseur dans le cadre, si bien que le modèle
     sautait dès l'entrée et sursautait au moindre frémissement de la main.
     Parcourir toute la largeur du cadre fait un tour complet. Le cadre est
     mesuré à l'entrée, pas à chaque mouvement : une mesure pendant que la
     liste glisse relancerait un calcul de mise en page. */
  let swatchBox = null, lastX = null;
  swatch.addEventListener('mouseenter', (e) => { swatchBox = swatch.getBoundingClientRect(); lastX = e.clientX; });
  swatch.addEventListener('mousemove', (e) => {
    if (tap) return; // figé par un toucher (écran hybride) : la souris n'intervient pas
    if (!swatchBox) swatchBox = swatch.getBoundingClientRect();
    if (lastX === null){ lastX = e.clientX; return; } // premier repère : on ne tourne pas encore
    const dx = e.clientX - lastX;
    lastX = e.clientX;
    if (!dx) return;
    if (!hover){ hover = true; target = angle; } // on repart d'où le modèle est, sans à-coup
    target += dx / (swatchBox.width || 1) * Math.PI * 2;
  });
  swatch.addEventListener('mouseleave', () => { hover = false; swatchBox = null; lastX = null; });
  let downX = 0, downY = 0;
  swatch.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
  swatch.addEventListener('pointerup', (e) => { // toucher sans déplacement : face → dos → balancement (un balayage change de vue, voir le diaporama)
    if (e.pointerType === 'touch' && Math.hypot(e.clientX - downX, e.clientY - downY) < 10) tap = (tap + 1) % 3; });
  resizeList();
  window.addEventListener('resize', () => { swatchW = 0; resizeList(); if (active) resize(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && (active || rows.length) && !raf) raf = requestAnimationFrame(frame); });
  const debug = () => ({ active, ready: !!current, tris: current && current.mesh.tris, angle: Math.round(angle * 180 / Math.PI) % 360, hover, tap, canvas: canvas.width, meshes: meshes.size, images: images.size, rows: rows.length, fading: fading.length, list: !!list, fps });
  // contrôle : part de la photo reconnue comme vêtement (tests)
  const debugMask = url => loadImage(url).then(e => { const m = e.mask; let n = 0; for (let i = 0; i < m.length; i++) n += m[i]; return { url, coverage: Math.round(n / m.length * 1000) / 10 }; });
  const debugTexture = url => loadImage(url).then(e => e.canvas); // contrôle : texture étendue d'une photo
  const debugSnapshot = () => { draw(); return canvas.toDataURL('image/png'); }; // contrôle : image du rendu courant
  const debugAngle = a => { angle = a; draw(); }; // contrôle : rendu immédiat à un angle donné (radians)
  const debugOnly = side => { debugSide = side || ''; draw(); }; // contrôle : ne dessiner qu'une face ('front' | 'back' | '')
  const photoURL = url => loadImage(url).then(e => e.blobURL); // copie fraîche de la photo, pour les vues 2D du diaporama
  const debugRows = () => { // contrôle : boîte animée par le module vs boîte réelle de la ligne dans le DOM (pixels CSS)
    if (!list) return [];
    const now = performance.now();
    return rows.map(st => {
      const c = st.cur || sample(st, now), rc = st.el.getBoundingClientRect();
      const r2 = Math.round;
      return { ready: !!ready.get(keyOf(st.item)), alpha: Math.round(c.a * 100) / 100,
        box: { x: r2(c.x), y: r2(c.y), s: r2(c.s) },
        dom: { x: r2(rc.left + camShift), y: r2(rc.top), s: r2(rc.width) } }; // le canvas suit la barre : on retire son décalage
    });
  };

  /* ---- scène du mini-jeu (voir le module `arena`) ----
     Un contexte WebGL de plus, créé seulement à l'ouverture de l'arène. Il
     réutilise les maillages et les textures déjà calculés pour la fiche et la
     liste — le travail lourd, détourage et gonflement, n'est fait qu'une fois
     par photo — mais garde ses propres objets GPU, comme chaque contexte. */
  function makeScene(cv){
    const r = makeRenderer(cv, 512, true);
    if (!r) return null;
    return {
      load: item => prepare(item),            // maillage + textures, mis en cache
      ready: item => !!ready.get(keyOf(item)),
      clear: r.clear,
      // box = { x, y, s } en pixels du canvas ; tint = [r, v, b, force] ou null
      draw(item, ang, box, alpha, tint){
        const a = ready.get(keyOf(item));
        if (a) r.render(a, ang, PVrow, alpha == null ? 1 : alpha, box, '', tint);
      },
    };
  }
  return { show, hide, setRows, spin, rows3d: !!list, photoURL, makeScene, debug, debugMask, debugTexture, debugSnapshot, debugAngle, debugOnly, debugRows };
})();

/* ---------------- diaporama du visuel produit ----------------
   Vues : le modèle 3D, puis les photos 2D déjà chargées (face, dos). Points
   cliquables façon Instagram, flèches au survol, balayage au doigt. Sans
   WebGL, la vue 3D est retirée de la liste. Le rendu 3D ne tourne que sur
   sa vue. */
const slider = (() => {
  const swatch = document.getElementById('previewSwatch');
  const slides = [...swatch.querySelectorAll('.slide')];
  const dotsEl = document.getElementById('slideDots');
  let avail = [], index = 0, item = null;
  function setup(it){
    item = it; avail = []; index = 0;
    if (it && it.img){
      if (!swatch.classList.contains('no-gl')) avail.push(0);
      avail.push(1);
      if (it.img2 && it.img2 !== it.img) avail.push(2);
    }
    dotsEl.innerHTML = '';
    avail.forEach((s, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'dot';
      b.setAttribute('aria-label', s === 0 ? '3D' : `${T('photo')} ${s}`);
      b.addEventListener('click', (e) => { e.stopPropagation(); go(i); });
      b.style.setProperty('--i', i);   // décalage du reflet : les pastilles s'allument de gauche à droite
      b.addEventListener('mousedown', (e) => e.preventDefault()); // pas de focus clavier : Entrée ne rejouerait pas le clic
      dotsEl.appendChild(b);
    });
    swatch.classList.toggle('has-slides', avail.length > 1);
    apply();
  }
  function apply(){
    const cur = avail.length ? avail[index] : -1;
    slides.forEach(s => s.classList.toggle('active', Number(s.dataset.slide) === cur));
    [...dotsEl.children].forEach((d, i) => d.classList.toggle('active', i === index));
    if (cur === 0) model3d.show(item); else model3d.hide();
  }
  function go(i){ if (avail.length < 2) return; index = (i + avail.length) % avail.length; apply(); }
  document.getElementById('slidePrev').addEventListener('click', (e) => { e.stopPropagation(); go(index - 1); });
  document.getElementById('slideNext').addEventListener('click', (e) => { e.stopPropagation(); go(index + 1); });
  let sx = 0, sy = 0; // balayage horizontal au doigt
  swatch.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; });
  swatch.addEventListener('pointerup', (e) => {
    if (e.pointerType !== 'touch') return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(e.clientY - sy)) go(index + (dx < 0 ? 1 : -1));
  });
  // les flèches non plus ne gardent pas le focus après un clic (Entrée = mode panneau, pas « vue suivante »)
  ['slidePrev', 'slideNext'].forEach(id => document.getElementById(id).addEventListener('mousedown', (e) => e.preventDefault()));
  return { setup, go, next: () => go(index + 1), prev: () => go(index - 1), atFirst: () => index === 0, current: () => (avail.length ? avail[index] : -1), count: () => avail.length };
})();

const ROW_H = 96; // pas vertical d'une ligne à l'échelle 1 : aperçu 3D de 88 px (ITEM_CSS) + 8 px (voir .xmb-item.has-3d)

// Les lignes sont créées une seule fois par catégorie ; render() ne fait
// ensuite que déplacer/rescaler les mêmes éléments, ce qui laisse la
// transition CSS animer le passage d'un item à l'autre.
function build(){
  // on ne vide que les catégories : le canvas des aperçus 3D vit dans la barre (voir .rows-gl)
  categoriesEl.querySelectorAll('.category').forEach(el => el.remove());
  DATA.forEach((cat, ci) => {
    const wrap = document.createElement('div');
    wrap.className = 'category';
    wrap.dataset.index = ci;

    const iconUrl = encodeURI('icons/' + cat.icon);
    wrap.innerHTML = `
      <div class="cat-icon">
        <span class="cat-glow"><span class="cat-glow-inner" style="--icon:url('${iconUrl}')"></span></span>
        <img src="${iconUrl}" alt="">
      </div>
      <div class="cat-label">${L(cat.name)}</div>
      <div class="item-column" data-col="${ci}"></div>
    `;
    wrap.addEventListener('click', () => selectCategory(ci));

    const col = wrap.querySelector('.item-column');
    cat.items.forEach((item, ii) => {
      const row = document.createElement('div');
      row.className = 'xmb-item';
      if (cat.kind === 'shop' && item.img && model3d.rows3d){
        // aperçu 3D rotatif à la place du nom, comme les icônes verticales du XMB ; le nom
        // reste dans la fiche et en info-bulle. La ligne n'est qu'une boîte carrée vide : le
        // modèle est dessiné à sa position dans le canvas de la scène (model3d.setRows).
        row.classList.add('has-3d');
        row.title = L(item.n);
        if (item.was){ const t = document.createElement('span'); t.className = 'tag'; t.textContent = T('sale'); row.appendChild(t); }
      } else {
        row.innerHTML = esc(L(item.n)) + (item.was ? `<span class="tag">${T('sale')}</span>` : '');
      }
      row.addEventListener('click', (e)=>{
        e.stopPropagation();
        const moved = activeCat !== ci || activeItem !== ii;
        exitPanel(); activeCat=ci; activeItem=ii; render();
        if (moved) sfx.tick();
        ouvrirFiche(true);   // la miniature tourne sur elle-même et la fiche se déplie
      });
      col.appendChild(row);
    });
    categoriesEl.appendChild(wrap);
  });
  measureDescHeight();
  geom.ready = false; // la barre a changé : mesures à reprendre
  render();
}

// Les fiches produit gardent la même hauteur quel que soit le produit : on
// mesure le descriptif le plus long du catalogue à la largeur réelle du
// panneau (clone invisible #descProbe) et on réserve cette hauteur à tous.
const DESC_MAX_LINES = 6; // au-delà, le descriptif défile dans la fiche
/* Le descriptif est désormais un accordéon, replié par défaut : le visuel
   récupère toute sa hauteur (voir .preview-swatch, qui soustrait --desc-h). On
   mesure ici la hauteur qu'il PRENDRA une fois déplié — le descriptif le plus
   long du catalogue, plafonné à DESC_MAX_LINES, mesuré à la largeur réelle du
   panneau — pour que toutes les fiches s'ouvrent de la même hauteur et que la
   fiche ne change pas de taille d'un produit à l'autre. */
let descMax = 0, descOuvert = false;
function measureDescHeight(){
  const probe = document.getElementById('descProbe');
  const cap = parseFloat(getComputedStyle(probe).lineHeight) * DESC_MAX_LINES;
  let max = 0;
  DATA.forEach(cat => {
    if (cat.kind !== 'shop') return;
    cat.items.forEach(item => {
      probe.textContent = L(item.d);
      max = Math.max(max, probe.offsetHeight);
    });
  });
  probe.textContent = '';
  descMax = max ? Math.min(max, cap) : 0;
  appliquerDesc();
}
function appliquerDesc(){
  if (!descOuvert){
    previewEl.classList.remove('desc-open');
    previewEl.style.setProperty('--desc-h', '0px');
    previewEl.style.setProperty('--squeeze', '0px');
    descToggle.setAttribute('aria-expanded', 'false');
    return;
  }
  /* La fiche est centrée : l'ouvrir de N pixels descend son bas de N/2. Si ce
     bas devait passer sous la barre d'aide, on reprend le manque sur le visuel
     (--squeeze) plutôt que de laisser le texte déborder de l'écran. La mesure
     se fait AVANT d'appliquer la hauteur : sinon on lirait une fiche déjà en
     train de s'ouvrir, et le calcul partirait d'un état intermédiaire. */
  previewEl.style.setProperty('--desc-h', '0px');
  previewEl.style.setProperty('--squeeze', '0px');
  const r = previewEl.getBoundingClientRect();
  const barre = document.querySelector('.hintbar').getBoundingClientRect().top;
  const besoin = descMax + 14;
  const libre = Math.max(0, (barre - r.bottom - 10) * 2);
  previewEl.style.setProperty('--squeeze', Math.max(0, besoin - libre) + 'px');
  previewEl.style.setProperty('--desc-h', descMax + 'px');
  previewEl.classList.add('desc-open');
  descToggle.setAttribute('aria-expanded', 'true');
}
const descToggle = document.getElementById('descToggle');
descToggle.addEventListener('click', (e) => {
  e.stopPropagation();
  descOuvert = !descOuvert;
  appliquerDesc();
  majInfoH();          // le bloc doit grandir d'autant, sinon le texte reste coupé
  sfx.tick();
});
descToggle.addEventListener('mousedown', (e) => e.preventDefault()); // pas de focus : Entrée reste « mode panneau »
window.addEventListener('resize', measureDescHeight);

// Aide clavier : complète sur la barre (flèches et Entrée, dont le libellé
// suit la catégorie) ; en mode panneau, elle décrit les touches du panneau.
function updateHints(){
  const cat = DATA[activeCat];
  const bar = document.getElementById('hintbar');
  const show = (name, on, text) => {
    const s = bar.querySelector(`[data-hint="${name}"]`);
    s.hidden = !on;
    if (text !== undefined) s.querySelector('[data-label]').textContent = text;
  };
  if (panelMode && cat.kind === 'shop' && productPart){ // fiche produit : parties (visuel, boutons)
    show('browse', true, productPart === 'visual' ? T('hintViews') : T('hintChoose')); show('select', true, T('hintSection'));
    show('enter', true, productPart === 'visual' ? T('hintView') : productPart === 'info' ? T('hintInfo') : T('hintSize'));
    show('info', false); show('back', true, T('hintBack'));
  } else if (panelMode && cat.kind === 'shop'){ // sélecteur de tailles ouvert
    show('browse', true, T('hintSize')); show('select', false);
    show('enter', true, T('hintAdd')); show('info', false); show('back', true, T('hintBack'));
  } else if (panelMode && cat.kind === 'settings'){
    show('browse', true, T('hintChoose')); show('select', true, T('hintSection'));
    show('enter', true, T('hintApply')); show('info', false); show('back', true, T('hintBack'));
  } else if (panelMode){
    show('browse', false); show('select', true, T('hintScroll'));
    show('enter', false); show('info', false); show('back', true, T('hintBack'));
  } else {
    show('browse', true, T('hintBrowse')); show('select', true, T('hintSelect'));
    show('enter', true, cat.kind === 'shop' ? T('hintAdd') : cat.kind === 'contact' ? T('hintInstagram') : cat.kind === 'game' ? T('hintPlay') : T('hintOpen'));
    show('info', cat.kind === 'shop', T('hintInfo'));
    show('back', false);
  }
}

/* ---------------- fiche « More info » (guide des tailles) ----------------
   Ouverte par le bouton du panneau produit ou la touche I ; tableau des
   mesures du guide du produit, en centimètres et en pouces. */
const infoOverlay = document.getElementById('infoOverlay');
function openInfo(){
  const cat = DATA[activeCat];
  const item = cat.items[activeItem];
  if (cat.kind !== 'shop' || !item || !item.sz) return;
  const chart = SIZE_CHARTS[item.sz];
  // centimètres en premier, pouces en petit et en gris dessous
  const cm = v => Math.round(chart.unit === 'cm' ? v : v * 2.54);
  const inch = v => (chart.unit === 'in' ? v : v / 2.54).toFixed(1);
  // seules les tailles réellement en vente sont montrées (voir sizesFor) ;
  // si aucune ne figure au guide, on affiche le guide entier plutôt que rien
  const shown = sizesFor(item);
  let keep = chart.sizes.map((s, i) => shown.indexOf(s) >= 0 ? i : -1).filter(i => i >= 0);
  if (!keep.length) keep = chart.sizes.map((_, i) => i);
  document.getElementById('infoTitle').textContent = L(item.n);
  document.getElementById('infoSub').textContent = T('sizeGuide');
  document.getElementById('infoBody').innerHTML = `
    <table class="size-table">
      <thead><tr><th></th>${keep.map(i => `<th>${esc(chart.sizes[i])}</th>`).join('')}</tr></thead>
      <tbody>${chart.rows.map(r => `<tr><td>${esc(L(r.label))}</td>${keep.map(i =>
        `<td>${cm(r.values[i])} cm<span class="alt">${inch(r.values[i])} in</span></td>`).join('')}</tr>`).join('')}</tbody>
    </table>
    <p class="info-note">${esc(T('sizeNote'))}</p>`;
  infoOverlay.classList.add('open');
  document.getElementById('infoClose').focus();
}
function closeInfo(){ infoOverlay.classList.remove('open'); }
document.getElementById('infoBtn').addEventListener('click', openInfo);
// (le visuel produit est piloté par le bloc « aperçu 3D », plus haut)
document.getElementById('infoClose').addEventListener('click', closeInfo);
infoOverlay.addEventListener('click', (e) => { if (e.target === infoOverlay) closeInfo(); });

/* ---------------- mode panneau ----------------
   Entrée « entre » dans le panneau, sans autre effet. Réglages : les flèches
   naviguent entre pastilles, Entrée applique. Shipping Info : ↑/↓ font
   défiler le texte. Fiche produit : ↑/↓ passent du visuel aux boutons ; sur
   le visuel, → (et Entrée) passe à la vue suivante en boucle (3D / face /
   dos), ← à la précédente, seul moyen clavier d'en changer ; sur les
   boutons, ←/→ vont de « Ajouter au panier » à « Plus d'infos », Entrée
   ouvre le sélecteur de tailles (puis Entrée ajoute) ou la fiche. Échap, ←
   sur la vue 3D ou ← sur « Ajouter » reviennent à la barre. */
let panelMode = false;
let panelGroup = 0, panelIndex = 0;
let productPart = null; // fiche produit : partie en surbrillance, 'visual' | 'add' | 'info' | null (sélecteur de tailles ouvert)
function setProductPart(part){
  productPart = part;
  document.getElementById('previewSwatch').classList.toggle('focus', part === 'visual');
  addBtn.classList.toggle('focus', part === 'add');
  document.getElementById('infoBtn').classList.toggle('focus', part === 'info');
}

function panelGroups(){ return [...document.querySelectorAll('#previewSettings .pills')]; }

function enterPanel(){
  const cat = DATA[activeCat];
  if (cat.kind !== 'shop' && cat.kind !== 'settings' && cat.kind !== 'info') return;
  panelMode = true;
  previewEl.classList.add('focused');
  if (cat.kind === 'shop') setProductPart('add'); // fiche produit : on entre sur « Ajouter au panier », rien n'est ajouté
  if (cat.kind === 'settings'){
    panelGroup = 0;
    const pills = [...panelGroups()[0].children];
    panelIndex = Math.max(0, pills.findIndex(p => p.classList.contains('active')));
    updatePanelFocus();
  }
  updateHints();
}
function exitPanel(){
  if (!panelMode) return;
  panelMode = false;
  previewEl.classList.remove('focused');
  document.querySelectorAll('.pill.focus').forEach(p => p.classList.remove('focus'));
  closeSizePicker();
  setProductPart(null);
  updateHints();
}
function updatePanelFocus(){
  document.querySelectorAll('.pill.focus').forEach(p => p.classList.remove('focus'));
  const g = panelGroups()[panelGroup];
  if (!g) return;
  const pills = [...g.children];
  panelIndex = Math.max(0, Math.min(panelIndex, pills.length - 1));
  if (pills[panelIndex]) pills[panelIndex].classList.add('focus');
}
function panelKey(e){
  const cat = DATA[activeCat];
  if (e.key === 'Escape'){ exitPanel(); return; }
  if (cat.kind === 'settings'){
    const groups = panelGroups();
    if (e.key === 'ArrowRight'){ panelIndex += 1; updatePanelFocus(); }
    if (e.key === 'ArrowLeft'){
      if (panelIndex <= 0){ exitPanel(); return; } // ← sur la pastille la plus à gauche : retour à la barre
      panelIndex -= 1; updatePanelFocus();
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      panelGroup = Math.max(0, Math.min(groups.length - 1, panelGroup + (e.key === 'ArrowDown' ? 1 : -1)));
      const pills = [...groups[panelGroup].children];
      panelIndex = Math.max(0, pills.findIndex(p => p.classList.contains('active')));
      updatePanelFocus();
    }
    if (e.key === 'Enter'){
      const pill = groups[panelGroup] && groups[panelGroup].children[panelIndex];
      if (pill) pill.click(); // applique ; le panneau est reconstruit et la surbrillance réappliquée
    }
  } else if (cat.kind === 'shop'){
    if (sizePicker.classList.contains('open') && sizePills.querySelector('.pill.focus')){
      // sélecteur de tailles ouvert au clavier : ←/→ choisissent, Entrée ajoute,
      // ← sur la première taille ou ↑ referme et revient sur « Ajouter au panier »
      if (e.key === 'ArrowRight'){ sizeIndex += 1; updateSizeFocus(); }
      if (e.key === 'ArrowLeft' && sizeIndex > 0){ sizeIndex -= 1; updateSizeFocus(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ closeSizePicker(); setProductPart('add'); updateHints(); }
      if (e.key === 'Enter'){
        e.preventDefault(); // sinon un bouton qui aurait le focus (clic précédent) recevrait aussi son clic natif : double ajout
        addToBag(currentSizes[sizeIndex]);
      }
      return;
    }
    // parties de la fiche : visuel (haut), puis « Ajouter au panier » et « Plus d'infos » (bas)
    const hasInfo = !document.getElementById('infoBtn').hidden;
    if (productPart === 'visual' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
      e.preventDefault(); // visuel sélectionné : → vue suivante (en boucle), ← vue précédente, et sur la première vue (3D) retour aux icônes
      if (e.key === 'ArrowRight') slider.next();
      else if (slider.atFirst()) exitPanel();
      else slider.prev();
      return;
    }
    if (e.key === 'ArrowUp') setProductPart('visual');
    if (e.key === 'ArrowDown' && productPart === 'visual') setProductPart('add');
    if (e.key === 'ArrowRight' && productPart === 'add' && hasInfo) setProductPart('info');
    if (e.key === 'ArrowLeft'){
      if (productPart === 'info') setProductPart('add');
      else { exitPanel(); return; } // ← sur le visuel ou « Ajouter » : retour à la barre
    }
    if (e.key === 'Enter'){
      e.preventDefault();
      if (productPart === 'visual') slider.next();       // vue suivante (3D → face → dos)
      else if (productPart === 'info') openInfo();
      else openSizePicker(true);                         // l'ajout passe toujours par une taille
    }
    updateHints();
  } else if (cat.kind === 'info'){
    const desc = document.getElementById('previewDesc');
    if (e.key === 'ArrowLeft'){ exitPanel(); return; } // ← : retour à la barre
    if (e.key === 'ArrowDown'){ e.preventDefault(); desc.scrollBy({ top: 48, behavior: 'smooth' }); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); desc.scrollBy({ top: -48, behavior: 'smooth' }); }
  }
}

// Défilement rapide (molette, touche maintenue) : quand deux pas se suivent à
// moins de 300 ms, la colonne reçoit la classe fast (glissements de 0,18 s au
// lieu de 0,45 s) pour que la liste suive le rythme au lieu de traîner derrière
// chaque pas ; vitesse normale 350 ms après le dernier pas.
let lastStep = { cat: -1, item: -1, at: 0 }, fastTimer = 0;
function noteStep(col){
  const now = performance.now();
  const step = lastStep.cat === activeCat && lastStep.item !== activeItem;
  const rapid = step && now - lastStep.at < 300;
  lastStep = { cat: activeCat, item: activeItem, at: step ? now : 0 };
  col.classList.toggle('fast', rapid);
  clearTimeout(fastTimer);
  if (rapid) fastTimer = setTimeout(() => col.classList.remove('fast'), 350);
  return rapid;
}

/* Mesures de la barre, prises une fois par mise en page (démarrage, changement
   de langue, redimensionnement) puis relues depuis ce cache. Auparavant
   render() lisait offsetTop/offsetWidth juste après avoir écrit des styles, ce
   qui forçait le navigateur à recalculer la mise en page à chaque ligne et à
   chaque pas de défilement. Les positions des icônes ne dépendent pas des
   transformations (qui, elles, sont animées), donc ce cache reste juste. */
const geom = { ready: false, cats: [], previewLeft: 0, previewW: 0,
               previewCat: -1, activeColLeft: 0, activeColW: 0, extra: 0 };
function measureGeometry(){
  geom.cats = [...categoriesEl.querySelectorAll('.category')].map(el => {
    const col = el.querySelector('.item-column');
    const ico = el.querySelector('.cat-icon'); // boîte de l'icône, pour la lueur de bord
    return { left: el.offsetLeft, top: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight, colTop: col.offsetTop,
             icoL: ico.offsetLeft, icoT: ico.offsetTop, icoW: ico.offsetWidth, icoH: ico.offsetHeight };
  });
  measurePreviewBox();
  geom.ready = true;
}
function measurePreviewBox(){ // largeur/position du panneau : dépend de la fenêtre et du type de catégorie
  const r = previewEl.getBoundingClientRect();
  geom.previewLeft = r.left; geom.previewW = r.width; geom.previewCat = activeCat;
}
let geomRaf = 0;
window.addEventListener('resize', () => { // une seule reprise par image pendant un redimensionnement
  geom.ready = false;
  if (!geomRaf) geomRaf = requestAnimationFrame(() => { geomRaf = 0; render(); });
});
// la largeur des lignes texte (repli sans WebGL) change quand la police arrive
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  categoriesEl.querySelectorAll('.xmb-item').forEach(r => { delete r._w; });
  geom.ready = false; render();
});

function render(){
  const cats = [...categoriesEl.querySelectorAll('.category')];
  if (!geom.ready || geom.cats.length !== cats.length) measureGeometry();
  let activeColW = 0, rowBoxes = [], rowDur = 450;
  cats.forEach((el, ci) => {
    const g = geom.cats[ci];
    el.classList.toggle('active', ci === activeCat);
    const col = el.querySelector('.item-column');
    col.classList.toggle('open', ci === activeCat);
    const rows = Array.from(col.children);
    // sélection bornée à la liste (garde-fou si activeItem dépasse)
    const sel = ci === activeCat ? Math.min(activeItem, Math.max(0, rows.length - 1)) : 0;

    // Glissement XMB : la ligne sélectionnée reste juste sous l'icône, les
    // suivantes s'empilent dessous en rapetissant ; celles qui la précèdent
    // enjambent le bloc icône + libellé et se rangent au-dessus de la barre,
    // comme sur la PS3. Taille et luminosité décroissent avec la distance.
    const aboveGap = g.colTop + 12;
    if (ci === activeCat) rowDur = noteStep(col) ? 180 : 450; // défilement rapide : glissements raccourcis
    // Visibilité (demandes du 15 sept. 2026) : taille décroissante avec la distance
    // (1 → 0,89 → 0,78 → 0,68 mini) ; pleine opacité jusqu'à 3 lignes de la sélection,
    // puis fondu — 5 lignes visibles en dessous (4e à 67 %, 5e à 33 %, 6e éteinte),
    // 3 au-dessus (la 4e est éteinte). Une ligne éteinte garde sa place : elle
    // s'éteint ou se rallume en glissant, par la transition.
    const FULL = 3, LAST_BELOW = 5, LAST_ABOVE = 3;
    const scaleFor = dist => dist === 0 ? 1 : Math.max(0.68, 1 - dist * 0.11);
    const fade = (dist, below) => dist <= FULL ? 1 : Math.max(0, 1 - (dist - FULL) / ((below ? LAST_BELOW : LAST_ABOVE) - FULL + 1));
    // 1) état de chaque ligne ; largeur connue d'avance (aperçu 3D) ou mesurée une seule fois
    const place = rows.map((row, ii) => {
      const dist = Math.abs(ii - sel), has3d = row.classList.contains('has-3d');
      row.classList.toggle('selected', ii === sel);
      row.style.opacity = fade(dist, ii > sel);
      if (!has3d && row._w === undefined) row._w = row.offsetWidth;
      return { row, has3d, s: scaleFor(dist), op: fade(dist, ii > sel), w: has3d ? ITEM_CSS : row._w, ty: 0 };
    });
    let maxW = 0, y = 0;
    place.forEach(p => { maxW = Math.max(maxW, p.w); });
    // 2) placement : la sélection à 0, la suite en dessous, le reste au-dessus de l'icône
    for (let ii = sel; ii < place.length; ii++){
      const p = place[ii];
      const nudge = ii === sel && !p.has3d ? 4 : 0; // lignes texte : la sélection avance de 4 px ; aperçus 3D : centrés
      p.ty = y;
      p.row.style.transform = `translate(${nudge}px, ${y}px) scale(${p.s})`;
      y += ROW_H * p.s;
    }
    y = -aboveGap;
    for (let ii = sel - 1; ii >= 0; ii--){
      const p = place[ii];
      y -= ROW_H * p.s;
      p.ty = y;
      p.row.style.transform = `translate(0px, ${y}px) scale(${p.s})`;
    }
    const left = Math.round((g.w - maxW) / 2); // colonne centrée sous l'icône
    col.style.width = maxW + 'px';
    col.style.height = ROW_H + 'px';
    col.style.left = left + 'px';
    if (ci === activeCat){
      activeColW = rows.length ? maxW : 0;
      geom.activeColLeft = left; geom.activeColW = activeColW;
      // Boîtes des aperçus 3D, dans le repère de la barre : le canvas y vit,
      // donc le déplacement horizontal de la barre s'y applique tout seul.
      if (DATA[ci].kind === 'shop') rowBoxes = place.map((p, ii) => p.has3d
        ? { el: p.row, item: DATA[ci].items[ii], x: g.left + left, y: g.top + g.colTop + p.ty, size: ITEM_CSS * p.s, alpha: p.op }
        : null).filter(Boolean);
    }
  });

  // Place réclamée par la colonne ouverte : les catégories suivantes sont
  // décalées par transform (composité, fluide) et non par une marge animée,
  // qui relançait la mise en page à chaque image.
  const extra = activeColW ? Math.max(24, activeColW - 16) : 24;
  geom.extra = extra; // repris par updateEdgeGlow, qui refait le même calcul de position
  cats.forEach((el, ci) => {
    el.style.transform = `translateX(${ci > activeCat ? extra : 0}px) scale(${ci === activeCat ? 1 : 0.82})`;
  });

  model3d.setRows(rowBoxes, rowDur); // aperçus 3D de la catégorie ouverte (animés par le module)
  updatePreview();
  updateHints();
  scrollActiveIntoView();
}

// Keep the active category anchored near the left padding as the user
// moves right, so later icons (and open item lists) never drift under
// the fixed preview panel on the right — mirrors the real XMB's
// horizontally-scrolling icon strip. Computed purely from offsetLeft/
// offsetWidth (transform-independent) so it's correct in a single pass,
// rather than reading getBoundingClientRect() right after changing a
// CSS-transitioned transform (which returns a stale pre-animation value).
function scrollActiveIntoView(){
  const cats = geom.cats;
  if (!cats.length) return;
  const activeEl = cats[activeCat];
  const leftAnchor = cats[0].left;

  // .categories always starts at viewport x=0 (fixed .stage, full width,
  // single child), so offsetLeft values are already viewport-relative
  // in the untransformed coordinate space. Work out where the active
  // icon (and its open item list, if any) currently sits on screen
  // under the existing camera shift.
  const activeLeft = activeEl.left - camShift;
  let activeExtentRight = activeLeft + activeEl.w;
  if (geom.activeColW){
    activeExtentRight = Math.max(activeExtentRight, activeLeft + geom.activeColLeft + geom.activeColW); // colonne centrée
  }

  if (geom.previewCat !== activeCat) measurePreviewBox(); // la largeur du panneau dépend du type de catégorie
  const buffer = 32;
  const maxRight = geom.previewW > 0 ? geom.previewLeft - buffer : window.innerWidth;

  let shift = camShift;
  if (activeExtentRight > maxRight){
    // Selection (or its open item list) would sit under/behind the
    // preview panel — nudge the strip left just enough to clear it.
    shift += activeExtentRight - maxRight;
  } else if (activeLeft < leftAnchor){
    // Selection moved back into a region already scrolled past — ease
    // the strip back right, but never past its resting position. This
    // keeps earlier icons on screen instead of snapping the whole strip
    // back to the far left every time, so nothing "disappears".
    shift -= leftAnchor - activeLeft;
  }

  // Jamais au point de cacher l'icône précédente : au moins sa moitié reste
  // visible, donc cliquable, et le retour vers la gauche est toujours
  // possible à la souris comme au clavier (pas de softlock).
  const prevEl = cats[activeCat - 1];
  const maxShift = prevEl ? prevEl.left + prevEl.w / 2 - 16 : 0;
  camShift = Math.max(0, Math.min(shift, maxShift));
  categoriesEl.style.transform = `translateX(-${camShift}px)`;
  updateEdgeGlow();
}

/* Lueur de bord (voir .preview::after) : une icône qui passe derrière la fiche
   disparaît entièrement, et on perd le fil du menu. Son éclat traverse donc le
   verre : une lueur s'allume sur l'arête gauche, à sa hauteur, et d'autant plus
   vive qu'elle est enfoncée.

   Tout se calcule à partir des positions au repos (geom) en refaisant les mêmes
   transformations que render() vient d'appliquer, jamais en relisant le DOM :
   juste après avoir posé un transform animé, le navigateur rend encore
   l'ancienne position, et une lecture par image ramènerait les recalculs de
   mise en page qu'on a passé la soirée à retirer. La lueur reçoit donc son état
   d'arrivée, et la transition CSS — la même que celle de la barre — l'y emmène
   en même temps que les icônes. */
function updateEdgeGlow(){
  const eteint = () => previewEl.style.setProperty('--edge-a', '0');
  if (!geom.cats.length || !previewEl.classList.contains('show')) return eteint();
  /* La fiche est mesurée ici, et pas reprise du cache de render() : elle ne se
     déplace ni ne s'anime en position (seule son opacité change, cf .swap),
     mais sa HAUTEUR dépend de son contenu, et une mesure prise pendant qu'elle
     était encore vide — au chargement, avant que le catalogue n'arrive —
     placerait la lueur à côté pour le reste de la session. Une lecture par pas
     de navigation ne coûte rien ; ce sont les lectures par image qu'il faut
     éviter. */
  const p = previewEl.getBoundingClientRect();
  if (!p.width) return eteint();
  const bord = previewEl.clientTop;   // le repère d'un enfant absolu part du bord INTÉRIEUR du verre
  const panHaut = p.top, panBas = p.bottom;
  let force = 0, haut = 0, bas = 0;
  geom.cats.forEach((g, ci) => {
    const s = ci === activeCat ? 1 : 0.82;                  // .category : scale(0.82) hors sélection
    const tx = (ci > activeCat ? geom.extra : 0) - camShift;
    const cx = g.left + g.w / 2, cy = g.top + g.h / 2;      // l'échelle part du centre de la boîte (origine par défaut)
    const gauche = cx + (g.left + g.icoL - cx) * s + tx;
    const large = g.icoW * s;
    if (gauche >= p.right) return;                          // passée au-delà de la fiche : hors écran, pas cachée par elle
    const enfoncee = (gauche + large - p.left) / large;     // 0 : elle affleure le bord ; 1 : entièrement dessous
    if (enfoncee <= 0 || enfoncee <= force) return;
    // La boîte .category tient l'icône ET son libellé : son centre, autour
    // duquel joue l'échelle, est plus bas que celui de l'icône. D'où le calcul
    // complet plutôt qu'un simple g.top + g.icoH / 2.
    const h1 = cy + (g.top + g.icoT - cy) * s;
    const h2 = cy + (g.top + g.icoT + g.icoH - cy) * s;
    // La lueur épouse l'icône ENTIÈRE, elle n'est plus rognée à la hauteur du
    // panneau. Sur les panneaux courts (Contact, Réglages, Pièces uniques)
    // l'icône dépasse par le haut : garder seulement la portion commune
    // déplaçait le centre de la lueur de 16 px et elle ne semblait plus alignée.
    // Elle déborde donc un peu au-dessus du coin — ce qui, avec un dégradé
    // flouté qui s'éteint à ses deux bouts, se lit comme une lumière qui
    // contourne l'arête. On vérifie seulement que l'icône croise le panneau.
    if (h2 <= panHaut || h1 >= panBas) return;
    force = Math.min(1, enfoncee); haut = h1; bas = h2;
  });
  if (!force) return eteint();
  previewEl.style.setProperty('--edge-top', Math.round(haut - p.top - bord) + 'px');
  previewEl.style.setProperty('--edge-h', Math.round(bas - haut) + 'px');
  previewEl.style.setProperty('--edge-a', force.toFixed(3));
}

let lastPreviewCat = -1, previewSwapTimer = null;
// Changement de catégorie : le panneau perd son opacité, puis le nouveau
// contenu apparaît en la regagnant. Dans une même catégorie, mise à jour directe.
function updatePreview(){
  const catChanged = activeCat !== lastPreviewCat;
  const wasShown = previewEl.classList.contains('show');
  lastPreviewCat = activeCat;
  clearTimeout(previewSwapTimer);
  if (catChanged) closeSizePicker(); // le sélecteur de tailles ne vaut que pour la fiche affichée
  if (catChanged && wasShown){
    previewEl.classList.add('swap');
    previewSwapTimer = setTimeout(() => {
      fillPreview();
      previewEl.classList.remove('swap');
      measurePreviewBox();     // la largeur du panneau a pu changer avec le type de catégorie
      scrollActiveIntoView();
    }, 170);
    return;
  }
  previewEl.classList.remove('swap');
  fillPreview();
}


/* Deux états de la fiche. Au repos elle ne montre QUE la galerie ; choisir
   l'article — clic sur la miniature ou Entrée — la déplie sur le reste.
   Changer d'article la referme : sinon on resterait avec une fiche ouverte sur
   un produit qu'on n'a pas choisi.
   --info-h est la hauteur d'arrivée du bloc. Elle est calculée, et non relue à
   chaque ouverture : le descriptif est en cours de transition quand on toggle,
   et scrollHeight rendrait alors une hauteur intermédiaire. On mesure donc une
   fois, descriptif replié (infoBase), et on ajoute la hauteur connue du
   descriptif quand il est déplié. */
let ficheOuverte = false, dernierItem = null, infoBase = 0;
const previewInfo = document.getElementById('previewInfo');
function mesurerInfo(){
  // scrollHeight lit le contenu même sous un plafond : surtout ne pas lever
  // max-height pour mesurer, la transition suivante serait perdue (voir
  // mesurerTailles, même piège).
  infoBase = previewInfo.scrollHeight - (descOuvert && descMax ? descMax + 14 : 0);
  majInfoH();
}
function majInfoH(){
  previewEl.style.setProperty('--info-h', (infoBase + (descOuvert && descMax ? descMax + 14 : 0)) + 'px');
}
function appliquerFiche(){
  previewEl.classList.toggle('gallery', DATA[activeCat].kind === 'shop' && !ficheOuverte);
}
function ouvrirFiche(anim){
  if (DATA[activeCat].kind !== 'shop') return;
  if (anim){
    const cat = document.querySelectorAll('.category')[activeCat];
    const row = cat && cat.querySelector('.item-column').children[activeItem];
    if (row) model3d.spin(row);
  }
  if (ficheOuverte) return;
  ficheOuverte = true;
  appliquerFiche();
}
function fillPreview(){
  const cat = DATA[activeCat];
  const previewProduct = document.getElementById('previewProduct');
  const previewSettings = document.getElementById('previewSettings');

  // Contact, Réglages, Shipping Info : même gabarit, contenu centré
  previewEl.classList.toggle('info-panel', cat.kind !== 'shop');

  if (cat.kind === 'settings'){
    previewProduct.style.display = 'none';
    model3d.hide(); // pas de rendu 3D tant que le visuel produit n'est pas à l'écran
    previewSettings.classList.add('active');
    renderSettingsPanel();
    previewEl.classList.add('show');
    return;
  }
  previewProduct.style.display = 'block';
  previewSettings.classList.remove('active');

  // Contact et Shipping Info : pas de sous-menu ni de visuel produit, le
  // contenu vient de cat.panel et s'affiche dès que l'icône est active.
  const isInfo = cat.kind === 'contact' || cat.kind === 'info' || cat.kind === 'game'; // gabarits texte, sans visuel produit
  const item = isInfo ? cat.panel : cat.items[activeItem];
  if (!item){ previewEl.classList.remove('show'); return; }

  const swatchEl = document.querySelector('.preview-swatch');
  const descEl = document.getElementById('previewDesc');
  const priceEl = document.getElementById('previewPrice');
  previewEl.classList.toggle('info', isInfo);
  swatchEl.hidden = isInfo;
  // Versus : l'aperçu du jeu prend la place du visuel produit. Peint à l'image
  // suivante, quand la boîte a enfin une taille.
  const teaserEl = document.getElementById('arenaTeaser');
  teaserEl.hidden = cat.kind !== 'game';
  if (cat.kind === 'game') requestAnimationFrame(() => arena.apercu());
  if (isInfo) model3d.hide();
  // photo produit si le produit en a une (item.img), sinon l'initiale ;
  // seconde photo (item.img2) révélée au survol
  const photo = document.getElementById('previewPhoto');
  const photo2 = document.getElementById('previewPhoto2');
  const initial = document.getElementById('previewInitial');
  if (item.img){
    // vues 2D du diaporama : la même copie fraîche que le modèle 3D (revalidée au chargement)
    const front = encodeURI(item.img), back = encodeURI(item.img2 || item.img); // sans photo de dos : la même des deux côtés
    photo.dataset.for = front; photo2.dataset.for = back;
    model3d.photoURL(front).then(u => { if (photo.dataset.for === front) photo.src = u; }).catch(() => { photo.src = front; });
    model3d.photoURL(back).then(u => { if (photo2.dataset.for === back) photo2.src = u; }).catch(() => { photo2.src = back; });
    slider.setup(item); // vue 3D d'abord, puis les photos
  } else {
    slider.setup(null);
    photo.removeAttribute('src');
    photo2.removeAttribute('src');
  }
  initial.hidden = !!item.img; // l'initiale ne sert qu'aux produits sans photo
  initial.textContent = L(item.n)[0];
  document.getElementById('previewName').textContent = L(item.n);
  descEl.textContent = L(item.d);
  descEl.hidden = !item.d;
  // Le + n'a de sens que sur une fiche produit : les panneaux texte (Contact,
  // Livraison, Versus) affichent tout, sans repli.
  descToggle.hidden = isInfo || !item.d;
  // Changer d'article referme la fiche ET le descriptif : on revient toujours
  // à la galerie seule, état de repos.
  if (item !== dernierItem){ dernierItem = item; ficheOuverte = false; descOuvert = false; appliquerDesc(); }
  appliquerFiche();
  requestAnimationFrame(mesurerInfo);   // après la mise en page du nouveau contenu
  recalerLueur();                       // la hauteur du panneau vient de changer
  if (isInfo) previewEl.classList.remove('desc-open');

  const infoBtn = document.getElementById('infoBtn');
  infoBtn.hidden = true;
  if (cat.kind === 'contact'){
    priceEl.hidden = false;
    priceEl.textContent = 'instagram.com/fakeparadisetm';
    addBtn.hidden = false;
    addBtn.textContent = T('instagram');
  } else if (cat.kind === 'info' || cat.kind === 'game'){
    priceEl.hidden = true;
    addBtn.hidden = cat.kind !== 'game'; // Versus : seul le mini-jeu a un bouton, le reste tient dans le texte
    if (cat.kind === 'game') addBtn.textContent = T('play');
  } else {
    priceEl.hidden = false;
    priceEl.innerHTML = item.was
      ? `<span class="was">${formatPrice(item.was)}</span>${formatPrice(item.p)}`
      : formatPrice(item.p);
    addBtn.hidden = false;
    addBtn.textContent = T('add');
    // « More info » : guide des tailles, si le produit en a un
    infoBtn.hidden = !item.sz;
    infoBtn.textContent = T('moreInfo');
    // sélecteur ouvert au survol pendant un changement de produit (↑/↓, molette) : tailles du nouveau produit
    if (sizePicker.classList.contains('open')) buildSizePills(sizesFor(item));
  }
  previewEl.classList.add('show');
}

function selectCategory(ci){

  render();

function updateCartCount(){
  const n = cart.reduce((s, l) => s + l.qty, 0); // nombre d'articles, quantités comprises
  document.getElementById('cartCount').textContent = `${T('bag')} · ${n}`;
}

function renderCart(){
  const itemsEl = document.getElementById('cartItems');
  const totalEl = document.getElementById('cartTotal');
  itemsEl.innerHTML = '';

  if (!cart.length){
    itemsEl.innerHTML = `<div class="cart-empty">${T('cartEmpty')}</div>`;
  } else {
    cart.forEach((line, idx) => {
      const row = document.createElement('div');
      row.className = 'cart-row';
      // prix de la ligne (quantité comprise) ; le détail « 2 × €25 » en petit si qty > 1
      const detail = line.qty > 1 ? `<span class="cart-row-unit">${line.qty} × ${formatPrice(line.p)}</span>` : '';
      row.innerHTML = `
        <div>
          <div class="cart-row-name">${esc(L(line.n))}${line.size ? `<span class="cart-row-size">${esc(line.size)}</span>` : ''}</div>
          <div class="cart-row-price">${formatPrice(line.p * line.qty)}${detail}</div>
        </div>
        <div class="cart-row-actions">
          <span class="cart-qty">
            <button class="cart-qty-btn" data-idx="${idx}" data-delta="-1" aria-label="${esc(T('oneLess'))}">−</button>
            <span class="cart-qty-n">${line.qty}</span>
            <button class="cart-qty-btn" data-idx="${idx}" data-delta="1" aria-label="${esc(T('oneMore'))}">+</button>
          </span>
          <button class="cart-remove" data-idx="${idx}">${T('remove')}</button>
        </div>
      `;
      itemsEl.appendChild(row);
    });
  }

  itemsEl.querySelectorAll('.cart-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      cart.splice(Number(btn.dataset.idx), 1);
      updateCartCount();
      renderCart();
    });
  });
  // − / + : la quantité de la ligne ; à zéro, la ligne disparaît
  itemsEl.querySelectorAll('.cart-qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const line = cart[idx];
      if (!line) return;
      line.qty += Number(btn.dataset.delta);
      if (line.qty <= 0) cart.splice(idx, 1);
      updateCartCount();
      renderCart();
    });
  });

  const total = cart.reduce((s, l) => s + l.p * l.qty, 0);
  totalEl.textContent = formatPrice(total);
}

const cartOverlay = document.getElementById('cartOverlay');
document.getElementById('cartCount').addEventListener('click', ()=>{

  cartOverlay.classList.add('open');
});
document.getElementById('cartClose').addEventListener('click', ()=> cartOverlay.classList.remove('open'));

// Surligne tout ce qui est encore entre crochets : champs à compléter.

function legalText(s, field){

  return s[field];
}
