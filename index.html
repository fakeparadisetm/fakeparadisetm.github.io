/* ---------------- mini-jeu « Versus » (provisoire, 15 sept. 2026) ----------------
   Départager deux articles quand on hésite : on en choisit deux, ils se battent
   tout seuls, le sort désigne l'acheté. Aucune commande pendant le duel — c'est
   un tirage au sort mis en scène, pas un jeu.

   Le duel est ÉCRIT D'AVANCE, à l'ouverture (voir ecrireDuel) : on tire le
   vainqueur, puis des dégâts qui tombent juste à 100 pour le perdant. C'est ce
   qui permet de tenir les deux promesses à la fois — un vainqueur vraiment
   aléatoire, et un duel court et net de quatre ou cinq attaques chacun, terminé
   par un K.-O. plutôt que par une comparaison de barres. Le perdant ouvre donc
   le duel, pour que le dernier coup soit celui du vainqueur.

   Trois calques : le décor en parallaxe et les attaques au pinceau 2D, les deux
   vêtements dans un troisième contexte WebGL (model3d.makeScene), qui réutilise
   les maillages déjà calculés pour la fiche et la liste. */
const arena = (() => {
  const overlay = document.getElementById('arenaOverlay');
  const pickView = document.getElementById('arenaPick');
  const stage = document.getElementById('arenaStage');
  const grid = document.getElementById('arenaGrid');
  const shakeEl = document.getElementById('arenaShake');
  const bgC = document.getElementById('arenaBg'), glC = document.getElementById('arenaGL'), fxC = document.getElementById('arenaFx');
  const bg = bgC.getContext('2d'), fx = fxC.getContext('2d');
  const endBox = document.getElementById('arenaEnd'), endTitle = document.getElementById('arenaEndTitle');
  const turnLabel = document.getElementById('arenaTurn');
  const slots = [0, 1].map(i => document.getElementById('arenaSlot' + i));
  const nameEls = [0, 1].map(i => document.getElementById('arenaName' + i));
  const fillEls = [0, 1].map(i => document.getElementById('arenaFill' + i));
  const ghostEls = [0, 1].map(i => document.getElementById('arenaGhost' + i));
  const fightBtn = document.getElementById('arenaFight');

  let scene = null;            // contexte 3D de l'arène, créé au premier duel
  let ouvert = false, enDuel = false;
  let picks = [null, null], cartes = [], focus = 0, catalogue = [];
  let raf = 0, W = 0, H = 0, K = 1;          // W/H en pixels CSS, K = pixels de canvas par pixel CSS

  /* ---- catalogue : tous les articles en vente, toutes catégories confondues.
     Relu à chaque ouverture, puisque catalogue.json peut l'avoir changé. ---- */
  function listerArticles(){
    const out = [];
    DATA.forEach(cat => { if (cat.kind === 'shop') cat.items.forEach(it => out.push({ it, cat })); });
    return out;
  }

  /* ---- écran de choix ---- */
  /* Vignette en gros pixel : la photo est REDESSINÉE en 64 px de côté, avec
     lissage — c'est la réduction qui doit moyenner —, puis rendue à l'écran
     sans lissage. 64 px et non 36 : à 36 le vêtement n'était plus reconnaissable,
     et un aperçu de boutique doit d'abord se lire. Une photo simplement réduite
     en CSS, elle, reste lisse et trahit tout de suite le décor 16 bits. */
  function vignette(cv, src, n){
    cv.width = cv.height = n;
    const g = cv.getContext('2d');
    const img = new Image();
    img.onload = () => { g.clearRect(0, 0, n, n); g.drawImage(img, 0, 0, n, n); };
    const s = encodeURI(src || '');
    if (s) model3d.photoURL(s).then(u => { img.src = u; }).catch(() => { img.src = s; });
  }
  function construireGrille(){
    catalogue = listerArticles();
    grid.textContent = '';
    cartes = catalogue.map((e, i) => {
      const b = document.createElement('button');
      b.className = 'arena-card';
      b.type = 'button';
      const cv = document.createElement('canvas');
      vignette(cv, e.it.img, 64);
      const t = document.createElement('span');
      t.textContent = L(e.it.n);
      b.append(cv, t);
      b.addEventListener('click', () => { focus = i; choisir(i); });
      grid.appendChild(b);
      return b;
    });
    picks = [null, null];
    focus = 0;
    majChoix();
  }
  function choisir(i){
    const e = catalogue[i];
    const deja = picks.findIndex(p => p && p.i === i);
    if (deja >= 0){ picks[deja] = null; }                       // re-cliquer retire
    else if (!picks[0]) picks[0] = { i, it: e.it, cat: e.cat };
    else if (!picks[1]) picks[1] = { i, it: e.it, cat: e.cat };
    else { picks[0] = picks[1]; picks[1] = { i, it: e.it, cat: e.cat }; } // les deux pleins : le plus ancien cède
    sfx.tick();
    majChoix();
  }
  function majChoix(){
    slots.forEach((el, s) => {
      const p = picks[s];
      el.dataset.p = 'P' + (s + 1);
      el.classList.toggle('filled', !!p);
      el.textContent = '';
      if (!p){ el.textContent = T('arenaSlotEmpty'); return; }
      const cv = document.createElement('canvas');
      vignette(cv, p.it.img, 48);
      const b = document.createElement('b');
      b.textContent = L(p.it.n);
      el.append(cv, b);
    });
    cartes.forEach((c, i) => {
      const rang = picks.findIndex(p => p && p.i === i);
      c.classList.toggle('picked', rang >= 0);
      if (rang >= 0) c.dataset.p = 'P' + (rang + 1); else c.removeAttribute('data-p');
      c.classList.toggle('focus', i === focus);
    });
    fightBtn.disabled = !(picks[0] && picks[1]);
    // Les deux choisis : le bouton prend le focus, Entrée lance donc le duel.
    // Une flèche rend la main à la grille (voir bougerFocus).
    if (!fightBtn.disabled) fightBtn.focus();
  }
  function colonnes(){ // nombre de colonnes réellement posées par la grille CSS
    const n = getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length;
    return Math.max(1, n);
  }
  function bougerFocus(d){
    if (document.activeElement === fightBtn) fightBtn.blur();
    const n = cartes.length;
    if (!n) return;
    focus = Math.max(0, Math.min(n - 1, focus + d));
    majChoix();
    cartes[focus].scrollIntoView({ block: 'nearest' });
    sfx.tick(true);
  }

  /* ---- déroulé du duel ----
     Les dégâts ne sont PLUS écrits d'avance : chaque coup tire son nombre au
     moment où il touche, et les fourchettes montent d'un tour à l'autre. Ni le
     joueur ni le code ne savent qui gagne avant le dernier échange. Trois
     attaques chacun, six en tout : c'est ce qui tient le duel sous dix
     secondes. Si personne n'est à zéro au bout, celui qui a le moins de vie
     perd ; un coup qui descend à zéro arrête tout sur-le-champ. */
  const PH = { intro: 800, wind: 260, impact: 340, rest: 150 };
  const DEGATS = [[20, 40], [26, 50], [34, 62]]; // fourchettes par tour, croissantes
  const TOURS = 3;
  let plan = [], finMs = 0, vainqueur = -1, vie = [100, 100];

  function ecrireDuel(){
    const premier = Math.random() < 0.5 ? 0 : 1;
    plan = [];
    let t = PH.intro, precedente = -1;
    for (let i = 0; i < TOURS * 2; i++){
      const from = i % 2 === 0 ? premier : 1 - premier;
      let a = Math.floor(Math.random() * ATTAQUES.length);
      if (a === precedente) a = (a + 1 + Math.floor(Math.random() * (ATTAQUES.length - 1))) % ATTAQUES.length;
      precedente = a;
      const atk = ATTAQUES[a];
      const tir = t + PH.wind;
      plan.push({ from: from, to: 1 - from, atk: atk, tour: i >> 1, dmg: 0,
                  t0: t, tir: tir, choc: tir + atk.vol, fin: tir + atk.vol + PH.impact + PH.rest });
      t = plan[plan.length - 1].fin;
    }
    finMs = t;
    vie = [100, 100];
    vainqueur = -1;
  }

  /* ---- décors ----
     Trois scènes de jeu 16 bits, tirées au sort à chaque duel : une ruelle, une
     plage, un garage. Elles sont peintes dans un tampon de 320 px de large,
     agrandi SANS lissage — c'est ce qui donne le gros pixel d'époque, et ça ne
     coûte presque rien puisque la scène fait 320 px de large au lieu de 1200.
     La partie fixe n'est peinte qu'une fois par duel ; seuls les détails
     vivants (néons, vagues, lampadaire) sont repassés à chaque image. Le sol ne
     défile pas : personne ne se déplace, un sol qui glisse serait un mensonge.
     Aucune de ces couleurs ne vient de l'ambiance du site : seules la fenêtre et
     les barres de vie gardent la couleur d'accent. */
  const PXW = 320;                 // largeur du tampon : tout le décor est dessiné là-dedans
  const SOL = 0.82;                // ligne de sol, en fraction de la hauteur
  const TAILLE = 0.50;             // côté du carré de rendu d'un vêtement
  const FACE = 0.82;               // trois quarts : chacun tourné vers le centre (~47°). Plus bas,
                                   // la perspective courte de la scène écrase l'angle et ils
                                   // paraissent de face.
  let pxH = 180, pxFixe = null, pxBack = null, pxFront = null, decor = null;
  const R = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); };
  const bandes = (g, w, y0, liste) => liste.forEach(b => R(g, 0, y0 + b[0], w, b[1], b[2]));

  /* Éclair : une ligne brisée du haut vers le bas, autour du milieu. Sert à
     couper l'aperçu en deux et à montrer d'emblée que le décor change d'un
     duel à l'autre. Les écarts sont ÉCRITS, pas tirés au sort : l'aperçu est
     une image fixe, elle doit être la même à chaque fois qu'on revient sur la
     catégorie. */
  const ECARTS = [0, 0.055, -0.042, 0.061, -0.030, 0.048, -0.055, 0.026, -0.038, 0.030, 0];
  function pointsEclair(w, h){
    return ECARTS.map((e, i) => {
      const t = i / (ECARTS.length - 1);
      return { x: w * 0.5 + e * w + Math.sin(t * 7) * w * 0.03, y: t * h };
    });
  }
  function traitEclair(g, pts, ep, c){
    for (let i = 1; i < pts.length; i++){
      const a = pts[i - 1], b = pts[i], n = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y));
      for (let k = 0; k <= n; k++){
        const u = k / n;
        R(g, a.x + (b.x - a.x) * u - ep / 2, a.y + (b.y - a.y) * u, ep, 2, c);
      }
    }
  }
  /* Palmier en ombre chinoise : un tronc qui s'incline et s'affine, une
     couronne de palmes qui retombent, deux noix. Dessiné par une fonction pour
     pouvoir en semer plusieurs de tailles et de penchants différents — quatre
     palmiers identiques et symétriques faisaient décor de théâtre. */
  function palmier(g, x, solY, ht, pente, c){
    for (let i = 0; i < ht; i++){                      // tronc, incurvé
      const u = i / ht;
      const dx = pente * u * u * 14;
      R(g, x + dx, solY - i, Math.max(2, 4 - u * 2), 1, c);
      if (i % 9 === 4) R(g, x + dx - 1, solY - i, Math.max(3, 5 - u * 2), 1, '#000000');
    }
    const tx = x + pente * 14, ty = solY - ht;         // sommet
    for (let f = 0; f < 7; f++){
      const a0 = -2.6 + f * 0.62 + pente * 0.25;       // départ vers le haut, étalé
      const L = 15 + (f % 3) * 4;
      for (let k = 0; k < L; k++){
        const u = k / L;
        const a = a0 + u * u * 1.5 * (a0 < -1.3 ? -1 : 1);  // la palme retombe
        R(g, tx + Math.cos(a) * k * 1.2, ty + Math.sin(a) * k * 0.95 + u * u * 5, 2, 2, c);
      }
    }
    R(g, tx - 3, ty + 3, 3, 3, c); R(g, tx + 2, ty + 4, 3, 3, c);   // noix de coco
  }
  const DECORS = [
  { // RUELLE SOMBRE : deux murs qui se resserrent, un lampadaire, une benne
    nom: 'ruelle',
    fixe(g, w, h){
      const sol = h * SOL, mur = w * 0.21;          // mur du fond entre les deux murs latéraux
      R(g, 0, 0, w, h, '#0d0b12');
      bandes(g, w, 0, [[0, h * 0.09, '#161327'], [h * 0.09, h * 0.07, '#1d1830'], [h * 0.16, h * 0.06, '#241d38']]);
      R(g, w * 0.5 - 9, h * 0.05, 7, 7, '#cfd6e8');                  // lune
      // mur du fond : briques, fenêtres, quelques-unes allumées
      R(g, mur, h * 0.20, w - mur * 2, sol - h * 0.20, '#221c2a');
      for (let y = h * 0.23; y < sol - 6; y += 11) R(g, mur, y, w - mur * 2, 1, '#1a1522');
      for (let x = mur; x < w - mur; x += 14) R(g, x, h * 0.20, 1, sol - h * 0.20, '#1e1826');
      for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++){
        const x = mur + 6 + i * (w - mur * 2 - 12) / 6, y = h * 0.25 + j * h * 0.15;
        const on = (i * 3 + j) % 5 === 1;
        R(g, x, y, 11, 15, on ? '#f0c46a' : '#171223');
        if (on){ R(g, x + 1, y + 1, 9, 6, '#fce7b0'); R(g, x, y + 7, 11, 1, '#0f0c17'); }
        else R(g, x + 1, y + 1, 4, 6, '#211a2e');
      }
      R(g, w * 0.44, sol - 26, 16, 26, '#191426');                    // porte de service
      R(g, w * 0.44, sol - 26, 16, 2, '#2e2740');
      R(g, w * 0.57, sol - 4, 4, 4, '#2e2740');
      // murs latéraux, en fuite : bandes verticales de plus en plus sombres
      for (let i = 0; i < 7; i++){
        const t = i / 7, x = t * mur, lg = mur / 7 + 1;
        const c = ['#1a1524', '#181322', '#161120', '#140f1d', '#120e1a', '#100c17', '#0e0a14'][i];
        R(g, x, h * 0.20 * t, lg, h - h * 0.20 * t, c);
        R(g, w - x - lg, h * 0.20 * t, lg, h - h * 0.20 * t, c);
      }
      R(g, mur - 1, h * 0.20, 1, sol - h * 0.20, '#332a45');          // arêtes éclairées
      R(g, w - mur, h * 0.20, 1, sol - h * 0.20, '#332a45');
      for (let y = h * 0.16; y < sol - 10; y += h * 0.15){            // escalier de secours, à gauche
        R(g, 2, y, mur - 4, 2, '#2c2438');
        R(g, 2, y, 2, h * 0.15, '#2c2438');
        R(g, mur - 6, y, 2, h * 0.15, '#241d30');
      }
      R(g, w * 0.055, sol - 26, 36, 26, '#25402c');                   // benne
      R(g, w * 0.055, sol - 28, 36, 3, '#2f5236');
      R(g, w * 0.055, sol - 14, 36, 1, '#1b2f20');
      R(g, w * 0.16, sol - 9, 9, 9, '#1a1a22'); R(g, w * 0.19, sol - 7, 7, 7, '#1a1a22'); // sacs
      // Lampadaire : le mât, la lampe et le cône partent tous du MÊME axe. Les
      // trois étaient décalés, la lumière semblait tomber à côté de son support.
      const lampX = Math.round(w * 0.82), lampY = sol - h * 0.42;
      R(g, lampX - 1, lampY + 4, 3, h * 0.42, '#1c1828');            // mât
      R(g, lampX - 5, lampY, 11, 5, '#3a3350');                      // capot
      R(g, lampX - 4, lampY + 4, 9, 2, '#4a4368');
      // sol : bitume, trottoir au pied des murs, bouche d'égout
      R(g, 0, sol, w, h - sol, '#17161f');
      R(g, 0, sol, w, 2, '#262133');
      R(g, 0, sol + 4, mur * 0.8, 2, '#201c2b'); R(g, w - mur * 0.8, sol + 4, mur * 0.8, 2, '#201c2b');
      for (let i = 0; i < 40; i++) R(g, (i * 53) % w, sol + 5 + (i * 17) % Math.max(4, h - sol - 6), 1, 1, '#221f2c');
      R(g, w * 0.62, sol + 14, 14, 6, '#221e2d'); R(g, w * 0.625, sol + 15, 12, 4, '#191622'); // bouche d'égout
    },
    vif(g, w, h, t){
      const sol = h * SOL, lampX = Math.round(w * 0.82), lampY = sol - h * 0.42;
      const f = Math.sin(t / 90) > 0.6 ? 0.45 : 1;                    // le tube grésille
      R(g, lampX - 4, lampY + 4, 9, 2, 'rgba(255,214,130,' + f + ')');
      g.globalAlpha = 0.09 * f;                                       // cône, d'aplomb sous la lampe
      g.fillStyle = '#ffd68a';
      g.beginPath();
      g.moveTo(lampX, lampY + 6); g.lineTo(lampX - w * 0.20, sol + 2); g.lineTo(lampX + w * 0.20, sol + 2);
      g.closePath(); g.fill();
      g.globalAlpha = 0.16 * f; R(g, lampX - w * 0.15, sol, w * 0.30, 3, '#ffd68a'); // reflet au sol
      g.globalAlpha = 1;
    },
  },
  { // PLAGE MIAMI : coucher de soleil en bandes, palmiers, hôtels art déco
    nom: 'plage',
    fixe(g, w, h){
      const sol = h * SOL, mer = sol - h * 0.15;
      // Le ciel est posé en bandes franches, réparties sur la hauteur dispo :
      // en absolu, une fenêtre plus haute laissait une bande de vide entre le
      // dégradé et la mer.
      const CIEL = ['#2b1b4a', '#5a2a6a', '#8f3570', '#c8456b', '#e86a55', '#f79a4e', '#ffc86a'];
      R(g, 0, 0, w, mer, CIEL[0]);
      CIEL.forEach((c, i) => R(g, 0, Math.round(mer * i / CIEL.length), w, Math.ceil(mer / CIEL.length) + 1, c));
      const cx = w * 0.5, cy = mer - 2, rad = Math.min(30, mer * 0.42);
      for (let r = rad; r > 0; r--){                                  // soleil, strié comme il se doit
        const dy = cy - r;
        if (dy > mer) continue;
        const dx = Math.sqrt(rad * rad - r * r);
        R(g, cx - dx, dy, dx * 2, 1, (cy - dy) % 5 < 3 ? '#ffd88a' : '#ff9a5c');
      }
      for (let i = 0; i < 9; i++){                                    // front de mer art déco
        const bw = 12 + (i % 3) * 7, x = 8 + i * (w - 20) / 9, bh = 14 + (i % 4) * 6;
        R(g, x, mer - bh, bw, bh, i % 2 ? '#f0d4bc' : '#cfe6e0');
        R(g, x, mer - bh, bw, 2, '#ffffff');
        for (let k = 2; k < bh - 2; k += 5) R(g, x + 2, mer - bh + k, bw - 4, 2, '#8fb4c4');
      }
      R(g, 0, mer, w, sol - mer, '#2f6f8f');                          // mer
      for (let y = mer + 2; y < sol; y += 4) R(g, 0, y, w, 1, '#3f89a8');
      R(g, 0, sol, w, h - sol, '#e0c48c');                            // sable
      R(g, 0, sol, w, 2, '#f2dcae');
      for (let i = 0; i < 70; i++) R(g, (i * 47) % w, sol + 4 + (i * 13) % Math.max(4, h - sol - 4), 1, 1, '#c9a870');
      // Quatre palmiers, ni à la même place ni de la même taille : deux qui
      // encadrent, deux plus petits décalés vers l'intérieur, penchés chacun
      // à sa façon.
      [[0.055, 0.62, -0.9], [0.945, 0.55, 0.8], [0.21, 0.40, 0.5], [0.80, 0.34, -0.6]]
        .forEach(p => palmier(g, w * p[0], sol + 1, Math.min(84, sol * p[1]), p[2], '#1d1030'));
    },
    vif(g, w, h, t){
      const sol = h * SOL, mer = sol - h * 0.15; // même repère que fixe()
      for (let i = 0; i < 5; i++){                                   // clapot : des tirets qui glissent sur place
        const y = mer + 4 + i * 4;
        const off = Math.sin(t / 900 + i) * 8;
        for (let x = -12; x < w; x += 26) R(g, x + off + (i % 2) * 13, y, 9, 1, '#9fd8e8');
      }
    },
  },
  { // GARAGE AU NÉON : béton, rideau métallique, tubes qui clignotent
    nom: 'garage',
    fixe(g, w, h){
      const sol = h * SOL;
      R(g, 0, 0, w, h, '#26272d');
      R(g, 0, 0, w, h * 0.06, '#1b1c21');                             // poutre du plafond
      for (let x = 0; x < w; x += 40) R(g, x, h * 0.06, 1, sol - h * 0.06, '#2e2f36'); // joints
      for (let y = h * 0.12; y < sol; y += h * 0.19) R(g, 0, y, w, 1, '#2e2f36');
      R(g, w * 0.31, sol - h * 0.50, w * 0.38, h * 0.50, '#33353e');   // rideau métallique
      for (let y = sol - h * 0.49; y < sol; y += 5) R(g, w * 0.31, y, w * 0.38, 2, '#3c3e49');
      R(g, w * 0.31, sol - h * 0.52, w * 0.38, 4, '#1e1f25');
      R(g, w * 0.30, sol - h * 0.52, 2, h * 0.52, '#1e1f25');
      R(g, w * 0.68, sol - h * 0.52, 2, h * 0.52, '#1e1f25');
      R(g, w * 0.035, sol - h * 0.20, 44, h * 0.20, '#2b2d34');        // établi
      R(g, w * 0.035, sol - h * 0.21, 44, 3, '#4a4d58');
      R(g, w * 0.05, sol - h * 0.16, 12, 9, '#1f2127'); R(g, w * 0.12, sol - h * 0.16, 16, 9, '#1f2127');
      R(g, w * 0.03, sol - h * 0.42, 48, h * 0.16, '#212228');         // panneau à outils
      for (let i = 0; i < 6; i++){
        const x = w * 0.045 + i * 7;
        R(g, x, sol - h * 0.40, 3, h * 0.07, '#4a4d58');
        R(g, x - 1, sol - h * 0.40, 5, 3, '#5d616e');
      }
      for (let i = 0; i < 3; i++){                                     // pneus empilés
        R(g, w * 0.855, sol - 11 - i * 10, 32, 9, '#16171b');
        R(g, w * 0.875, sol - 9 - i * 10, 28, 5, '#212228');
      }
      for (let i = 0; i < 2; i++){                                     // bidons
        R(g, w * 0.76 + i * 13, sol - 24, 11, 24, '#3a3730');
        R(g, w * 0.76 + i * 13, sol - 24, 11, 3, '#585245');
        R(g, w * 0.76 + i * 13, sol - 16, 11, 2, '#2b2924');
      }
      R(g, w * 0.5 - 1, 0, 2, h * 0.10, '#1b1c21');                    // baladeuse
      R(g, w * 0.5 - 4, h * 0.10, 8, 5, '#c9ccd4');
      R(g, 0, sol, w, h - sol, '#34363d');                             // sol béton
      R(g, 0, sol, w, 2, '#44464f');
      R(g, 0, sol + h * 0.07, w, 3, '#c8a33a');                        // ligne peinte
      R(g, w * 0.60, sol + h * 0.11, 28, 5, '#2b2d33');                // tache d'huile
      R(g, w * 0.18, sol + h * 0.04, 16, 3, '#2b2d33');
    },
    vif(g, w, h, t){
      const sol = h * SOL;
      /* Halogènes ambrés, pas des néons de boîte : une lumière chaude, et le
         clignotement nerveux d'un tube fatigué — une suite de sinus déphasés
         qui, de temps en temps, tombent ensemble et font décrocher la lampe.
         Le hasard pur donnait un scintillement régulier, donc faux. */
      const rate = (a, b, c) => Math.sin(t / a) + Math.sin(t / b + 1.7) + Math.sin(t / c + 4.1);
      const f1 = rate(97, 211, 53) < -2.05 ? 0.15 : 0.92 + 0.08 * Math.sin(t / 61);
      // rampe du plafond
      R(g, 10, h * 0.075, w - 20, 3, 'rgba(255,220,150,' + f1 + ')');
      R(g, 10, h * 0.075 - 2, w - 20, 2, 'rgba(120,96,60,' + (0.5 + f1 * 0.3) + ')'); // le réflecteur
      [[7, 0.22], [16, 0.11], [30, 0.05]].forEach(b => {       // halo en trois paliers
        g.globalAlpha = b[1] * f1; R(g, 10, h * 0.075 + 3, w - 20, b[0], '#ffb43c');
      });
      g.globalAlpha = 1;
      R(g, w * 0.5 - 4, h * 0.10, 8, 5, f1 > 0.5 ? '#ffeccb' : '#8a7a5c'); // la suspension suit la rampe
    },
  },
  ];

  /* ---- attaques ----
     Cinq armes, tirées dans un ordre aléatoire et jamais deux fois de suite la
     même. Armes, projectiles et impacts sont peints dans le tampon de DEVANT,
     au même gros pixel que le décor : une arme lisse au milieu d'une scène
     16 bits jurerait. Chaque attaque a ses couleurs propres — la couleur
     d'ambiance du site ne sert plus qu'à la fenêtre et aux barres de vie.
     `main` dessine l'arme (s = +1 si le tireur regarde à droite), `trace` le
     projectile à l'avancement u, `choc` l'impact à l'avancement v. */
  const ATTAQUES = [
    { id: 'arc', vol: 480,
      main(g, x, y, s, u){
        for (let i = -8; i <= 8; i++){                       // le bois, cintré
          const b = Math.sqrt(Math.max(0, 64 - i * i)) * 0.5;
          R(g, x + s * b, y + i, 2, 1, '#8a5a2b');
        }
        const d = 2 + u * 5;                                 // corde tirée pendant l'armement
        for (let i = -8; i <= 8; i++) R(g, x - s * (d * (1 - Math.abs(i) / 9)), y + i, 1, 1, '#ded6c0');
        R(g, x - s * d, y - 1, 11, 2, '#cfc6ae');            // flèche encochée
        R(g, x + s * 5, y - 1, 3, 2, '#f4efe2');
      },
      trace(g, u, a, b){
        const x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u - Math.sin(u * Math.PI) * 22;
        const s = Math.sign(b.x - a.x);
        R(g, x - s * 7, y, 7, 1, '#8a5a2b');
        R(g, x, y - 1, 4, 2, '#cfc6ae');
        R(g, x + s * 3, y - 1, 2, 2, '#f4efe2');
      },
      choc(g, v, p){
        for (let i = 0; i < 8; i++){
          const a = i / 8 * 6.283 + v * 2, r = 2 + v * 16;
          R(g, p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, 2, 2, v < 0.5 ? '#f4efe2' : '#8a5a2b');
        }
      },
    },
    { id: 'pistolet', vol: 260,
      main(g, x, y, s, u){
        R(g, x - (s > 0 ? 0 : 12), y - 2, 13, 4, '#3c4048');  // canon
        R(g, x - (s > 0 ? 0 : 12), y - 2, 13, 1, '#6a7180');  // arête éclairée
        R(g, x - s * 2 - (s > 0 ? 0 : 3), y + 2, 4, 7, '#2a2d33'); // crosse
        if (u > 0.9){                                          // éclair de bouche
          R(g, x + s * 13, y - 3, 6, 6, '#ffe08a');
          R(g, x + s * 16, y - 1, 5, 2, '#fff7d0');
        }
      },
      trace(g, u, a, b){
        const x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u;
        const s = Math.sign(b.x - a.x);
        R(g, x - s * 14, y, 14, 1, '#ffb020');                 // traînée
        R(g, x, y - 1, 4, 2, '#fff7c0');
      },
      choc(g, v, p){
        R(g, p.x - 3, p.y - 3, 6, 6, v < 0.4 ? '#fff7c0' : '#ffb020');
        for (let i = 0; i < 6; i++){
          const a = i / 6 * 6.283, r = v * 18;
          R(g, p.x + Math.cos(a) * r, p.y + Math.sin(a) * r * 0.7, 1, 1, '#ffd86a');
        }
      },
    },
    { id: 'baton', vol: 560,
      main(g, x, y, s, u){
        R(g, x, y - 12, 2, 22, '#5a4430');                     // hampe
        R(g, x - 2, y - 16, 6, 6, '#a86bff');                  // gemme
        R(g, x - 1, y - 15, 2, 2, '#e0c4ff');
        if (u > 0.4){ g.globalAlpha = (u - 0.4) * 0.6; R(g, x - 6, y - 20, 14, 14, '#a86bff'); g.globalAlpha = 1; }
      },
      trace(g, u, a, b){
        for (let i = 0; i < 16; i++){
          const uu = Math.max(0, Math.min(1, u - (i % 6) * 0.045));
          const t = uu * uu * (3 - 2 * uu);                    // l'essaim se resserre en arrivant
          const ph = i * 1.9 + uu * 8, sp = (1 - uu) * 16 * (0.4 + (i % 4) / 4);
          R(g, a.x + (b.x - a.x) * t + Math.cos(ph) * sp * 0.5,
               a.y + (b.y - a.y) * t + Math.sin(ph) * sp, 2, 2, i % 3 ? '#a86bff' : '#e0c4ff');
        }
      },
      choc(g, v, p){
        for (let i = 0; i < 14; i++){
          const a = i / 14 * 6.283, r = v * 22;
          R(g, p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, 2, 2, v < 0.5 ? '#e0c4ff' : '#a86bff');
        }
      },
    },
    { id: 'canon', vol: 540,
      main(g, x, y, s, u){
        R(g, x - s * 6 - 5, y - 8, 11, 12, '#3a4450');         // bloc d'épaule
        R(g, x - s * 6 - 5, y - 8, 11, 2, '#68788c');
        R(g, x - (s > 0 ? 0 : 14), y - 3, 15, 6, '#2f3944');   // tube
        R(g, x - (s > 0 ? 0 : 14), y - 3, 15, 1, '#5d6c80');
        if (u > 0.35){                                          // charge qui enfle au bout
          const c = (u - 0.35) / 0.65, r = 2 + c * 5;
          R(g, x + s * 15 - r, y - r, r * 2, r * 2, '#58e0ff');
          R(g, x + s * 15 - 1, y - 1, 3, 3, '#ffffff');
        }
      },
      trace(g, u, a, b){
        if (u < 0.25) return;                                   // le rayon part après la charge
        const c = Math.min(1, (u - 0.25) / 0.35);
        const x = a.x + (b.x - a.x) * c, y = a.y + (b.y - a.y) * c;
        const ep = 2 + Math.sin(Math.min(1, c * 1.4) * Math.PI) * 3;
        const x0 = Math.min(a.x, x), lg = Math.abs(x - a.x);
        R(g, x0, a.y - ep / 2, lg, ep, '#58e0ff');
        R(g, x0, a.y - 1, lg, 2, '#ffffff');
      },
      choc(g, v, p){
        const r = 3 + v * 26;
        for (let i = 0; i < 18; i++){
          const a = i / 18 * 6.283;
          R(g, p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, 2, 2, v < 0.5 ? '#ffffff' : '#58e0ff');
        }
      },
    },
    { id: 'sceptre', vol: 600,
      main(g, x, y, s, u){
        R(g, x, y - 10, 2, 20, '#8a7a4a');                      // hampe
        [[0, -16], [-3, -13], [3, -13], [0, -10]].forEach(o => R(g, x + o[0], y + o[1], 3, 3, '#ff5f8a'));
        R(g, x, y - 13, 2, 2, '#ffd0dd');
        if (u > 0.5){ g.globalAlpha = (u - 0.5) * 0.7; R(g, x - 7, y - 21, 16, 16, '#ff5f8a'); g.globalAlpha = 1; }
      },
      trace(g, u, a, b){
        const x = a.x + (b.x - a.x) * u, y = a.y + (b.y - a.y) * u - Math.sin(u * Math.PI) * 9;
        R(g, x - 4, y - 4, 8, 8, '#ff5f8a');
        R(g, x - 2, y - 2, 4, 4, '#ffd0dd');
        for (let i = 0; i < 2; i++){                             // satellites
          const ang = u * 12 + i * 3.14;
          R(g, x + Math.cos(ang) * 9, y + Math.sin(ang) * 5, 2, 2, '#ffffff');
        }
      },
      choc(g, v, p){
        const r = v * 28;
        for (let i = 0; i < 12; i++){
          const a = i / 12 * 6.283 + 0.26;
          R(g, p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, 3, 3, '#ff5f8a');
          R(g, p.x + Math.cos(a) * r * 0.6, p.y + Math.sin(a) * r * 0.6, 2, 2, '#ffd0dd');
        }
      },
    },
  ];

  /* ---- combattants ----
     Position, balancement, élan de tir et recul : tout se déduit de l'horloge
     du duel, donc rien n'est stocké d'une image à l'autre. */
  function tourCourant(tt){
    for (let i = plan.length - 1; i >= 0; i--) if (tt >= plan[i].t0) return plan[i];
    return null;
  }

  /* ---- la chute et le triomphe ----
     Dès qu'un vêtement tombe à zéro, le plan est tronqué : il n'aura pas
     d'animation d'attaque après sa mort — c'était le défaut le plus visible de
     la première version, on voyait un mort armer son arc. Puis il se désagrège
     en poussière, et le vainqueur fait un tour complet sur lui-même avant de
     se présenter de face, au centre. FINALE donne le minutage, à partir de
     l'instant du coup fatal. */
  const FINALE = { poussiere: [260, 1050], tour: [420, 1150], carte: 1700 };
  let koT = 0, perdant = -1, poussiere = [], fanfare = false;
  const doux = u => u * u * (3 - 2 * u);
  const avance = (tt, p) => Math.max(0, Math.min(1, (tt - koT - p[0]) / p[1]));

  function etat(s, tt){
    const S0 = H * TAILLE;
    const cx0 = W * (s === 0 ? 0.27 : 0.73);
    const sens = s === 0 ? 1 : -1;                // +1 = vers le centre
    let S = S0, cx = cx0, cy = H * SOL - S0 * 0.31; // le bas du carré passe sous la ligne de sol
    let dx = 0, dy = Math.sin(tt / 620 + s * 2) * H * 0.012;
    let ang = sens * FACE + Math.sin(tt / 900 + s) * 0.07;
    let rouge = 0, alpha = 1, arme = 0;
    const e = koT ? null : tourCourant(tt);
    if (e && e.from === s){
      if (tt < e.tir){                            // armement : on se ramasse en arrière
        const u = (tt - e.t0) / PH.wind;
        dx = -sens * H * 0.038 * Math.sin(u * Math.PI);
        ang += sens * 0.24 * Math.sin(u * Math.PI);
        arme = u;
      } else if (tt < e.tir + 220){               // détente vers le centre, l'arme encore en main
        const u = (tt - e.tir) / 220;
        dx = sens * H * 0.05 * (1 - u) * (1 - u);
        arme = 1;
      }
    }
    /* Le coup encaissé : recul et clignotement rouge, sur CHAQUE attaque.
       Il ne se déclenchait que sur le dernier coup du plan — plan[longueur-1]
       au lieu du coup en cours — d'où l'impression que seul le pistolet
       secouait sa cible. Une fois tombé, le plan est tronqué au coup fatal :
       le dernier est alors bien celui qu'on veut. Le rouge ne fond pas
       doucement, il bat : trois éclats qui s'éteignent, c'est ce qui donne le
       « ça a frappé » du jeu d'arcade. Les effets propres à chaque arme
       (arme en main, projectile, gerbe d'impact) sont ailleurs, intacts. */
    const frappe = koT ? plan[plan.length - 1] : e;
    if (frappe && frappe.to === s && tt >= frappe.choc){
      const u = Math.min(1, (tt - frappe.choc) / PH.impact);
      // Cinq éclats FRANCS plutôt que trois adoucis : allumé ou éteint, net,
      // comme un sprite qui clignote. Le sinus adouci lisait comme un fondu.
      const bat = Math.floor(u * 10) % 2 ? 0 : 1;
      rouge = (1 - u) * bat;   // décroissance linéaire : les derniers éclats comptent encore
      dx = -sens * H * 0.075 * Math.sin(u * Math.PI);
      ang -= sens * 0.24 * (1 - u);
      dy -= H * 0.012 * Math.sin(u * Math.PI);
    }
    if (koT && s === perdant){                    // il part en poussière : le tissu s'efface
      const p = avance(tt, FINALE.poussiere);
      alpha = 1 - doux(Math.min(1, p * 1.15));
      dy += doux(p) * H * 0.02;
      arme = 0;
    }
    if (koT && s === vainqueur){                  // tour complet, puis face au public, au centre
      const p = doux(avance(tt, FINALE.tour));
      // On tourne DANS L'AUTRE SENS que la pose de trois quarts : le tour fait
      // alors plus d'un tour complet et s'achève pile sur la face (angle nul).
      ang = ang + (-sens * 6.28318 - ang) * p;
      cx = cx0 + (W * 0.5 - cx0) * p;
      S = S0 * (1 + 0.14 * p);
      cy = H * SOL - S * 0.31;
      dy = Math.sin(tt / 620 + s * 2) * H * 0.012 * (1 - p * 0.6);
      arme = 0;
    }
    return { S: S, cx: cx + dx, cy: cy + dy, ang: ang, rouge: rouge, alpha: alpha, arme: arme, sens: sens };
  }

  /* Poussière : les particules sont tirées des PIXELS RÉELS du vêtement, relus
     dans le canvas 3D juste avant qu'il ne s'efface. On obtient sa silhouette
     et ses couleurs, pas un nuage générique. Chaque grain garde sa place de
     départ, un retard qui fait partir le bas en premier, et une dérive. */
  function semerPoussiere(boite){
    poussiere = [];
    const N = 44;
    const c = document.createElement('canvas'); c.width = c.height = N;
    const g2 = c.getContext('2d', { willReadFrequently: true });
    try { g2.drawImage(glC, boite.x, boite.y, boite.s, boite.s, 0, 0, N, N); }
    catch (err){ return; }
    const d = g2.getImageData(0, 0, N, N).data;
    const kx = PXW / W, ech = boite.s / K / N * kx;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
      const i = (y * N + x) * 4;
      if (d[i + 3] < 60) continue;
      if ((x + y * 3) % 2) continue;             // un grain sur deux : assez dense, deux fois moins lourd
      poussiere.push({
        x: boite.x / K * PXW / W + x * ech,
        y: boite.y / K * pxH / H + y * (boite.s / K / N * pxH / H),
        c: 'rgb(' + d[i] + ',' + d[i + 1] + ',' + d[i + 2] + ')',
        r: 0.18 + 0.5 * ((x * 7 + y * 13) % 10) / 10,   // retard : le bas s'envole avant le haut
        vx: ((x * 5 + y * 11) % 10) / 10 - 0.3,
        vy: 0.7 + ((x * 3 + y * 7) % 10) / 10,
      });
    }
  }
  function peindrePoussiere(g, tt){
    const p = avance(tt, FINALE.poussiere);
    if (!p || !poussiere.length) return;
    for (let i = 0; i < poussiere.length; i++){
      const q = poussiere[i];
      const u = (p - q.r) / (1 - q.r);
      if (u <= 0) continue;
      const a = 1 - u;
      g.globalAlpha = a * a;
      g.fillStyle = q.c;
      g.fillRect(Math.round(q.x + q.vx * u * 26), Math.round(q.y - q.vy * u * u * 34 - u * 10), 1, 1);
    }
    g.globalAlpha = 1;
  }
  /* ---- boucle du duel ---- */
  let debut = 0, fini = false, faits = new Set(), nombres = [], secousse = 0;
  function mesurer(){
    const r = shakeEl.getBoundingClientRect();
    W = r.width; H = r.height;
    K = Math.min(2, window.devicePixelRatio || 1);
    [bgC, glC, fxC].forEach(c => {
      const w = Math.round(W * K), h = Math.round(H * K);
      if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
    });
    // Tampons 16 bits : 320 px de large, hauteur au prorata. Ils ne changent
    // qu'au redimensionnement, et le décor fixe est alors repeint.
    pxH = Math.max(90, Math.round(PXW * H / Math.max(1, W)));
    if (!pxBack){ pxBack = document.createElement('canvas'); pxFront = document.createElement('canvas'); pxFixe = document.createElement('canvas'); }
    [pxBack, pxFront, pxFixe].forEach(c => { if (c.width !== PXW || c.height !== pxH){ c.width = PXW; c.height = pxH; } });
    peindreDecorFixe();
    [bg, fx].forEach(g => { g.imageSmoothingEnabled = false; });
  }
  function peindreDecorFixe(){
    if (!decor || !pxFixe) return;
    const g = pxFixe.getContext('2d');
    g.clearRect(0, 0, PXW, pxH);
    decor.fixe(g, PXW, pxH);
  }
  function majBarres(){
    [0, 1].forEach(s => {
      const v = Math.max(0, vie[s]) / 100;
      fillEls[s].style.transform = 'scaleX(' + v + ')';
      ghostEls[s].style.transform = 'scaleX(' + v + ')';
    });
  }
  // du repère écran (pixels CSS) vers celui du tampon 16 bits
  const versPx = p => ({ x: p.x * PXW / W, y: p.y * pxH / H });

  function image(now){
    raf = requestAnimationFrame(image);
    if (!debut) debut = now;
    const tt = now - debut;
    // Plan épuisé sans K.-O. : la vie restante tranche, et le perdant part en
    // poussière comme s'il était tombé.
    if (!koT && plan.length && tt >= plan[plan.length - 1].fin)
      tomber(vie[0] === vie[1] ? (Math.random() < 0.5 ? 0 : 1) : (vie[0] < vie[1] ? 0 : 1), tt);
    if (koT && !fanfare && tt >= koT + FINALE.tour[0] + FINALE.tour[1]){ fanfare = true; sfx.win(); }
    if (koT && !fini && tt >= koT + FINALE.carte) terminer();

    const st = [etat(0, tt), etat(1, tt)];

    // 1. décor : la partie fixe recopiée, les détails vivants par-dessus
    const gb = pxBack.getContext('2d');
    gb.clearRect(0, 0, PXW, pxH);
    gb.drawImage(pxFixe, 0, 0);
    if (decor.vif) decor.vif(gb, PXW, pxH, tt);
    // ombres portées, dans le tampon du fond : sans elles les vêtements
    // flottent au-dessus du sol. En gros pixel, comme le reste du décor.
    st.forEach((e, s) => {
      if (e.alpha < 0.05) return;
      const p = versPx({ x: e.cx, y: H * SOL });
      const rw = Math.max(4, e.S * PXW / W * 0.26);
      gb.globalAlpha = 0.20 * e.alpha; R(gb, p.x - rw * 1.3, p.y - 2, rw * 2.6, 5, '#000000');
      gb.globalAlpha = 0.38 * e.alpha; R(gb, p.x - rw, p.y - 1, rw * 2, 3, '#000000');
      gb.globalAlpha = 1;
    });
    bg.imageSmoothingEnabled = false;
    bg.clearRect(0, 0, bgC.width, bgC.height);
    bg.drawImage(pxBack, 0, 0, bgC.width, bgC.height);

    // 2. vêtements, dans le contexte 3D dédié
    let boitePerdant = null;
    if (scene){
      scene.clear();
      st.forEach((e, s) => {
        const b = { x: (e.cx - e.S / 2) * K, y: (e.cy - e.S / 2) * K, s: e.S * K };
        if (s === perdant) boitePerdant = b;
        if (e.alpha < 0.02) return;
        scene.draw(picks[s].it, e.ang, b, e.alpha, e.rouge > 0.01 ? [1, 0.16, 0.12, e.rouge] : null);
      });
      // Les grains sont relus dans le canvas 3D à l'image même du coup fatal,
      // pendant que le vêtement y est encore entier.
      if (koT && !poussiere.length && boitePerdant) semerPoussiere(boitePerdant);
    }

    // 3. armes, projectiles, impacts et poussière, au même gros pixel que le décor
    const gf = pxFront.getContext('2d');
    gf.clearRect(0, 0, PXW, pxH);
    const e = koT ? null : tourCourant(tt);
    if (e){
      const a = st[e.from], b = st[e.to];
      const bouche = versPx({ x: a.cx + a.sens * a.S * 0.26, y: a.cy });
      const cible = versPx({ x: b.cx, y: b.cy });
      if (a.arme > 0) e.atk.main(gf, bouche.x, bouche.y, a.sens, a.arme);
      if (tt >= e.tir && tt < e.choc) e.atk.trace(gf, (tt - e.tir) / e.atk.vol, bouche, cible);
      if (tt >= e.choc && tt < e.choc + PH.impact) e.atk.choc(gf, (tt - e.choc) / PH.impact, cible);
      if (tt >= e.tir && !e.tire){ e.tire = true; sfx.shot(e.atk.id); }
      if (tt >= e.choc && !faits.has(e)) encaisser(e, tt, { x: b.cx, y: b.cy });
    }
    if (koT) peindrePoussiere(gf, tt);
    fx.imageSmoothingEnabled = false;
    fx.setTransform(1, 0, 0, 1, 0, 0);
    fx.clearRect(0, 0, fxC.width, fxC.height);
    fx.drawImage(pxFront, 0, 0, fxC.width, fxC.height);

    // 4. dégâts qui montent et s'effacent — en net, eux, pour rester lisibles
    fx.setTransform(K, 0, 0, K, 0, 0);
    nombres = nombres.filter(n => tt - n.t0 < 900);
    nombres.forEach(n => {
      const u = (tt - n.t0) / 900;
      fx.font = '600 ' + Math.round(H * 0.055) + 'px Inter, sans-serif';
      fx.textAlign = 'center';
      fx.fillStyle = 'rgba(255,82,82,' + (1 - u) + ')';
      fx.fillText('-' + n.val, n.x, n.y - H * 0.10 - u * H * 0.09);
    });

    // 5. secousse : décor, vêtements et effets bougent ensemble
    if (secousse > 0.4){
      secousse *= 0.86;
      shakeEl.style.transform = 'translate(' + ((Math.random() - 0.5) * secousse).toFixed(2) + 'px,'
                                             + ((Math.random() - 0.5) * secousse).toFixed(2) + 'px)';
    } else if (secousse){ secousse = 0; shakeEl.style.transform = ''; }
  }

  /* Le coup porte : c'est ICI que son nombre est tiré, et pas à l'écriture du
     duel. Les fourchettes montent d'un tour à l'autre, de sorte qu'un duel se
     règle presque toujours en trois échanges sans que l'issue soit écrite. */
  function encaisser(e, tt, pos){
    faits.add(e);
    const f = DEGATS[Math.min(DEGATS.length - 1, e.tour)];
    e.dmg = Math.round(f[0] + Math.random() * (f[1] - f[0]));
    vie[e.to] = Math.max(0, vie[e.to] - e.dmg);
    majBarres();
    nombres.push({ x: pos.x, y: pos.y, t0: tt, val: e.dmg });
    secousse = 11;
    turnLabel.textContent = '-' + e.dmg;
    sfx.hit(e.dmg);
    if (vie[e.to] <= 0) tomber(e.to, tt);
  }
  // Il tombe : le plan s'arrête là, sinon on le verrait armer une attaque après
  // sa mort — c'était le défaut le plus visible de la première version. La
  // suite (poussière, tour d'honneur, carte) est réglée par FINALE.
  function tomber(qui, tt){
    if (koT) return;
    perdant = qui; vainqueur = 1 - qui; koT = tt;
    plan = plan.filter(p => p.choc <= tt);
    turnLabel.textContent = vie[qui] <= 0 ? 'K.O.' : 'VS';
  }

  function terminer(){
    fini = true;
    endTitle.textContent = L(picks[vainqueur].it.n) + ' ' + T('arenaWins');
    endBox.hidden = false;
  }

  /* ---- enchaînement ---- */
  function lancer(){
    if (!picks[0] || !picks[1]) return;
    pickView.hidden = true;
    stage.hidden = false;
    endBox.hidden = true;
    if (!scene) scene = model3d.makeScene(glC);
    if (scene) picks.forEach(p => scene.load(p.it));   // maillages déjà en cache : instantané
    nameEls.forEach((el, s) => { el.textContent = L(picks[s].it.n); });
    decor = DECORS[Math.floor(Math.random() * DECORS.length)]; // ruelle, plage ou garage
    ecrireDuel();
    majBarres();
    faits = new Set(); nombres = []; secousse = 0; debut = 0; fini = false;
    koT = 0; perdant = -1; poussiere = []; fanfare = false;
    turnLabel.textContent = 'VS';
    enDuel = true;
    mesurer();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(image);
  }
  function ouvrir(){
    if (ouvert) return;
    ouvert = true;
    construireGrille();
    stage.hidden = true; pickView.hidden = false; endBox.hidden = true;
    overlay.classList.add('open');
    sfx.startup();      // le carillon d'ouverture : l'application s'annonce
    sfx.combat(true);   // la nappe du menu se tait, le thème 8 bits prend la main
  }
  function fermer(){
    if (!ouvert) return;
    ouvert = false;
    cancelAnimationFrame(raf); raf = 0;
    enDuel = false; fini = false;
    shakeEl.style.transform = '';
    overlay.classList.remove('open');
    sfx.combat(false);  // retour à la nappe du menu
    // On revient sur la fiche du jeu, comme on retombe sur la tuile d'une
    // application qu'on vient de quitter — et non sur la catégorie d'avant.
    const ci = DATA.findIndex(c => c.kind === 'game');
    if (ci >= 0 && activeCat !== ci){ activeCat = ci; activeItem = 0; render(); }
  }
  function acheterVainqueur(){
    const p = picks[vainqueur];
    const ci = DATA.indexOf(p.cat), ii = p.cat.items.indexOf(p.it);
    fermer();
    if (ci < 0 || ii < 0) return;
    activeCat = ci; activeItem = ii;
    render();
    // Le sélecteur s'ouvre à l'image suivante, et pas tout de suite : le clic
    // sur « Ajouter au panier » remonte encore jusqu'au document, où un
    // écouteur referme tout sélecteur ouvert par un clic venu d'ailleurs. Ouvert
    // dans la foulée, il se serait donc refermé aussitôt.
    requestAnimationFrame(() => openSizePicker(true)); // l'ajout passe toujours par une taille, comme ailleurs
  }


  /* ---- aperçu fixe du panneau ----
     Le panneau « Versus » montre une image du jeu avant d'y entrer : un décor
     tiré au sort, deux vêtements et une attaque en vol. Les deux vêtements
     réutilisent le MAILLAGE de deux articles du catalogue mais PAS leur photo :
     ils sont peints en bleu et en rouge pleins (uTint à fond, la teinte
     remplace la texture avant l'éclairage cuit, donc ils restent modelés). Et
     ce sont les PREMIERS articles de la boutique, pas des références figées :
     si ceux-ci disparaissent un jour, l'aperçu prendra simplement les suivants
     au lieu de montrer un produit mort. */
  const teaser = { scene: null, taille: '', decor: null, fente: null };
  function apercu(){
    const box = document.getElementById('arenaTeaser');
    if (!box) return;
    const bouts = DATA.filter(c => c.kind === 'shop' && c.items.length);
    if (!bouts.length) return;
    const gauche = bouts[0].items[0];                       // un t-shirt
    const droite = (bouts[1] || bouts[0]).items[0];         // un pull, ou à défaut le suivant
    const bc = document.getElementById('teaserBg'), gc = document.getElementById('teaserGL'), fc = document.getElementById('teaserFx');
    const r = box.getBoundingClientRect();
    if (!r.width) return;
    const k = Math.min(2, window.devicePixelRatio || 1);
    const cle = Math.round(r.width) + 'x' + Math.round(r.height);
    if (teaser.taille === cle && teaser.scene) return;      // déjà peint à cette taille
    teaser.taille = cle;
    [bc, gc, fc].forEach(c => { c.width = Math.round(r.width * k); c.height = Math.round(r.height * k); });
    if (!teaser.scene) teaser.scene = model3d.makeScene(gc);
    // Décors ÉCRITS, pas tirés au sort : l'aperçu est une image fixe, elle doit
    // être la même à chaque retour sur la catégorie. La ruelle à gauche, la
    // plage à droite — les deux qui contrastent le plus.
    if (!teaser.decor) teaser.decor = [DECORS[0], DECORS[1]];
    const w = r.width, h = r.height, pw = 320, ph = Math.max(80, Math.round(pw * h / w));
    // 1. décor, au gros pixel comme dans l'arène — mais DEUX décors, fendus par
    //    un éclair : l'aperçu annonce ainsi que le lieu change d'un duel à
    //    l'autre. La moitié droite est peinte sous découpe, le long de la même
    //    ligne brisée que l'éclair, sinon la fente et la lumière ne
    //    coïncideraient pas.
    const tampon = document.createElement('canvas'); tampon.width = pw; tampon.height = ph;
    const gp = tampon.getContext('2d');
    if (!teaser.fente) teaser.fente = pointsEclair(pw, ph);
    const fente = teaser.fente;
    teaser.decor[0].fixe(gp, pw, ph);
    if (teaser.decor[0].vif) teaser.decor[0].vif(gp, pw, ph, 1200);
    gp.save();
    gp.beginPath();
    gp.moveTo(fente[0].x, 0);
    fente.forEach(p => gp.lineTo(p.x, p.y));
    gp.lineTo(pw, ph); gp.lineTo(pw, 0);
    gp.closePath(); gp.clip();
    teaser.decor[1].fixe(gp, pw, ph);
    if (teaser.decor[1].vif) teaser.decor[1].vif(gp, pw, ph, 3400);
    gp.restore();
    traitEclair(gp, fente, 7, 'rgba(255,240,190,0.22)');   // halo
    traitEclair(gp, fente, 3, '#ffe9a8');
    traitEclair(gp, fente, 1, '#ffffff');                  // cœur
    const gb = bc.getContext('2d');
    gb.imageSmoothingEnabled = false;
    gb.clearRect(0, 0, bc.width, bc.height);
    gb.drawImage(tampon, 0, 0, bc.width, bc.height);
    // 2. armes et projectile, dans le même tampon, par-dessus les vêtements
    const S = h * 0.50, gx = w * 0.24, dx = w * 0.76, cy = h * SOL - S * 0.31;
    const px = p => ({ x: p.x * pw / w, y: p.y * ph / h });
    // 2. une arme dans chaque main, mais AUCUNE attaque en vol : l'aperçu
    //    présente les combattants, il ne raconte pas un coup en cours. L'arc à
    //    gauche (corde tendue), le pistolet à droite (au repos : son éclair de
    //    bouche ne sort qu'au-delà de 0,9).
    gp.clearRect(0, 0, pw, ph);
    const mainG = px({ x: gx + S * 0.26, y: cy }), mainD = px({ x: dx - S * 0.26, y: cy });
    ATTAQUES[0].main(gp, mainG.x, mainG.y, 1, 0.8);
    ATTAQUES[1].main(gp, mainD.x, mainD.y, -1, 0.5);
    const gf = fc.getContext('2d');
    gf.imageSmoothingEnabled = false;
    gf.clearRect(0, 0, fc.width, fc.height);
    gf.drawImage(tampon, 0, 0, fc.width, fc.height);
    // 3. les deux vêtements, en couleur pleine : le modèle sans la photo
    if (!teaser.scene) return;
    Promise.all([teaser.scene.load(gauche), teaser.scene.load(droite)]).then(() => {
      teaser.scene.clear();
      [[gauche, gx, FACE, [0.26, 0.48, 0.98]], [droite, dx, -FACE, [0.95, 0.24, 0.24]]].forEach(v => {
        teaser.scene.draw(v[0], v[2], { x: (v[1] - S / 2) * k, y: (cy - S / 2) * k, s: S * k }, 1,
          [v[3][0], v[3][1], v[3][2], 1]);
      });
    });
  }
  document.getElementById('arenaClose').addEventListener('click', fermer);
  document.getElementById('arenaClear').addEventListener('click', () => { picks = [null, null]; majChoix(); });
  fightBtn.addEventListener('click', lancer);
  document.getElementById('arenaAdd').addEventListener('click', acheterVainqueur);
  document.getElementById('arenaQuit').addEventListener('click', fermer);
  overlay.addEventListener('click', e => { if (e.target === overlay) fermer(); });
  window.addEventListener('resize', () => { if (ouvert && enDuel) mesurer(); });

  // Clavier : flèches dans la grille, Entrée choisit (ou lance quand les deux
  // sont pris), Échap ferme. Pendant le duel il n'y a rien à faire — c'est un
  // tirage au sort, pas un jeu — sauf Entrée pour passer à la fin.
  function touche(e){

/* ---------------- molette ----------------
   La molette parcourt la liste de la catégorie active comme ↑/↓. Les zones
   qui défilent vraiment (descriptif, panier, fenêtres) gardent leur
   défilement natif. Un cran de molette (événement franc, isolé d'au moins
   25 ms du précédent, ou en mode « lignes ») vaut un produit et chaque cran
   compte, quelle que soit la cadence ; le flux continu d'un pavé tactile est
   accumulé (40 px = un produit, un pas au plus toutes les 60 ms) pour ne pas
   sauter d'items. Les pas rapprochés raccourcissent les glissements (noteStep). */
const WHEEL_FAST = 200; // ms sous lesquelles deux crans comptent comme un défilement lancé
let wheelAcc = 0, wheelLast = 0, wheelStepAt = 0;
window.addEventListener('wheel', (e) => {
  if (startupActive || panelMode || arena.isOpen()) return;
  if (infoOverlay.classList.contains('open') || legalOverlay.classList.contains('open') || cartOverlay.classList.contains('open')) return;
  const scrollable = e.target.closest && e.target.closest('.preview-desc, .legal-body, .info-body, .cart-items');
  if (scrollable && scrollable.scrollHeight > scrollable.clientHeight) return;
  const count = DATA[activeCat].items.length;
  if (count < 2) return;
  const now = performance.now(), gap = now - wheelLast;
  wheelLast = now;
  const delta = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  let dir = 0, continu = false; // continu : flux d'un pavé tactile, traité comme une touche maintenue
  if (Math.abs(delta) >= 40 && (gap >= 25 || e.deltaMode === 1)){
    // cran de molette (événement isolé et franc) : un produit par cran, chaque cran
    // compte, sans limite de cadence (l'ancien délai de 80 ms en perdait un sur deux)
    dir = Math.sign(delta); wheelAcc = 0;
  } else {
    // flux continu (pavé tactile) : 40 px = un produit, au plus un pas toutes les 60 ms
    if (gap > 400) wheelAcc = 0; // nouveau geste : on repart de zéro
    wheelAcc += delta;
    if (Math.abs(wheelAcc) < 40 || now - wheelStepAt < 60) return;
    dir = Math.sign(wheelAcc); wheelAcc = 0;
    continu = true;
  }
  /* Molette lancée : les crans s'enchaînent comme une touche qui se répète, le
     clic passe donc au même volume réduit que sous une touche maintenue (voir
     sfx.tick). Le premier cran d'une salve, lui, est loin du précédent : il
     sonne à plein, exactement comme la première pression avant que la répétition
     du clavier ne démarre. L'écart se mesure sur le cran précédent RETENU, donc
     AVANT d'écrire wheelStepAt — le comparer à lui-même serait toujours vrai. */
  const rapide = continu || (wheelStepAt > 0 && now - wheelStepAt < WHEEL_FAST);
  wheelStepAt = now;
  const next = Math.max(0, Math.min(count - 1, activeItem + dir));
  if (next !== activeItem){ activeItem = next; render(); sfx.tick(rapide); }
}, { passive: true });

/* ---------------- fond : ruban XMB ----------------
   Le ruban du XMB est une nappe de soie : un faisceau de voiles fins et
   translucides qui suivent une même « colonne vertébrale » ondulante, se
   resserrent en plis lumineux puis s'évasent.

   Il était peint au pinceau 2D, tranche verticale par tranche verticale :
   près de deux mille petits rectangles par image, sur le fil principal, soit
   8 ms — de loin le poste le plus lourd de la page, celui qui volait leur
   temps aux animations de la liste et aux bruitages. Le dessiner à moitié
   résolution l'a allégé mais l'a rendu visiblement pixellisé : chaque tranche
   faisait alors 16 px à l'écran, avec des bords francs.

   Il est maintenant confié à la carte graphique. Le fil principal ne pose plus
   que les points des courbes (un ruban de triangles par voile) ; le dégradé
   vertical, le fond et la lueur d'horizon sont calculés par le GPU pour chaque
   pixel. Pleine résolution, aucune tranche visible, et le dégradé suit
   exactement l'ondulation au lieu d'être recopié en escalier.

   (Une vraie « mise en boîte » du ruban — une minute d'images toutes prêtes
   rejouées en boucle — demanderait 25 Go de mémoire à cet écran : c'est
   justement ce calcul-là que le GPU refait gratuitement à chaque image.) */
const canvas = document.getElementById('waveCanvas');
const canvasGlow = document.getElementById('waveCanvasGlow');
const sparkleCanvas = document.getElementById('sparkleCanvas');
const sctx = sparkleCanvas.getContext('2d');
let W,H;
// Couleurs courantes, en composantes 0-255 (applyMood les remplace).
let BG_TOP = [4,8,12], BG_BOT = [13,31,48], HORIZON = [60,110,140], VIVID = [90,168,194];
let BODY = [150,200,220], EDGE = [220,235,245];
let sparklesReady = false;
/* Le halo est rendu au quart de la résolution de l'écran. Il n'est jamais vu
   net : le CSS le floute, et l'agrandissement du navigateur le floute déjà
   lui-même. Cela permet de descendre le flou CSS de 22 à 6 pixels, bien moins
   coûteux, pour un rendu identique. Le ruban net, lui, est à pleine
   résolution, comme les étincelles. */
const GLOW_SCALE = 0.25;
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = sparkleCanvas.width = W;
  canvas.height = sparkleCanvas.height = H;
  canvasGlow.width = Math.max(1, Math.round(W * GLOW_SCALE));
  canvasGlow.height = Math.max(1, Math.round(H * GLOW_SCALE));
  if (sparklesReady) seedSparkles(); // le nombre de particules dépend de la largeur
}
resize();
window.addEventListener('resize', resize);

let t = 0;

const TAU = Math.PI * 2;
const WAVE = {
  y: 0.55,      // hauteur moyenne du ruban (fraction de la hauteur d'écran)
  step: 8,      // écart entre deux points de la courbe (px). Ce n'est plus la
                // largeur d'un coup de pinceau : entre deux points, le GPU
                // interpole. 8 px suffisent pour que l'ondulation reste lisse.
  // colonne vertébrale : une grande houle (0,8 longueur d'onde par écran)
  // plus deux ondulations plus courtes. amp en fraction de H, cycles par
  // largeur d'écran, speed en rad par image à 60 i/s (voir l'horloge t).
  // Amplitudes modérées (le ruban varie peu de haut en bas), mouvement lent.
  spine: [
    { amp: 0.075, cycles: 0.8, speed:  0.00105, phase: 0.6 },
    { amp: 0.030, cycles: 1.9, speed: -0.0017,  phase: 2.1 },
    { amp: 0.012, cycles: 3.7, speed:  0.0026,  phase: 4.0 },
  ],
};
// Voiles, comme sur le fond d'écran PS3 : chaque voile est une bande entre un
// bord haut (spine + off + a·sin) et un bord bas (bord haut + épaisseur, que le
// vrillage « twist » resserre puis relâche). off/a/thick en fraction de H,
// c/tc en cycles par écran, s/ts en rad/image, alpha = corps, edge = liseré.
const SHEETS = [
  { off:-0.06, a:0.028, c:1.3, s: 0.00145, p:0.3, thick:0.11, twist:0.70, tc:0.9, ts:0.00115, tp:1.0, alpha:0.14, edge:0.55 },
  { off:-0.02, a:0.022, c:1.7, s:-0.00185, p:1.9, thick:0.14, twist:0.60, tc:1.2, ts:0.00155, tp:2.6, alpha:0.11, edge:0.50 },
  { off: 0.01, a:0.032, c:1.1, s: 0.00125, p:3.4, thick:0.09, twist:0.75, tc:0.7, ts:0.00095, tp:0.2, alpha:0.16, edge:0.65 },
  { off: 0.04, a:0.024, c:2.1, s:-0.00205, p:5.0, thick:0.12, twist:0.65, tc:1.5, ts:0.00135, tp:3.9, alpha:0.10, edge:0.45 },
  { off: 0.07, a:0.019, c:1.5, s: 0.00165, p:0.9, thick:0.10, twist:0.70, tc:1.0, ts:0.00175, tp:5.1, alpha:0.12, edge:0.55 },
  { off:-0.09, a:0.016, c:2.4, s: 0.00225, p:2.7, thick:0.07, twist:0.80, tc:1.8, ts:0.00145, tp:1.7, alpha:0.09, edge:0.40 },
];
// Couleur des voiles = couleur d'accent du moment, éclaircie : corps vif,
// liserés plus clairs. Le profil de haut en bas (liseré lumineux puis corps
// translucide qui s'estompe) est, lui, dans le nuanceur : voir voile().
function colorRibbon(rgb){
  const [r, g, b] = rgb;
  const mix = (v, k) => Math.round(v + (255 - v) * k);
  BODY = [mix(r,0.4), mix(g,0.4), mix(b,0.4)];
  EDGE = [mix(r,0.68), mix(g,0.68), mix(b,0.68)];
}

// Hauteur de la spine, dans un repère de largeur w et de hauteur h. Tout le
// ruban est décrit en proportions : le dessiner dans un repère réduit donne
// exactement la même forme, en moins de pixels.
function spineIn(x, w, h){
  let y = h * WAVE.y;
  for (const c of WAVE.spine) y += h * c.amp * Math.sin(x * TAU * c.cycles / w + t * c.speed + c.phase);
  return y;
}
// Hauteur de la spine à l'écran (utilisée par les particules, qui, elles, sont nettes).
function spineY(x){ return spineIn(x, W, H); }

/* --- points des voiles ---
   Chaque voile devient trois « rubans de triangles » : le corps (entre bord
   haut et bord bas) et les deux liserés. Les sommets portent leur position en
   pixels d'écran, leur hauteur relative dans la bande (0 en haut, 1 en bas),
   leur intensité, et l'épaisseur du liseré — 0 pour le corps. Tout tient dans
   un seul tableau, les rubans étant cousus par des triangles plats. */
const V_FLOATS = 5;                    // x, y, v, intensité, demi-épaisseur
const STRIPS = SHEETS.length * 3;
let verts = null, vertCount = 0;
let spBuf = null, topBuf = null, botBuf = null;

function buildRibbon(){
  const w = W, h = H, step = WAVE.step;
  const n = Math.ceil(w / step) + 3;
  const need = (STRIPS * 2 * n + (STRIPS - 1) * 2) * V_FLOATS;
  if (!verts || verts.length !== need){
    verts = new Float32Array(need);
    spBuf = new Float32Array(n); topBuf = new Float32Array(n); botBuf = new Float32Array(n);
  }
  let o = 0;
  const put = (x, y, v, a, k) => { verts[o++] = x; verts[o++] = y; verts[o++] = v; verts[o++] = a; verts[o++] = k; };
  // Couture : on répète le dernier sommet du ruban précédent et le premier du
  // suivant. Les triangles ainsi formés sont plats, donc invisibles, et tous
  // les voiles partent en un seul appel de dessin.
  const start = (x, y, v, a, k) => {
    if (o){ const p = o - V_FLOATS; put(verts[p], verts[p+1], verts[p+2], verts[p+3], verts[p+4]); put(x, y, v, a, k); }
    put(x, y, v, a, k);
  };
  const edgeStrip = (line, width, a) => {
    const hw = width / 2 + 0.5;        // demi-trait plus 1 px de fondu : trait lissé d'épaisseur exacte
    for (let i = 0; i < n; i++){
      const x = (i - 1) * step;
      if (i === 0) start(x, line[0] - hw, 0, a, hw); else put(x, line[i] - hw, 0, a, hw);
      put(x, line[i] + hw, 1, a, hw);
    }
  };
  for (let i = 0; i < n; i++) spBuf[i] = spineIn((i - 1) * step, w, h);
  for (const sh of SHEETS){
    for (let i = 0; i < n; i++){
      const x = (i - 1) * step;
      const yT = spBuf[i] + h * (sh.off + sh.a * Math.sin(x * TAU * sh.c / w + t * sh.s + sh.p));
      const u = 0.5 + 0.5 * Math.sin(x * TAU * sh.tc / w + t * sh.ts + sh.tp);
      topBuf[i] = yT;
      botBuf[i] = yT + h * sh.thick * (1 - sh.twist + sh.twist * u);
    }
    for (let i = 0; i < n; i++){        // corps : le dégradé suit la bande, sans escalier
      const x = (i - 1) * step;
      if (i === 0) start(x, topBuf[0], 0, sh.alpha, 0); else put(x, topBuf[i], 0, sh.alpha, 0);
      put(x, botBuf[i], 1, sh.alpha, 0);
    }
    edgeStrip(topBuf, 1.3, sh.edge);    // bord haut net et lumineux
    edgeStrip(botBuf, 1.0, sh.edge * 0.4); // bord bas plus discret
  }
  vertCount = o / V_FLOATS;
}

/* --- nuanceurs ---
   Fond : dégradé vertical uni jusqu'à 55 % de la hauteur puis vers le bas,
   plus une lueur ronde sous l'écran. Exactement les deux dégradés qui étaient
   repeints au pinceau, ici calculés par pixel et gratuits.
   Ruban : le profil vertical d'un voile, et le fondu des liserés. */
const BG_VS = `attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }`;
const BG_FS = `
precision mediump float;
uniform vec2 u_px;
uniform vec3 u_top, u_bot, u_horizon;
void main(){
  float y = 1.0 - gl_FragCoord.y / u_px.y;                     // 0 en haut d'écran
  vec3 c = mix(u_top, u_bot, clamp((y - 0.55) / 0.45, 0.0, 1.0));
  float d = distance(gl_FragCoord.xy, vec2(0.55 * u_px.x, -0.15 * u_px.y));
  c = mix(c, u_horizon, 0.28 * max(0.0, 1.0 - d / (0.75 * u_px.x)));
  gl_FragColor = vec4(c, 1.0);
}`;
const RIB_VS = `
attribute vec2 a_pos;      // en pixels d'écran
attribute vec3 a_var;      // hauteur dans la bande, intensité, demi-épaisseur du liseré
uniform vec2 u_size;
varying vec3 v_var;
void main(){
  v_var = a_var;
  vec2 c = a_pos / u_size;
  gl_Position = vec4(c.x * 2.0 - 1.0, 1.0 - c.y * 2.0, 0.0, 1.0);
}`;
const RIB_FS = `
precision mediump float;
uniform vec3 u_body, u_edge;
uniform float u_gain;
varying vec3 v_var;
// profil d'un voile, de son bord haut (0) à son bord bas (1)
float voile(float v){
  if (v < 0.03) return v / 0.03;
  if (v < 0.12) return mix(1.0, 0.55, (v - 0.03) / 0.09);
  if (v < 0.55) return mix(0.55, 0.35, (v - 0.12) / 0.43);
  if (v < 0.90) return mix(0.35, 0.15, (v - 0.55) / 0.35);
  return mix(0.15, 0.0, (v - 0.90) / 0.10);
}
void main(){
  float hw = v_var.z;
  float liso = step(0.001, hw);
  float trait = clamp(hw * (1.0 - abs(v_var.x * 2.0 - 1.0)), 0.0, 1.0); // trait lissé
  float a = mix(voile(v_var.x), trait, liso) * v_var.y * u_gain;
  gl_FragColor = vec4(mix(u_body, u_edge, liso) * a, a);  // additif : couleur pré-multipliée
}`;

function makeWaveGL(cnv, gain, lisse){
  let gl;
  try {
    gl = cnv.getContext('webgl', { alpha:false, antialias:!!lisse, depth:false, stencil:false });
  } catch (e){ return null; }
  if (!gl) return null;
  const build = (vs, fs, attrs) => {
    const mk = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    attrs.forEach((name, i) => gl.bindAttribLocation(p, i, name)); // mêmes emplacements pour les deux programmes
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  };
  let bgP, ribP;
  try {
    bgP = build(BG_VS, BG_FS, ['a_pos']);
    ribP = build(RIB_VS, RIB_FS, ['a_pos', 'a_var']);
  } catch (e){ console.warn('ruban GPU indisponible :', e.message); return null; }
  const uBg = { px: gl.getUniformLocation(bgP, 'u_px'), top: gl.getUniformLocation(bgP, 'u_top'),
                bot: gl.getUniformLocation(bgP, 'u_bot'), horizon: gl.getUniformLocation(bgP, 'u_horizon') };
  const uRib = { size: gl.getUniformLocation(ribP, 'u_size'), body: gl.getUniformLocation(ribP, 'u_body'),
                 edge: gl.getUniformLocation(ribP, 'u_edge'), gain: gl.getUniformLocation(ribP, 'u_gain') };
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const ribBuf = gl.createBuffer();
  const tri = new Float32Array(3); // les couleurs passent de 0-255 à 0-1 pour le nuanceur
  const c3 = (rgb) => { tri[0] = rgb[0]/255; tri[1] = rgb[1]/255; tri[2] = rgb[2]/255; return tri; };
  return function draw(data, count){
    if (gl.isContextLost()) return;
    gl.viewport(0, 0, cnv.width, cnv.height);
    // fond
    gl.disable(gl.BLEND);
    gl.useProgram(bgP);
    gl.uniform2f(uBg.px, cnv.width, cnv.height);
    gl.uniform3fv(uBg.top, c3(BG_TOP));
    gl.uniform3fv(uBg.bot, c3(BG_BOT));
    gl.uniform3fv(uBg.horizon, c3(HORIZON));
    gl.disableVertexAttribArray(1);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // voiles, en additif comme le « lighter » du pinceau 2D
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.useProgram(ribP);
    gl.uniform2f(uRib.size, W, H);
    gl.uniform3fv(uRib.body, c3(gain > 1 ? VIVID : BODY)); // le halo est d'une seule couleur, vive
    gl.uniform3fv(uRib.edge, c3(gain > 1 ? VIVID : EDGE));
    gl.uniform1f(uRib.gain, gain);
    gl.bindBuffer(gl.ARRAY_BUFFER, ribBuf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    const stride = V_FLOATS * 4;
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, stride, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, stride, 8);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, count);
  };
}

// Le halo reprend le même ruban de triangles, au quart de la résolution, d'une
// seule couleur vive : c'est ce que faisait le « source-in » du pinceau 2D. Le
// gain 1,7 remplace les deux recopies (pleine puis 0,7) qui l'intensifiaient.
let drawSharp = makeWaveGL(canvas, 1, false);
let drawGlow = makeWaveGL(canvasGlow, 1.7, true);
// Le pilote peut reprendre un contexte à tout moment (veille, changement de
// carte) : sans ces deux lignes le fond resterait noir jusqu'au rechargement.
canvas.addEventListener('webglcontextlost', e => e.preventDefault());
canvas.addEventListener('webglcontextrestored', () => { drawSharp = makeWaveGL(canvas, 1, false); });
canvasGlow.addEventListener('webglcontextlost', e => e.preventDefault());
canvasGlow.addEventListener('webglcontextrestored', () => { drawGlow = makeWaveGL(canvasGlow, 1.7, true); });

function paintWaves(){
  if (!drawSharp && !drawGlow) return;   // sans GPU : le fond uni du body reste
  buildRibbon();
  if (drawSharp) drawSharp(verts, vertCount);
  if (drawGlow) drawGlow(verts, vertCount);
}

/* ---------------- scintillement ----------------
   Poussières lumineuses autour du ruban, comme sur le XMB : elles naissent
   près de la spine, montent doucement en suivant son ondulation, pulsent
   lentement sans jamais s'éteindre tout à fait, et s'estompent en fin de
   vie avant de renaître ailleurs. Volontairement discret. */
const SPARKLE = {
  perPx: 1/12,              // ~160 particules à 1920 px
  spread: 140,              // dispersion verticale de départ autour du ruban (px)
  minSize: 0.5,
  maxSize: 1.7,
  glowShare: 0.2,           // part des particules dotées d'un halo
  rise: [60, 150],          // hauteur totale gravie pendant une vie (px)
  drift: 0.12,              // dérive horizontale max (px / image)
  twinkle: [0.010, 0.028],  // pulsation (rad / image) : un cycle toutes les 4 à 10 s
  base: 0.18,               // luminosité plancher entre deux éclats
  ttl: [900, 1800],         // durée de vie (images) : 15 à 30 s
};

function makeSprite(size, stops){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);
  return c;
}
const spriteCore = makeSprite(16, [[0,'rgba(255,255,255,1)'], [0.45,'rgba(255,255,255,0.55)'], [1,'rgba(255,255,255,0)']]);
const spriteGlow = makeSprite(64, [[0,'rgba(255,255,255,0.7)'], [0.3,'rgba(255,255,255,0.18)'], [1,'rgba(255,255,255,0)']]);

let sparkles = [];
function newSparkle(){
  const ttl = SPARKLE.ttl[0] + Math.random() * (SPARKLE.ttl[1] - SPARKLE.ttl[0]);
  const rise = SPARKLE.rise[0] + Math.random() * (SPARKLE.rise[1] - SPARKLE.rise[0]);
  return {
    x: Math.random() * W,
    dy: SPARKLE.spread * Math.pow(Math.random(), 1.3) - 15, // près du ruban, un peu en dessous
    vx: (Math.random() - 0.5) * 2 * SPARKLE.drift,
    vy: -rise / ttl,                                        // ascension lente
    size: SPARKLE.minSize + Math.pow(Math.random(), 2) * (SPARKLE.maxSize - SPARKLE.minSize),
    glow: Math.random() < SPARKLE.glowShare,
    phase: Math.random() * Math.PI * 2,
    twinkle: SPARKLE.twinkle[0] + Math.random() * (SPARKLE.twinkle[1] - SPARKLE.twinkle[0]),
    life: 0,
    ttl,
  };
}
function seedSparkles(){
  sparkles = Array.from({ length: Math.round(W * SPARKLE.perPx) }, newSparkle);
  // vies déjà entamées au chargement : pas de fondu d'entrée général
  sparkles.forEach(s => { s.life = Math.random() * s.ttl; s.dy += s.vy * s.life; });
}
sparklesReady = true;
seedSparkles();

function drawSparkles(){
  sctx.clearRect(0, 0, W, H);
  sctx.globalCompositeOperation = 'lighter';
  for (const s of sparkles){
    s.x += s.vx;
    s.dy += s.vy;
    s.life += 1;
    if (s.life > s.ttl || s.x < -20 || s.x > W + 20) Object.assign(s, newSparkle());
    const y = spineY(s.x) + s.dy;
    const tw = 0.5 + 0.5 * Math.sin(s.phase + t * s.twinkle);
    const fade = Math.min(1, s.life / 120, (s.ttl - s.life) / 120);
    const alpha = fade * (SPARKLE.base + (1 - SPARKLE.base) * tw * tw);
    if (alpha < 0.02) continue;
    const d = s.size * 2 + 2;
    sctx.globalAlpha = alpha;
    sctx.drawImage(spriteCore, s.x - d/2, y - d/2, d, d);
    if (s.glow){
      const g = s.size * 10 + 10;
      sctx.globalAlpha = alpha * 0.35;
      sctx.drawImage(spriteGlow, s.x - g/2, y - g/2, g, g);
    }
  }
  sctx.globalAlpha = 1;
  sctx.globalCompositeOperation = 'source-over';
}

/* ---------------- mesure et diagnostic ----------------
   Ouvrir le site avec ?diag à la fin de l'adresse affiche un petit relevé en
   haut à gauche : images par seconde du fond et des modèles 3D, pire écart
   entre deux images (c'est lui qui trahit les saccades), état du son et
   nombre de sons joués. Rien ne s'affiche sans ce ?diag, et rien n'est
   mesuré non plus. Outil de mise au point, à retirer quand le site sera
   stabilisé. */
const DIAG = location.search.indexOf('diag') >= 0;
let bgFrames = 0, bgFps = 0, bgT = 0, bgLast = 0, bgWorst = 0, bgWorstShown = 0;
function drawFrame(ts){
  if (DIAG){
    const now = ts || performance.now();
    if (bgLast){ const gap = now - bgLast; if (gap > bgWorst) bgWorst = gap; }
    bgLast = now; bgFrames++;
    if (now - bgT >= 1000){
      bgFps = Math.round(bgFrames * 1000 / (now - bgT));
      bgWorstShown = Math.round(bgWorst);
      bgFrames = 0; bgT = now; bgWorst = 0;
    }
  }
  /* Le ruban ondule très lentement : le repeindre 30 fois par seconde au lieu
     de 60 est indiscernable à l'œil et laisse le reste du temps aux animations
     de l'interface. Sa vitesse ne change pas : son horloge, elle, avance à
     chaque image. */
  const now2 = ts || performance.now();
  /* Cette horloge suit le temps réel, pas le nombre d'images. Elle montait de 1
     par image : le ruban ondulait donc presque trois fois plus vite sur une
     machine qui tient 165 images par seconde que sur une qui en tient 60. Les
     vitesses des sinus restent réglées « par image à 60 i/s » ; le saut est
     plafonné pour qu'un retour d'onglet ne fasse pas bondir la vague. */
  t += Math.min(100, tLast ? now2 - tLast : 16.7) * 0.06;
  tLast = now2;
  // L'arène du mini-jeu couvre tout l'écran : inutile de peindre le ruban derrière,
  // et le duel a besoin de tout le temps disponible.
  if (!arena.isOpen() && now2 - wavesAt >= 28){ wavesAt = now2; paintWaves(); }
  drawSparkles();
  requestAnimationFrame(drawFrame);
}
let wavesAt = 0, tLast = 0;
if (DIAG){
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:8px;top:8px;z-index:99;background:rgba(0,0,0,0.78);'
    + 'color:#7fe0a0;font:12px/1.5 Consolas,monospace;padding:10px 12px;border-radius:8px;'
    + 'white-space:pre;pointer-events:none;text-shadow:none;';
  document.body.appendChild(box);
  // interrupteurs, pour trouver ce qui coûte cher sur SA machine : chaque
  // touche éteint un élément, on lit les images par seconde juste après
  const off = { halo: false, etincelles: false, verre: false, ruban: false };
  const vraiPaint = paintWaves;
  window.addEventListener('keydown', e => {
    const k = { '1':'halo', '2':'etincelles', '3':'verre', '4':'ruban' }[e.key];
    if (!k) return;
    off[k] = !off[k];
    document.getElementById('waveCanvasGlow').style.display = off.halo ? 'none' : '';
    document.getElementById('sparkleCanvas').style.display = off.etincelles ? 'none' : '';
    document.querySelectorAll('.glass, .preview').forEach(g => g.style.backdropFilter = off.verre ? 'none' : '');
    paintWaves = off.ruban ? () => {} : vraiPaint;
    bgWorst = 0;
  });
  // le niveau est relevé à chaque image, sans quoi un clic de 12 ms passerait entre deux mesures
  let crete = 0, creteT = 0;
  (function echantillonne(){
    const n = sfx.level();
    if (n > crete){ crete = n; creteT = performance.now(); }
    requestAnimationFrame(echantillonne);
  })();
  setInterval(() => {
    const d = model3d.debug();
    if (performance.now() - creteT > 1500) crete = sfx.level(); // la crête retombe après une seconde et demie
    const eteints = Object.keys(off).filter(k => off[k]);
    box.textContent =
      'fond    ' + bgFps + ' img/s   pire ecart ' + bgWorstShown + ' ms\n' +
      'modeles ' + d.fps + ' img/s   ' + d.rows + ' apercus\n' +
      'son     ' + sfx.state() + '   niveau ' + Math.round(crete * 1000) + '\n' +
      'horloge ' + (sfx.clock || 0).toFixed(1) + ' s   avance ' + Math.round(((sfx.lastAt || 0) - (sfx.clock || 0)) * 1000) + ' ms\n' +
      'joues   clic ' + sfx.plays.tick + '  souffle ' + sfx.plays.move + '  panier ' + sfx.plays.add + '\n' +
      'ecran   ' + innerWidth + 'x' + innerHeight + ' @' + (window.devicePixelRatio || 1) + '\n' +
      'touches 1 halo  2 etincelles  3 verre  4 ruban\n' +
      'eteints ' + (eteints.length ? eteints.join(', ') : 'aucun');
  }, 400);
}

applyMood();          // avant la première image : palette, voiles et halo
setInterval(applyMood, MOOD.refreshMs);
buildLegal();
withCatalogue(() => applyLanguage('en')); // produits enregistrés, puis menu (build) et libellés
drawFrame();

/* ---------------- écran de démarrage ----------------
   Séquence calquée sur l'allumage de la PS3 : le ruban ondule sur un fond
   assombri, le logo se révèle posé dessus à droite du centre, tient
   STARTUP.hold ms, puis le voile sombre et le logo s'effacent pendant que
   l'interface (déjà construite, invisible jusque-là) apparaît en fondu. */
const STARTUP = { hold: 4000, fade: 1600 }; // hold = fondu d'entrée du logo (0,9 s) + logo plein
function runStartup(){
  const layer = document.getElementById('startup');
  const tint = document.getElementById('startupTint');
  const logo = document.getElementById('startupLogo');
  const mark = document.getElementById('startupMark');
  // en pourcentages : la position suit un éventuel redimensionnement pendant
  // le démarrage. Emblème au centre, logo FS3 à sa droite, tous deux posés
  // sur le ruban comme le logo PS et le mot PS3 sur la console.
  // Même ligne pour les deux (hauteur du ruban à mi-chemin), sinon la pente
  // du ruban les décale l'un par rapport à l'autre.
  const lineY = ((spineY(W * 0.66) / H) * 100 + 3) + '%';
  mark.style.top = lineY;       // sa position horizontale est calée sur le logo en CSS
  logo.style.left = '75%';
  logo.style.top = lineY;
  const images = [logo, ...mark.querySelectorAll('img')];

  let started = false;
  const start = () => {
    if (started) return;
    started = true;
    requestAnimationFrame(() => layer.classList.add('show'));
    setTimeout(() => {
      document.body.classList.add('boot-fade');
      document.body.classList.remove('booting');
      layer.classList.add('fade');
      tint.classList.add('fade');
      setTimeout(() => {
        layer.remove();
        tint.remove();
        document.body.classList.remove('boot-fade');
        startupActive = false;
      }, STARTUP.fade);
    }, STARTUP.hold);
  };
  // on attend les images (préchargées), sans jamais bloquer plus de 1,2 s
  const ready = () => images.every(i => i.complete);
  if (ready()) start();
  else {
    images.forEach(i => {
      i.addEventListener('load', () => { if (ready()) start(); }, { once:true });
      i.addEventListener('error', () => { if (ready()) start(); }, { once:true });
    });
    setTimeout(start, 1200);
  }
}
// L'allumage se joue à chaque chargement de cette page (les futures pages
// annexes, fichiers séparés, n'embarquent pas cette séquence).
runStartup();
</script>
