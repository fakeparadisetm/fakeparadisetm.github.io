<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icone de la categorie « Minigames » : une manette du milieu des annees
       2000 — corps etroit, deux poignees LONGUES et presque droites qui
       pendent, croix a gauche, quatre boutons a droite, deux sticks colles au
       centre. C'est la silhouette de l'epoque ; une manette moderne aurait un
       corps large et des poignees courtes et ecartees.

       Tout est BLANC : les creux sont decoupes dans la forme (fill-rule
       evenodd), ils ne sont pas peints en sombre. C'est indispensable — le
       fichier sert aussi de MASQUE pour la lueur de l'icone selectionnee
       (.cat-glow-inner), et un masque ne lit que l'opacite : une zone peinte
       en noir resterait pleine dans la lueur.

       Comme « shipping icon.svg », a remplacer par un PNG en changeant le nom
       de fichier dans DATA (index.html). -->
  <g fill="#fff">
    <!-- poignees : longues, a peine ecartees -->
    <path transform="rotate(9 150 300)" d="M150 250h0a38 38 0 0 1 38 38v94a38 38 0 0 1-38 38h0a38 38 0 0 1-38-38v-94a38 38 0 0 1 38-38z"/>
    <path transform="rotate(-9 362 300)" d="M362 250h0a38 38 0 0 1 38 38v94a38 38 0 0 1-38 38h0a38 38 0 0 1-38-38v-94a38 38 0 0 1 38-38z"/>
    <!-- corps + creux, dans un seul trace : c'est ce qui les evide -->
    <path fill-rule="evenodd" d="
      M154 176 H358 A46 46 0 0 1 404 222 V240 A46 46 0 0 1 358 286 H154 A46 46 0 0 1 108 240 V222 A46 46 0 0 1 154 176 Z
      M159 202 H185 V215 H198 V241 H185 V254 H159 V241 H146 V215 H159 Z
      M340 189 a13 13 0 1 0 0 26 a13 13 0 1 0 0-26 Z
      M366 215 a13 13 0 1 0 0 26 a13 13 0 1 0 0-26 Z
      M340 241 a13 13 0 1 0 0 26 a13 13 0 1 0 0-26 Z
      M314 215 a13 13 0 1 0 0 26 a13 13 0 1 0 0-26 Z
      M226 249 a19 19 0 1 0 0 38 a19 19 0 1 0 0-38 Z
      M286 249 a19 19 0 1 0 0 38 a19 19 0 1 0 0-38 Z
    "/>
  </g>
</svg>
