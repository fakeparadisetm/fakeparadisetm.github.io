<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icone de la categorie « Minigames » : la toute premiere manette, reprise
       telle quelle a la demande — un corps « aile », deux poignees reliees par
       un pont, la croix a gauche et deux boutons a droite. Les versions
       suivantes (poignees allongees, puis disposition asymetrique facon 360)
       chargeaient le centre du glyphe pour rien.

       Seule difference avec l'originale : les creux sont DECOUPES dans la
       forme (fill-rule evenodd) au lieu d'etre peints en sombre. C'est
       indispensable — le fichier sert aussi de MASQUE pour la lueur de l'icone
       selectionnee (.cat-glow-inner), et un masque ne lit que l'opacite : une
       zone peinte en noir resterait pleine dans la lueur. La croix est un seul
       trace en forme de plus, et non deux rectangles croises : avec evenodd,
       deux creux qui se chevauchent se REMPLISSENT a leur intersection.

       Comme « shipping icon.svg », a remplacer par un PNG en changeant le nom
       de fichier dans DATA (index.html). -->
  <g fill="#fff">
    <path fill-rule="evenodd" d="
      M168 152h176c50 0 84 28 96 78l34 136c10 40-14 70-52 70-24 0-42-12-58-32l-34-44H182l-34 44c-16 20-34 32-58 32-38 0-62-30-52-70l34-136c12-50 46-78 96-78z
      M149 215 H179 V252 H216 V282 H179 V319 H149 V282 H112 V252 H149 Z
      M356 220 a20 20 0 1 0 0 40 a20 20 0 1 0 0-40 Z
      M398 268 a20 20 0 1 0 0 40 a20 20 0 1 0 0-40 Z
    "/>
  </g>
</svg>
